        <div class="app-main">

    <script>

        function shuffleFallback() {

        function stripHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return div.textContent || div.innerText || '';
        }

        function createSummary(text, maxLen) {
            const clean = stripHtml(text).replace(/\s+/g, ' ').trim();
            if (clean.length <= maxLen) return clean;
            let cut = clean.slice(0, maxLen);
            const lastPunct = cut.search(/[。！？]$/);
            if (lastPunct === -1) {
                const lastComma = cut.lastIndexOf('，');
                if (lastComma > maxLen * 0.5) cut = cut.slice(0, lastComma + 1);
                else cut = cut + '…';
            }
            return cut;
        }

        /** 從 RSS item / Atom entry 取出單篇文章網址（避免選到 rel=self 或只連到網站首頁） */
        function getItemPermalink(el) {
            const links = el.querySelectorAll('link');
            for (let j = 0; j < links.length; j++) {
                const node = links[j];
                let href = (node.getAttribute('href') || '').trim();
                if (!href) href = (node.textContent || '').trim();
                if (!href || !/^https?:\/\//i.test(href)) continue;
                const rel = (node.getAttribute('rel') || '').toLowerCase();
                const type = (node.getAttribute('type') || '').toLowerCase();
                if (rel === 'self' || rel === 'enclosure' || rel === 'replies') continue;
                if (type === 'application/atom+xml' || type === 'application/rss+xml') continue;
                if (rel === 'alternate' || rel === 'edit' || rel === '') {
                    if (!type || type.includes('html') || type === '') return href;
                }
            }
            const rssLink = el.querySelector('link');
            if (rssLink) {
                const href = (rssLink.getAttribute('href') || '').trim();
                if (href && /^https?:\/\//i.test(href)) return href;
                const txt = (rssLink.textContent || '').trim();
                if (/^https?:\/\//i.test(txt)) return txt;
            }
            const guid = el.querySelector('guid');
            if (guid) {
                const g = (guid.textContent || '').trim();
                if (/^https?:\/\//i.test(g)) return g;
            }
            return '#';
        }

        const ITEMS_PER_FEED = 14;

        /** 滾動 7 天：發布時間在「現在往前 7×24 小時」內（本地時間） */
        function getRolling7DaysWindowMs() {
            const nowMs = Date.now();
            const startMs = nowMs - 7 * 24 * 60 * 60 * 1000;
            return { startMs, nowMs };
        }

        function loadFeedShown7d() {
            try {
                const raw = localStorage.getItem(FEED_SHOWN_7D_KEY);
                const data = raw ? JSON.parse(raw) : null;
                return Array.isArray(data && data.keys) ? data.keys : [];
            } catch (e) {
                return [];
            }
        }

        function saveFeedShown7d(keys) {
            try {

                    FEED_SHOWN_7D_KEY,

            } catch (e) { /* quota */ }

        /** 移除已不在目前 7 天池內的 key，避免快取無限累積 */
        function pruneFeedShownToPool(poolAll) {
            const valid = new Set(poolAll.map(articleStableKey));
            const pruned = loadFeedShown7d().filter((k) => valid.has(k));
            saveFeedShown7d(pruned);
            return pruned;
        }

        function appendFeedShownKeys(newKeys) {
            const set = new Set(loadFeedShown7d());
            newKeys.forEach((k) => {
                if (k) set.add(k);
            });
            saveFeedShown7d([...set]);
        }

        function wrapFallbackList(list) {
            return list.map((item) => ({ ...item, _fromFallback: true }));
        }

        function parsePubDateToMs(dateStr) {
            if (!dateStr || !String(dateStr).trim()) return NaN;
            const t = Date.parse(String(dateStr).trim());
            return Number.isFinite(t) ? t : NaN;
        }

        function articleStableKey(item) {
            return String(item.link || '') + '\n' + String(item.title || '');
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function parseRssXml(xmlText) {
            const items = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'text/xml');
                let entries = doc.querySelectorAll('item');
                if (entries.length === 0) entries = doc.querySelectorAll('entry');
                entries.forEach((el, i) => {
                    if (i >= ITEMS_PER_FEED) return;
                    const title = el.querySelector('title')?.textContent?.trim() || '';
                    const link = getItemPermalink(el);
                    const desc = el.querySelector('description')?.textContent?.trim()
                        || el.querySelector('content')?.textContent?.trim()
                        || el.querySelector('summary')?.textContent?.trim() || '';
                    const pubDate = el.querySelector('pubDate')?.textContent?.trim()
                        || el.querySelector('published')?.textContent?.trim()
                        || el.querySelector('updated')?.textContent?.trim() || '';
                    const dateMs = parsePubDateToMs(pubDate);
                    if (title && (desc || title)) {
                        items.push({
                            title,
                            link,
                            summary: createSummary(desc || title, SUMMARY_LENGTH),
                            date: pubDate,
                            dateMs
                        });
                    }
                });
            } catch (e) { console.warn('RSS parse error', e); }
            return items;
        }

        async function fetchRss(source) {
            const sep = source.url.includes('?') ? '&' : '?';
            const bustedUrl = source.url + sep + '_nocache=' + Date.now() + '_' + Math.random().toString(36).slice(2);
            for (const proxy of CORS_PROXIES) {
                const proxyUrl = proxy + encodeURIComponent(bustedUrl) + (proxy.includes('allorigins') ? '&_=' + Date.now() : '');
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 12000);
                    const res = await fetch(proxyUrl, {
                        signal: ctrl.signal,
                        cache: 'no-store',
                        mode: 'cors'
                    });
                    clearTimeout(t);
                    if (!res.ok) continue;
                    const text = await res.text();
                    const items = parseRssXml(text);
                    if (items.length > 0) return items.map(it => ({ ...it, source: source.name }));
                } catch (e) { continue; }
            }
            return [];
        }

        /**
         * 從 RSS 取得文章；僅保留發布時間在「現在起往回滾動 7 天」內的項目（本地時間）。
         * 若 7 天內沒有任何符合筆數，或按「更新」時已無未顯示過的項目，則回傳示範清單（與舊版相同 fallback）。
         * @param {{ shuffleForRefresh?: boolean, excludeShown?: boolean }} options
         */
        async function loadArticles(options) {
            const shuffleForRefresh = Boolean(options && options.shuffleForRefresh);
            const excludeShown = Boolean(options && options.excludeShown);
            const { startMs, nowMs } = getRolling7DaysWindowMs();
            const upperMs = nowMs + 120000;

            const results = await Promise.all(RSS_SOURCES.map((src) => fetchRss(src)));
            let all = results.flat();
            const seenDup = new Set();
            all = all.filter((item) => {
                const key = articleStableKey(item);
                if (seenDup.has(key)) return false;
                seenDup.add(key);
                return true;
            });

            all.forEach((item) => {
                if (!Number.isFinite(item.dateMs)) {
                    item.dateMs = parsePubDateToMs(item.date);
                }
            });

            all = all.filter(
                (item) =>
                    Number.isFinite(item.dateMs) &&
                    item.dateMs >= startMs &&
                    item.dateMs <= upperMs
            );

            if (all.length === 0) {
                return wrapFallbackList(shuffleFallback());
            }

            all.sort((a, b) => (b.dateMs || 0) - (a.dateMs || 0));

            pruneFeedShownToPool(all);

            let pool = all;
            if (excludeShown) {
                const shown = new Set(loadFeedShown7d());
                pool = all.filter((item) => !shown.has(articleStableKey(item)));
                if (pool.length === 0) {
                    return wrapFallbackList(shuffleFallback());
                }
            }

            const limit = 30;
            if (shuffleForRefresh) {
                pool = shuffleArray(pool).slice(0, limit);
            } else {
                pool = pool.slice(0, limit);
            }

            return pool;
        }

            for (let i = 0; i < s.length; i++) {

        async function loadReadingQuiz(idx, regenerate) {

            const qBox = document.getElementById('quizQuestions' + idx);
            const scoreRow = document.getElementById('quizScoreRow' + idx);

            const setBusy = (busy) => {
                if (loadBtn) loadBtn.disabled = busy;
                if (regenBtn) regenBtn.disabled = busy;
            };

            if (!regenerate) {
                const cached = getQuizCache(a);
                if (cached && cached.questions && cached.questions.length >= 3) {
                    statusEl.textContent = '已從本機載入本題組。';
                    statusEl.classList.remove('err');
                    aiBox.classList.remove('hidden');
                    regenBtn.classList.remove('hidden');
                    renderQuizUi(idx, cached);
                    return;
                }
            } else {
                clearQuizCacheEntry(a);
            }

            statusEl.classList.remove('err');
            statusEl.textContent = regenerate ? 'AI 正在重新出題…' : 'AI 正在生成精華短文與題目…';
            setBusy(true);
            aiBox.classList.add('hidden');
            aiBox.innerHTML = '';
            qBox.innerHTML = '';
            scoreRow.innerHTML = '';

            try {
                const res = await fetch(ENJOYREAD_QUIZ_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: a.title,
                        summary: a.summary,
                        regenerate: Boolean(regenerate),
                        generationId: regenerate
                            ? ('r' + Date.now() + Math.random().toString(36).slice(2))
                            : stableGenId(a),
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    maybeExplainApiFailure(res.status, data.error);
                    throw new Error(data.error || ('HTTP ' + res.status));
                }
                if (data.error && (!data.questions || data.questions.length < 3)) {
                    maybeExplainApiFailure(503, data.error);
                    throw new Error(data.error);
                }
                if (!data.questions || data.questions.length < 3) {
                    throw new Error('題目資料不完整，請稍後再試。');
                }
                setQuizCache(a, {
                    summary: data.summary || a.summary,
                    questions: data.questions,
                    provider: data.provider,
                });
                statusEl.textContent = '已完成。請閱讀上方精華短文並作答。';
                regenBtn.classList.remove('hidden');
                renderQuizUi(idx, data);
            } catch (e) {
                statusEl.textContent = '無法取得題目：' + (e.message || '未知錯誤');
                statusEl.classList.add('err');
            } finally {
                setBusy(false);
            }
        }

        function renderQuizUi(idx, data) {
            const aiBox = document.getElementById('aiSummary' + idx);
            const qBox = document.getElementById('quizQuestions' + idx);
            const scoreRow = document.getElementById('quizScoreRow' + idx);

            const aiText = (data.summary || '').trim();
            if (aiText) {
                aiBox.innerHTML = '<div class="ai-summary-block"><h4>AI 精華短文</h4><p>' + esc(aiText).replace(/\n/g, '<br>') + '</p></div>';
                aiBox.classList.remove('hidden');
            } else {
                aiBox.classList.add('hidden');
            }

            scoreRow.innerHTML = '';
            const qs = data.questions || [];
            qBox.innerHTML = qs.map((q, qIdx) => {
                const opts = (q.options || []).slice(0, 4);
                const optHtml = opts.map((opt, oIdx) => `
            <label class="quiz-opt-label" data-o="${oIdx}">
                <input type="radio" name="quiz_${idx}_${qIdx}" value="${oIdx}" />
                <span>${esc(opt)}</span>
            </label>
        `).join('');
                return `
            <div class="quiz-q" id="quizQ_${idx}_${qIdx}">
                <div class="quiz-q-title">${qIdx + 1}. ${esc(q.question || '')}</div>
                <div class="quiz-options">${optHtml}</div>
                <div class="quiz-explanation" id="quizExpl_${idx}_${qIdx}">${esc(q.explanation || '')}</div>
            </div>
        `;
            }).join('');

            qBox.innerHTML += `<div class="quiz-submit-row"><button type="button" class="quiz-btn quiz-btn-primary" onclick="submitReadingQuiz(${idx})">✓ 交卷對答案</button></div>`;
        }

        function submitReadingQuiz(idx) {
            const a = articles[idx];
            if (!a) return;
            const cached = getQuizCache(a);
            const qs = cached && cached.questions ? cached.questions : [];
            if (!qs.length) return;

            let correct = 0;
            qs.forEach((q, qIdx) => {
                const sel = document.querySelector(`input[name="quiz_${idx}_${qIdx}"]:checked`);
                const picked = sel ? Number(sel.value) : -1;
                if (picked === q.correctIndex) correct += 1;

                const wrap = document.getElementById('quizQ_' + idx + '_' + qIdx);
                if (!wrap) return;
                const labels = wrap.querySelectorAll('.quiz-opt-label');
                labels.forEach((lb) => {
                    const o = Number(lb.getAttribute('data-o'));
                    lb.classList.remove('reveal-correct', 'reveal-wrong');
                    if (o === q.correctIndex) lb.classList.add('reveal-correct');
                    if (picked === o && o !== q.correctIndex) lb.classList.add('reveal-wrong');
                });
                const expl = document.getElementById('quizExpl_' + idx + '_' + qIdx);
                if (expl) expl.classList.add('show');
            });

            const scoreRow = document.getElementById('quizScoreRow' + idx);
            const pct = Math.round((correct / qs.length) * 100);
            scoreRow.innerHTML = '<div class="quiz-score">得分：' + correct + ' / ' + qs.length + '（' + pct + '%）</div>';

            const submitBtn = document.querySelector('#quizQuestions' + idx + ' .quiz-submit-row button');
            if (submitBtn) submitBtn.disabled = true;
        }

        let chatContextIdx = 0;
        let chatTurns = [];

        function buildArticleContextForChat(idx) {
            const a = articles[idx];
            if (!a) {
                return { title: '', content: '（尚無文章）' };
            }
            const lines = [
                '【來源】' + (a.source || ''),
                '【標題】' + a.title,
                '【列表摘要】' + a.summary,
            ];
            const cached = getQuizCache(a);
            if (cached && cached.summary) {
                lines.push('【AI 精華短文】\n' + cached.summary);
            }
            return { title: a.title, content: lines.join('\n\n') };
        }

        function setChatContextFromCard(idx) {
            if (typeof idx !== 'number' || idx < 0 || !articles[idx]) {
                return;
            }
            chatContextIdx = idx;
            updateChatContextDisplay();
        }

        function updateChatContextDisplay() {
            const el = document.getElementById('chatContextTitle');
            if (!el) return;
            const a = articles[chatContextIdx];
            if (!a) {
                el.textContent = '請先載入文章列表';
                return;
            }
            const short = a.title.length > 40 ? a.title.slice(0, 40) + '…' : a.title;
            el.textContent = short + '（' + (a.source || '') + '）';
        }

        function seedChatWelcome() {
            const box = document.getElementById('chatMessages');
            if (!box || box.dataset.seeded === '1') {
                return;
            }
            appendChatRow(
                'assistant',
                '你好！我是閱讀小助手。你可以直接問任何問題（學習、語文、英文、文章理解都可以）；若你有點選文章，我也會把該篇內容當作參考。'
            );
            box.dataset.seeded = '1';
            chatTurns = [];
        }

        function appendChatRow(role, text) {
            const box = document.getElementById('chatMessages');
            if (!box) return;
            const row = document.createElement('div');
            row.className = 'wa-row ' + (role === 'user' ? 'wa-row--user' : 'wa-row--bot');
            const inner = document.createElement('div');
            inner.className = 'wa-inner';
            const av = document.createElement('div');
            av.className = 'wa-emoji-av';
            av.setAttribute('aria-hidden', 'true');
            av.textContent = role === 'user' ? '🧑‍🎓' : '🤖';
            const col = document.createElement('div');
            col.className = 'wa-bubble-col';
            const bubble = document.createElement('div');
            bubble.className = 'wa-bubble ' + (role === 'user' ? 'wa-bubble--user' : 'wa-bubble--bot');
            bubble.textContent = text;
            if (role === 'user') {
                col.appendChild(bubble);
                inner.appendChild(col);
                inner.appendChild(av);
            } else {
                col.appendChild(bubble);
                inner.appendChild(av);
                inner.appendChild(col);
            }
            row.appendChild(inner);
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function clearChat() {
            chatTurns = [];
            const box = document.getElementById('chatMessages');
            if (box) {
                box.innerHTML = '';
                delete box.dataset.seeded;
            }
            seedChatWelcome();
        }

        async function submitChat(ev) {
            if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
            const input = document.getElementById('chatInput');
            const text = (input && input.value || '').trim();
            if (!text) return;
            const ctx = buildArticleContextForChat(chatContextIdx);
            const hasArticleContext = ctx.content && ctx.content !== '（尚無文章）';

            appendChatRow('user', text);
            chatTurns.push({ role: 'user', content: text });
            if (input) input.value = '';

            const btn = document.getElementById('chatSendBtn');
            if (btn) btn.disabled = true;
            try {
                const res = await fetch(ENJOYREAD_CHAT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        articleTitle: hasArticleContext ? ctx.title : '',
                        articleContent: hasArticleContext ? ctx.content : '',
                        messages: chatTurns,
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const errText = data.error || ('HTTP ' + res.status);
                    maybeExplainApiFailure(res.status, errText);
                    const shown =
                        '抱歉，目前無法取得回覆：' +
                        errText +
                        (res.status === 503 ? '\n\n請展開上方「AI 無法回覆」區塊，依說明設定 Worker 的 DEEPSEEK_API_KEY。' : '');
                    appendChatRow('assistant', shown);
                    chatTurns.push({ role: 'assistant', content: errText });
                    return;
                }
                let answer =
                    typeof data.answer === 'string'
                        ? data.answer
                        : data.answer != null
                          ? String(data.answer)
                          : typeof data.error === 'string'
                            ? data.error
                            : '';
                answer = answer.trim() || '沒有取得回覆。';
                appendChatRow('assistant', answer);
                chatTurns.push({ role: 'assistant', content: answer });
            } catch (e) {
                const msg = e && e.message ? e.message : '未知錯誤';
                appendChatRow('assistant', '連線失敗：' + msg + '\n\n請確認網路，或展開上方說明檢查 API 網址與金鑰設定。');
                openChatApiHint();
                chatTurns.push({ role: 'assistant', content: msg });
            } finally {
                if (btn) btn.disabled = false;
                if (input) input.focus();
            }
        }

        function toggleChatDock() {
            const dock = document.getElementById('chatDock');
            const back = document.getElementById('chatBackdrop');
            if (!dock || !back) return;
            const open = dock.classList.toggle('open');
            back.classList.toggle('show', open);
        }

        function closeChatDock() {
            const dock = document.getElementById('chatDock');
            const back = document.getElementById('chatBackdrop');
            if (dock) dock.classList.remove('open');
            if (back) back.classList.remove('show');
        }

        let articles = [];
        let currentPlayingIdx = -1;
        let currentAudio = null;

        async function readSummary(idx) {
            const btn = document.getElementById('ttsBtn' + idx);
            if (!btn) return;
            setChatContextFromCard(idx);
            if (currentPlayingIdx === idx) {
                stopCurrentSpeech();
                return;
            }
            stopCurrentSpeech();
            currentPlayingIdx = idx;
            const summary = articles[idx]?.summary;
            if (!summary) return;

            addToHistory(articles[idx]);

            document.querySelectorAll('.tts-btn').forEach(b => {
                b.classList.remove('playing');
                b.textContent = b.dataset.defaultText || '🔊 普通話朗讀摘要';
            });
            btn.classList.add('playing');
            btn.textContent = '⏳ 生成普通話...';

            try {
                const res = await fetch(EDGE_TTS_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'tts-1',
                        input: summary,
                        voice: getVoicePreference(),
                        speed: 1
                    })
                });
                if (!res.ok) throw new Error('Edge TTS failed: ' + res.status);
                const blob = await res.blob();
                currentAudio = new Audio(URL.createObjectURL(blob));
                btn.textContent = btn.dataset.stopText || '⏸ 停止朗讀';
                currentAudio.onended = () => {
                    if (currentAudio && currentAudio.src && currentAudio.src.startsWith('blob:')) {
                        try { URL.revokeObjectURL(currentAudio.src); } catch (e) { /* ignore */ }
                    }
                    currentAudio = null;
                    resetTtsButton(btn);
                };
                currentAudio.onerror = () => {
                    if (currentAudio && currentAudio.src && currentAudio.src.startsWith('blob:')) {
                        try { URL.revokeObjectURL(currentAudio.src); } catch (e) { /* ignore */ }
                    }
                    currentAudio = null;
                    resetTtsButton(btn);
                    readWithBrowserMandarin(summary, btn);
                };
                await currentAudio.play();
            } catch (e) {
                readWithBrowserMandarin(summary, btn);
            }
        }

        function stopCurrentSpeech() {
            speechSynthesis.cancel();
            if (currentAudio) {
                if (currentAudio.src && currentAudio.src.startsWith('blob:')) {
                    try { URL.revokeObjectURL(currentAudio.src); } catch (e) { /* ignore */ }
                }
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayingIdx >= 0) {
                const oldBtn = document.getElementById('ttsBtn' + currentPlayingIdx);
                if (oldBtn) resetTtsButton(oldBtn);
            }
            currentPlayingIdx = -1;
        }

        function resetTtsButton(btn) {
            currentPlayingIdx = -1;
            btn.classList.remove('playing');
            btn.textContent = btn.dataset.defaultText || '🔊 普通話朗讀摘要';
        }

        function readWithBrowserMandarin(summary, btn) {
            if (!('speechSynthesis' in window)) {
                alert('無法連線至朗讀服務，且您的瀏覽器不支援離線朗讀。請稍後再試或換用其他瀏覽器。');
                resetTtsButton(btn);
                return;
            }
            const u = new SpeechSynthesisUtterance(summary);
            u.lang = 'zh-CN';
            const voice = pickMandarinVoice();
            if (voice) u.voice = voice;
            u.rate = 1;
            btn.textContent = btn.dataset.stopText || '⏸ 停止朗讀';
            u.onend = () => resetTtsButton(btn);
            u.onerror = () => resetTtsButton(btn);
            speechSynthesis.speak(u);
        }

        function getVoicePreference() {
            return document.getElementById('mandarinVoice')?.value || 'auto';
        }

        function pickMandarinVoice() {
            const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
            if (!voices.length) return null;
            const preference = getVoicePreference();
            const mandarinVoices = voices.filter((voice) => {
                const lang = (voice.lang || '').toLowerCase();
                const name = (voice.name || '').toLowerCase();
                return lang.includes('zh-cn') || lang.includes('zh-hans') || name.includes('mandarin') || name.includes('普通话') || name.includes('xiaoxiao') || name.includes('yun');
            });

            const list = mandarinVoices.length ? mandarinVoices : voices;
            const matchers = {
                shimmer: ['xiaoxiao', 'female', 'woman', '女'],
                onyx: ['xiaoyi', 'xiaoxiao', 'female', 'woman', '女'],
                alloy: ['yunyang', 'yunjian', 'male', 'man', '男'],
                nova: ['yunxi', 'young', 'male', 'man', '男'],
                child: ['xiaoshuang', 'kid', 'child', '童', 'children'],
            }[preference] || [];

            const preferred = list.find((voice) => {
                const text = `${voice.name} ${voice.lang}`.toLowerCase();
                return matchers.some((matcher) => text.includes(matcher));
            });

            return preferred || mandarinVoices[0] || null;
        }

        function showLoadingMessage(msg) {
            document.getElementById('contentArea').innerHTML =
                '<div class="loading"><div class="loading-spinner"></div><p>' + msg + '</p></div>';
        }

        async function loadAndRenderArticles(loadingMsg, options) {
            if (loadingMsg) showLoadingMessage(loadingMsg);
            try {
                articles = await loadArticles(options || {});
                if (!articles || articles.length === 0) {
                    articles = wrapFallbackList(shuffleFallback());
                }
                const fromFb = articles.some((a) => a._fromFallback === true);
                articles = articles.map((a) => {
                    const { _fromFallback, ...rest } = a;
                    return rest;
                });
                if (!fromFb) {
                    appendFeedShownKeys(articles.map((a) => articleStableKey(a)));
                }
                renderArticles(articles);
            } catch (e) {
                console.warn(e);
                articles = wrapFallbackList(shuffleFallback()).map(({ _fromFallback, ...r }) => r);
                renderArticles(articles);
            }
        }

        async function init() {
            const chatFormEl = document.getElementById('chatForm');
            const chatSendBtnEl = document.getElementById('chatSendBtn');
            if (chatSendBtnEl) chatSendBtnEl.disabled = false;
            if (chatFormEl) {
                // 避免只靠 inline onsubmit，某些環境會造成送出事件失效
                chatFormEl.addEventListener('submit', submitChat);
            }
            seedChatWelcome();
            await loadAndRenderArticles('正在搜集最新文章...');
        }

        async function refreshArticles() {
            if (viewMode === 'history') return;
            const btn = document.getElementById('refreshBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ 更新中...';
            }
            if (typeof speechSynthesis !== 'undefined') {
                speechSynthesis.cancel();
                currentPlayingIdx = -1;
            }
            await loadAndRenderArticles('正在重新抓取最新文章，請稍候…', {
                shuffleForRefresh: true,
                excludeShown: true,
            });
            if (btn) {
                btn.disabled = false;
                btn.textContent = '🔄 更新';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => init());
        } else {
            init();
        }
    </script>
</body>
</html>
