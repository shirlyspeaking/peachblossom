<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 若你自建 Worker，可改此網址；或在瀏覽器主控台執行：localStorage.setItem('enjoyread_quiz_api_base','https://你的網域') 後重新整理 -->
    <meta name="enjoyread-quiz-api" content="https://peachblossom-enjoyread-quiz.shirlyspeaking.workers.dev" />
    <title>「摸魚」俱樂部 Loafing Club - 世界各地的有趣文章</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            color-scheme: light;
            --paper: #fbf7f1;
            --paper-2: #f3ebe0;
            --card: #fffdf9;
            --ink: #2a2420;
            --ink-soft: #62564e;
            --ink-faint: #998a7f;
            --line: #ebe1d5;
            --line-strong: #dccfbf;
            --peach: #e07a6b;
            --peach-deep: #a8463c;
            --peach-soft: #fae3dc;
            --gold: #c48a2c;
            --gold-soft: #f8ecd3;
            --shadow: 0 1px 2px rgb(70 45 30 / 0.05), 0 10px 28px rgb(70 45 30 / 0.06);
            --shadow-hover: 0 2px 4px rgb(70 45 30 / 0.06), 0 18px 40px rgb(70 45 30 / 0.10);
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
            --serif: "Noto Serif TC", "Songti TC", serif;
            --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--sans);
            color: var(--ink);
            background:
                radial-gradient(1200px 500px at 85% -10%, #fbe4dc 0%, transparent 60%),
                radial-gradient(900px 400px at -10% 20%, #f6eedf 0%, transparent 60%),
                var(--paper);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        button { font: inherit; color: inherit; }
        a { color: inherit; }
        .hidden { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------- 版面 ---------- */
        .app-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            min-height: 100vh;
        }
        .app-main { min-width: 0; padding: 0 32px 72px; }
        .main-inner { max-width: 880px; margin: 0 auto; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 0 8px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--ink-soft);
            text-decoration: none;
            padding: 6px 12px 6px 8px;
            border-radius: 999px;
            transition: background 0.2s;
        }
        .back-link:hover { background: var(--paper-2); color: var(--ink); }
        .back-link svg { width: 16px; height: 16px; }

        .masthead {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 240px;
            align-items: center;
            gap: 24px;
            padding: 18px 0 26px;
            border-bottom: 1px solid var(--line);
        }
        .masthead-date {
            font-size: 0.82rem;
            letter-spacing: 0.14em;
            color: var(--peach-deep);
            font-weight: 500;
            margin-bottom: 10px;
        }
        .masthead h1 {
            font-family: var(--serif);
            font-size: clamp(2rem, 5vw, 2.9rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.15;
        }
        .masthead h1 small {
            display: block;
            font-family: var(--sans);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.32em;
            color: var(--ink-faint);
            margin-top: 8px;
            text-transform: uppercase;
        }
        .masthead-tagline {
            margin-top: 14px;
            color: var(--ink-soft);
            line-height: 1.8;
            max-width: 34em;
        }
        .masthead-art { width: 100%; height: auto; }

        /* ---------- 分頁與工具列 ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 0;
            background: color-mix(in srgb, var(--paper) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .tabs { display: flex; gap: 4px; }
        .tab {
            position: relative;
            border: 0;
            background: transparent;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 500;
            color: var(--ink-soft);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .tab:hover { background: var(--paper-2); color: var(--ink); }
        .tab[aria-selected="true"] { color: var(--ink); background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgb(70 45 30 / 0.06); }
        .tab-badge {
            display: inline-grid;
            place-items: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            margin-left: 4px;
            border-radius: 999px;
            background: var(--gold-soft);
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 700;
            vertical-align: 1px;
        }
        .toolbar-right { display: flex; align-items: center; gap: 10px; }
        .voice-select {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px 4px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
            font-size: 0.84rem;
            color: var(--ink-soft);
        }
        .voice-select svg { width: 16px; height: 16px; color: var(--peach-deep); }
        .voice-select select {
            border: 0;
            background: transparent;
            font: inherit;
            color: var(--ink);
            padding: 4px 4px;
            cursor: pointer;
            outline: none;
        }
        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border: 0;
            border-radius: 999px;
            background: var(--ink);
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s var(--ease), background 0.2s;
        }
        .refresh-btn:hover { background: #45392f; transform: translateY(-1px); }
        .refresh-btn:disabled { opacity: 0.7; cursor: progress; transform: none; }
        .refresh-btn svg { width: 16px; height: 16px; }
        .refresh-btn.busy svg { animation: spin 0.9s linear infinite; }

        .filters {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 16px 0 6px;
        }
        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.18s;
        }
        .chip:hover { border-color: var(--line-strong); color: var(--ink); }
        .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
        .chip-sep { width: 1px; height: 20px; background: var(--line-strong); margin: 0 4px; }
        .feed-status { font-size: 0.82rem; color: var(--ink-faint); padding: 6px 0 18px; min-height: 2.2em; }

        /* ---------- 文章卡 ---------- */
        .card-list { display: flex; flex-direction: column; gap: 18px; }
        .card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 216px;
            gap: 0 26px;
            padding: 22px 22px 20px 26px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s var(--ease), transform 0.3s var(--ease), border-color 0.3s;
            animation: rise 0.45s var(--ease) both;
        }
        .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: var(--line-strong); }
        .card.is-context { border-color: color-mix(in srgb, var(--peach) 45%, var(--line)); }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .card-body { min-width: 0; display: flex; flex-direction: column; }
        .card-kicker {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--ink-faint);
            margin-bottom: 10px;
        }
        .cat-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--cat-bg, var(--paper-2));
            color: var(--cat-ink, var(--ink-soft));
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .card-source { color: var(--ink-soft); font-weight: 500; }
        .region-tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 0.74rem; }
        .card-title {
            font-family: var(--serif);
            font-size: 1.24rem;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.01em;
            margin-bottom: 10px;
        }
        .card[lang="en"] .card-title { font-family: Georgia, "Times New Roman", var(--serif); letter-spacing: 0; }
        .card-title a { text-decoration: none; background-image: linear-gradient(var(--peach), var(--peach)); background-size: 0 2px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size 0.3s var(--ease); }
        .card-title a:hover { background-size: 100% 2px; }
        .card-excerpt {
            font-size: 0.97rem;
            line-height: 1.8;
            color: var(--ink-soft);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .card[lang="en"] .card-excerpt { line-height: 1.7; }
        .card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }

        .card-figure {
            grid-column: 2;
            grid-row: 1;
            align-self: start;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            overflow: hidden;
            background: var(--paper-2);
            position: relative;
            box-shadow: inset 0 0 0 1px rgb(70 45 30 / 0.06);
        }
        .card-figure img, .card-figure svg { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
        .card:hover .card-figure img, .card:hover .card-figure svg { transform: scale(1.04); }

        /* 聆聽按鈕 */
        .listen-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 4px 4px;
            border: 0;
            border-radius: 999px;
            background: var(--peach-soft);
            color: var(--peach-deep);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.2s var(--ease);
        }
        .listen-btn:hover { background: #f7d6cc; transform: translateY(-1px); }
        .listen-icon {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(140deg, #ef9584 0%, #c8574a 100%);
            box-shadow: 0 4px 12px rgb(200 87 74 / 0.35);
        }
        .listen-icon svg { width: 16px; height: 16px; }
        .listen-meta { font-weight: 400; font-size: 0.78rem; opacity: 0.75; }
        .listen-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
        .listen-eq i { display: block; width: 3px; border-radius: 2px; background: #fff; animation: eq 0.9s ease-in-out infinite; }
        .listen-eq i:nth-child(1) { height: 6px; }
        .listen-eq i:nth-child(2) { height: 14px; animation-delay: -0.3s; }
        .listen-eq i:nth-child(3) { height: 9px; animation-delay: -0.6s; }
        .listen-btn.playing .listen-eq { display: flex; }
        .listen-btn.playing .listen-spk { display: none; }
        .listen-btn.playing .listen-icon { animation: pulse 1.6s ease-out infinite; }
        .listen-btn.loading .listen-icon::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--peach-deep);
            animation: spin 0.8s linear infinite;
        }
        @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(200 87 74 / 0.45); } 100% { box-shadow: 0 0 0 12px rgb(200 87 74 / 0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .act-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.18s;
        }
        .act-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .act-btn:hover { border-color: var(--line-strong); color: var(--ink); background: var(--paper); }
        .act-btn:disabled { opacity: 0.6; cursor: progress; }
        .act-btn.quiz svg { color: #7a5cc2; }
        .act-btn.quiz[aria-expanded="true"] { background: #f1ecfa; border-color: #dcd0f2; color: #4f3a8c; }
        .act-btn.save[aria-pressed="true"] { background: var(--gold-soft); border-color: #ecd7a8; color: #8a5f17; }
        .act-btn.save[aria-pressed="true"] svg path { fill: currentColor; }
        .act-link { margin-left: auto; border-color: transparent; }

        /* AI 出題 */
        .quiz-panel {
            grid-column: 1 / -1;
            margin-top: 18px;
            padding: 18px 20px 20px;
            border-radius: 16px;
            background: linear-gradient(180deg, #f7f3fc 0%, #fbf9fd 100%);
            border: 1px solid #e6def4;
            animation: rise 0.35s var(--ease) both;
        }
        .quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
        .quiz-head h3 { font-size: 0.95rem; color: #4f3a8c; display: flex; align-items: center; gap: 6px; }
        .quiz-head h3 svg { width: 18px; height: 18px; }
        .quiz-status { font-size: 0.86rem; color: var(--ink-soft); min-height: 1.2em; }
        .quiz-status.err { color: #b4382c; }
        .quiz-status .dots::after { content: "…"; animation: blink 1.2s steps(3) infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .ai-summary-block {
            font-size: 0.94rem;
            line-height: 1.85;
            background: #fff;
            border: 1px solid #ece5f6;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 8px 0 16px;
        }
        .ai-summary-block h4 { font-size: 0.75rem; letter-spacing: 0.12em; color: #7a5cc2; margin-bottom: 6px; }
        .quiz-q { margin-bottom: 16px; }
        .quiz-q-title { font-weight: 700; margin-bottom: 8px; line-height: 1.6; }
        .quiz-options { display: grid; gap: 6px; }
        .quiz-options label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e6def4;
            background: #fff;
            cursor: pointer;
            font-size: 0.92rem;
            line-height: 1.55;
            transition: border-color 0.15s, background 0.15s;
        }
        .quiz-options label:hover { border-color: #c7b6ea; }
        .quiz-options label:has(input:checked) { border-color: #8f72d4; background: #f5f0fd; }
        .quiz-options input { margin-top: 4px; accent-color: #7a5cc2; }
        .quiz-options label.reveal-correct { border-color: #4f9a6a; background: #eaf6ee; }
        .quiz-options label.reveal-wrong { border-color: #d0695c; background: #fcefed; }
        .quiz-explanation { display: none; font-size: 0.86rem; color: var(--ink-soft); margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: #fff; border-left: 3px solid #c7b6ea; line-height: 1.7; }
        .quiz-explanation.show { display: block; }
        .quiz-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
        .quiz-submit { background: #4f3a8c; color: #fff; border: 0; padding: 9px 20px; border-radius: 999px; font-weight: 700; cursor: pointer; }
        .quiz-submit:disabled { opacity: 0.5; cursor: default; }
        .quiz-score { font-weight: 700; color: #4f3a8c; }

        /* 空狀態、紀錄 */
        .empty {
            text-align: center;
            padding: 56px 24px;
            color: var(--ink-soft);
            line-height: 1.8;
            background: var(--card);
            border: 1px dashed var(--line-strong);
            border-radius: 20px;
        }
        .empty svg { width: 120px; height: auto; margin-bottom: 12px; }
        .empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
        .history-list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px 22px; box-shadow: var(--shadow); }
        .history-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
        .history-item:last-child { border-bottom: 0; }
        .history-item time { font-size: 0.78rem; color: var(--ink-faint); padding-top: 3px; }
        .history-item h3 { font-size: 1rem; font-family: var(--serif); line-height: 1.5; }
        .history-item h3 a { text-decoration: none; }
        .history-item h3 a:hover { color: var(--peach-deep); }
        .history-item p { font-size: 0.8rem; color: var(--ink-faint); margin-top: 2px; }
        .list-footer { text-align: center; padding: 18px 0 0; }
        .ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--ink-soft); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; }
        .ghost-btn:hover { background: var(--card); color: var(--ink); }

        .loading { text-align: center; padding: 64px 0; color: var(--ink-soft); }
        .loading svg { width: 96px; height: auto; animation: bob 2.4s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .skeleton { height: 196px; border-radius: 20px; background: linear-gradient(90deg, var(--paper-2) 0%, #faf5ee 50%, var(--paper-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 20px);
            background: var(--ink);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.88rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s var(--ease);
            z-index: 300;
            box-shadow: 0 10px 30px rgb(0 0 0 / 0.18);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- 小助手 ---------- */
        .chat-dock {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fffaf4;
            border-left: 1px solid var(--line);
            z-index: 50;
        }
        .chat-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fdeee7 0%, #fffaf4 100%);
        }
        .chat-head svg.fish-badge { width: 54px; height: 54px; flex-shrink: 0; }
        .chat-head strong { display: block; font-family: var(--serif); font-size: 1.05rem; }
        .chat-head span { font-size: 0.8rem; color: var(--ink-soft); }
        .chat-close { margin-left: auto; border: 0; background: transparent; font-size: 1.4rem; line-height: 1; color: var(--ink-faint); cursor: pointer; display: none; }
        .chat-context {
            margin: 12px 14px 0;
            padding: 9px 12px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 0.8rem;
            color: var(--ink-soft);
            line-height: 1.5;
        }
        .chat-context b { color: var(--peach-deep); font-weight: 700; margin-right: 4px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
        .msg--user { flex-direction: row-reverse; }
        .msg-av { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; }
        .msg--bot .msg-av { background: var(--peach-soft); }
        .msg--bot .msg-av svg { width: 22px; height: 22px; }
        .msg--user .msg-av { background: var(--ink); color: #fff; }
        .msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; max-width: calc(100% - 40px); }
        .msg--bot .msg-bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        .msg--user .msg-bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
        .chat-form { padding: 12px 14px 16px; border-top: 1px solid var(--line); }
        .chat-input-wrap { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 16px; padding: 6px 6px 6px 12px; transition: border-color 0.2s, box-shadow 0.2s; }
        .chat-input-wrap:focus-within { border-color: var(--peach); box-shadow: 0 0 0 3px rgb(224 122 107 / 0.15); }
        .chat-input-wrap textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; font: inherit; font-size: 0.88rem; line-height: 1.6; padding: 6px 0; max-height: 120px; min-height: 44px; }
        .chat-send-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--peach-deep); color: #fff; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }

        .chat-clear-btn { margin-top: 8px; border: 0; background: transparent; color: var(--ink-faint); font-size: 0.78rem; cursor: pointer; }
        .chat-clear-btn:hover { color: var(--ink); }
        .chat-fab {
            display: none;
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 80;
            align-items: center;
            gap: 8px;

            background: var(--card);

            font-weight: 700;
            cursor: pointer;
        }
        .chat-fab svg { width: 38px; height: 38px; }
        .chat-backdrop { display: none; position: fixed; inset: 0; background: rgb(42 36 32 / 0.35); z-index: 90; }
        .chat-backdrop.show { display: block; }

        @media (max-width: 1180px) {
            .app-layout { grid-template-columns: minmax(0, 1fr); }
            .chat-dock {
                position: fixed;
                top: 0;
                right: 0;
                width: min(380px, 92vw);
                transform: translateX(105%);
                transition: transform 0.3s var(--ease);
                z-index: 100;
                box-shadow: -12px 0 40px rgb(70 45 30 / 0.18);
            }
            .chat-dock.open { transform: none; }
            .chat-close { display: block; }
            .chat-fab { display: inline-flex; }
        }
        @media (max-width: 720px) {
            .app-main { padding: 0 16px 96px; }
            .masthead { grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; padding-top: 8px; }

        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }

    <script>
        const READ_HISTORY_KEY = 'enjoyread-read-history';
        const SAVED_KEY = 'enjoyread-saved-v1';
        /** 滾動 7 天內已在列表出現過的文章 key；按「換一批」時優先排除。 */
        const FEED_SHOWN_7D_KEY = 'enjoyread-feed-shown-7d-v1';
        const FEED_CACHE_KEY = 'enjoyread-feed-cache-v3';
        const FEED_API_PATH = '/api/enjoyread-feed';
        const QUIZ_CACHE_KEY = 'enjoyread-quiz-cache-v1';
        const MAX_HISTORY = 50;
        const MAX_SAVED = 100;
        const ROUND_SIZE = 8;
        const EDGE_TTS_ENDPOINT = 'https://peachblossom-edge-tts.shirlyspeaking.workers.dev/v1/audio/speech';

        const CATEGORIES = ['科學', '科技', '時尚', '生活', '旅遊', '運動', '文化', '國際'];
        const CATEGORY_STYLE = {
            '科學': { bg: '#e2eff0', bg2: '#c5dfe2', ink: '#2f6b73', en: 'SCIENCE', icon: '<path d="M9 3h6M10 3v6l-5.6 9.5A2 2 0 0 0 6.1 21.5h11.8a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/><circle cx="10" cy="18" r=".6"/><circle cx="13.5" cy="17" r=".6"/>' },
            '科技': { bg: '#e6e8f4', bg2: '#ccd2ec', ink: '#434f8c', en: 'TECH', icon: '<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/>' },
            '時尚': { bg: '#f7e3e6', bg2: '#edc6ce', ink: '#9a3f52', en: 'FASHION', icon: '<path d="M10 6a2 2 0 1 1 3 1.7c-.7.5-1 1-1 1.8V10"/><path d="M12 10 3.4 16.6a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"/>' },
            '生活': { bg: '#f6ecdb', bg2: '#ecd8b6', ink: '#8a6532', en: 'LIFESTYLE', icon: '<path d="M4 9h12v4a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H15.5"/><path d="M8 2.5c-.8 1 .8 2 0 3.5M12 2.5c-.8 1 .8 2 0 3.5"/>' },
            '旅遊': { bg: '#e1efe5', bg2: '#c4e0cd', ink: '#3c7452', en: 'TRAVEL', icon: '<path d="M2.5 11.5 21 3l-8.4 18.5-2.4-7.6z"/><path d="M10.2 13.9 21 3"/>' },
            '運動': { bg: '#fbe7da', bg2: '#f3cbb0', ink: '#a8532a', en: 'SPORTS', icon: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3.4 3.4 3.4 9.4 0 12.8M18.4 5.6c-3.4 3.4-3.4 9.4 0 12.8"/>' },
            '文化': { bg: '#efe5f3', bg2: '#dbc8e5', ink: '#6c4a80', en: 'CULTURE', icon: '<path d="M3 5.5c3-1.5 6-1.5 9 1 3-2.5 6-2.5 9-1V19c-3-1.5-6-1.5-9 1-3-2.5-6-2.5-9-1z"/><path d="M12 6.5V20"/>' },
            '國際': { bg: '#e3ebf5', bg2: '#c6d6ea', ink: '#36598a', en: 'WORLD', icon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>' },
        };
        const ICONS = {
            speaker: '<svg class="listen-spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a.8.8 0 0 0 1.3-.6V5.4a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg>',
            sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9z"/><path d="M19 3v3M17.5 4.5h3M5 17v3M3.5 18.5h3"/></svg>',
            bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.5-6.5 4.5v-16a1 1 0 0 1 1-1z" fill="none"/></svg>',
            external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
        };

        function getQuizApiBase() {
            try {
                const ls = localStorage.getItem('enjoyread_quiz_api_base');
                if (ls && /^https:\/\//i.test(ls.trim())) return ls.trim().replace(/\/$/, '');
            } catch (e) { /* ignore */ }
            const meta = document.querySelector('meta[name="enjoyread-quiz-api"]');
            const c = meta && meta.getAttribute('content');
            if (c && /^https:\/\//i.test(c.trim())) return c.trim().replace(/\/$/, '');
            return 'https://peachblossom-enjoyread-quiz.shirlyspeaking.workers.dev';
        }
        const ENJOYREAD_QUIZ_API = getQuizApiBase();
        const ENJOYREAD_CHAT_API = ENJOYREAD_QUIZ_API + '/chat';

        let articles = [];
        let feedPool = [];
        let feedFetchedAt = '';
        let feedFromCache = false;
        let viewMode = 'feed';
        let activeCategory = '全部';
        let activeLang = 'all';
        let chatContextIdx = -1;
        let chatTurns = [];
        let currentPlayingIdx = -1;
        let currentAudio = null;

        /* ---------- 小工具 ---------- */
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function readJson(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function writeJson(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* quota */ }
        }

        function articleStableKey(item) {
            return String(item.link || '') + '\n' + String(item.title || '');
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function relativeTime(iso) {
            const t = Date.parse(iso || '');
            if (!Number.isFinite(t)) return '';
            const diff = Date.now() - t;
            const min = Math.round(diff / 60000);
            if (min < 2) return '剛剛';
            if (min < 60) return min + ' 分鐘前';
            const hr = Math.round(min / 60);
            if (hr < 24) return hr + ' 小時前';
            const day = Math.round(hr / 24);
            if (day < 8) return day + ' 天前';
            return new Date(t).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
        }

        function formatClock(iso) {
            const t = Date.parse(iso || '');
            if (!Number.isFinite(t)) return '';
            return new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function listenSeconds(a) {
            const text = (a.summary || '') + (a.title || '');
            const sec = a.lang === 'en' ? text.split(/\s+/).length / 2.6 : text.length / 4.2;
            return Math.max(10, Math.round(sec / 5) * 5);
        }

        let toastTimer = 0;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function illustrationSvg(category, seedText) {
            const st = CATEGORY_STYLE[category] || CATEGORY_STYLE['生活'];
            let h = 0;
            const s = String(seedText || category);
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
            const r = (n) => Math.abs((h >> n) % 100);
            const gid = 'g' + Math.abs(h);
            return `<svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(category)}插圖">
                <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${st.bg}"/><stop offset="1" stop-color="${st.bg2}"/></linearGradient></defs>
                <rect width="240" height="180" fill="url(#${gid})"/>
                <circle cx="${170 + r(1) % 50}" cy="${20 + r(3) % 40}" r="${46 + r(5) % 24}" fill="#fff" opacity=".28"/>
                <circle cx="${20 + r(7) % 40}" cy="${150 - r(9) % 30}" r="${30 + r(11) % 20}" fill="#fff" opacity=".22"/>
                <path d="M0 ${140 + r(2) % 16} q30 -14 60 0 t60 0 60 0 60 0 V180 H0z" fill="#fff" opacity=".18"/>
                <use href="#petal" x="${24 + r(4) % 40}" y="${18 + r(6) % 30}" width="18" height="18" opacity=".8"/>
                <use href="#petal" x="${180 + r(8) % 30}" y="${120 + r(10) % 30}" width="14" height="14" opacity=".7"/>
                <g transform="translate(120 84)">
                    <circle r="38" fill="#fff" opacity=".7"/>
                    <g transform="translate(-21 -21) scale(1.75)" fill="none" stroke="${st.ink}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${st.icon}</g>
                </g>
                <text x="120" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3.5" fill="${st.ink}" opacity=".75">${st.en}</text>
            </svg>`;
        }

        function onImgError(img) {
            const fig = img.closest('.card-figure');
            if (fig) fig.innerHTML = illustrationSvg(fig.dataset.cat, fig.dataset.seed);
        }

        /* ---------- 稍後再讀、閱讀紀錄 ---------- */
        function getSaved() { return readJson(SAVED_KEY, []); }
        function isSaved(a) {
            const k = articleStableKey(a);
            return getSaved().some((x) => articleStableKey(x) === k);
        }
        function updateSavedBadge() {
            const n = getSaved().length;
            const b = document.getElementById('savedBadge');
            b.textContent = n;
            b.classList.toggle('hidden', n === 0);
        }
        function toggleSave(idx) {
            const a = articles[idx];
            if (!a) return;
            const k = articleStableKey(a);
            let list = getSaved();
            const exists = list.some((x) => articleStableKey(x) === k);
            if (exists) {
                list = list.filter((x) => articleStableKey(x) !== k);
                showToast('已從「稍後再讀」移除');
            } else {
                const { title, link, summary, image, source, category, lang, region, date } = a;
                list.unshift({ title, link, summary, image, source, category, lang, region, date, savedAt: new Date().toISOString() });
                list = list.slice(0, MAX_SAVED);
                showToast('已加入「稍後再讀」');
            }
            writeJson(SAVED_KEY, list);
            updateSavedBadge();
            if (viewMode === 'saved' && exists) {
                renderSavedView();
                return;
            }
            const btn = document.getElementById('saveBtn' + idx);
            if (btn) {
                btn.setAttribute('aria-pressed', exists ? 'false' : 'true');
                btn.querySelector('span').textContent = exists ? '稍後再讀' : '已收藏';
            }
        }

        function getReadHistory() { return readJson(READ_HISTORY_KEY, []); }
        function addToHistory(item) {
            if (!item || !item.title) return;
            const key = (item.link || '') + '|' + item.title;
            let list = getReadHistory().filter((x) => (x.link || '') + '|' + x.title !== key);
            list.unshift({
                title: item.title,
                source: item.source || '',
                link: item.link || '#',
                summary: item.summary || '',
                readAt: new Date().toISOString()
            });
            writeJson(READ_HISTORY_KEY, list.slice(0, MAX_HISTORY));
        }
        function clearReadHistory() {
            if (!confirm('確定要清空所有閱讀紀錄嗎？')) return;
            localStorage.removeItem(READ_HISTORY_KEY);
            renderHistoryView();
        }

        /* ---------- 分頁 ---------- */
        function switchView(mode) {
            stopCurrentSpeech();
            viewMode = mode;
            ['feed', 'saved', 'history'].forEach((m) => {
                const id = 'tab' + m[0].toUpperCase() + m.slice(1);
                document.getElementById(id).setAttribute('aria-selected', m === mode ? 'true' : 'false');
            });
            document.getElementById('filters').classList.toggle('hidden', mode !== 'feed');
            document.getElementById('refreshBtn').classList.toggle('hidden', mode !== 'feed');
            if (mode === 'feed') {
                if (currentRound.length) {
                    articles = currentRound.slice();
                    renderArticles();
                    updateFeedStatus();
                } else if (feedPool.length) {
                    showRound(false);
                } else {
                    setStatus('');
                    renderEmpty('暫時撈不到文章', '網路可能不穩，請稍後再按「換一批」。');
                }
            } else if (mode === 'saved') {
                renderSavedView();
            } else {
                renderHistoryView();
            }
        }

        function renderSavedView() {
            articles = getSaved();
            const n = articles.length;
            setStatus(n ? `收藏了 ${n} 篇，不會因為超過一週而消失。` : '');
            if (!n) {
                renderEmpty('還沒有收藏', '看到想之後慢慢讀的文章，按卡片上的「稍後再讀」就會放到這裡。');
                return;
            }
            renderArticles();
        }

        function renderHistoryView() {
            articles = [];
            const list = getReadHistory();
            setStatus(list.length ? '開過原文或聽過的文章會記在這裡（只存在這台裝置）。' : '');
            if (!list.length) {
                renderEmpty('還沒有閱讀紀錄', '點開原文或按「聆聽」後，文章就會出現在這裡。');
                return;
            }
            document.getElementById('contentArea').innerHTML =
                '<div class="history-list">' + list.map((h) => {
                    const t = h.readAt ? new Date(h.readAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
                    const title = h.link && h.link !== '#'
                        ? `<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a>`
                        : esc(h.title);
                    return `<div class="history-item"><time>${esc(t)}</time><div><h3>${title}</h3><p>${esc(h.source || '')}</p></div></div>`;
                }).join('') + '</div>' +
                '<div class="list-footer"><button type="button" class="ghost-btn" onclick="clearReadHistory()">清空紀錄</button></div>';
        }

        function renderEmpty(title, text) {
            document.getElementById('contentArea').innerHTML = `
                <div class="empty">
                    <svg viewBox="0 0 120 90" aria-hidden="true"><use href="#fish" width="120" height="90" opacity=".85"/></svg>
                    <strong>${esc(title)}</strong>${esc(text)}
                </div>`;
        }

        /* ---------- 分類篩選 ---------- */
        function renderFilters() {
            const counts = {};
            feedPool.forEach((a) => {
                if (activeLang !== 'all' && a.lang !== activeLang) return;
                counts[a.category] = (counts[a.category] || 0) + 1;
            });
            const cats = ['全部'].concat(CATEGORIES.filter((c) => counts[c]));
            const langs = [['all', '中英都看'], ['zh', '只看中文'], ['en', 'English']];
            document.getElementById('filters').innerHTML =
                cats.map((c) => `<button type="button" class="chip" aria-pressed="${c === activeCategory}" onclick="setCategory('${c}')">${c}</button>`).join('') +
                '<span class="chip-sep" aria-hidden="true"></span>' +
                langs.map(([v, label]) => `<button type="button" class="chip" aria-pressed="${v === activeLang}" onclick="setLang('${v}')">${label}</button>`).join('');
        }

        function setCategory(c) {
            if (activeCategory === c) return;
            activeCategory = c;
            renderFilters();
            showRound(false);
        }

        function setLang(v) {
            if (activeLang === v) return;
            activeLang = v;
            if (activeCategory !== '全部' && !filteredPool().length) activeCategory = '全部';
            renderFilters();
            showRound(false);
        }

        function filteredPool() {
            return feedPool.filter((a) =>
                (activeCategory === '全部' || a.category === activeCategory) &&
                (activeLang === 'all' || a.lang === activeLang)
            );
        }

        /* ---------- 文章輪替 ---------- */
        let currentRound = [];

        function loadShown() {
            const data = readJson(FEED_SHOWN_7D_KEY, null);
            return Array.isArray(data && data.keys) ? data.keys : [];
        }
        function saveShown(keys) {
            writeJson(FEED_SHOWN_7D_KEY, { keys: keys.slice(-600) });
        }

        /** 依分類（或在單一分類內依來源）輪流挑，避免同一種文章擠在一起 */
        function diversePick(list, n) {
            const groupBy = activeCategory === '全部' ? 'category' : 'source';
            const groups = new Map();
            list.forEach((a) => {
                const g = a[groupBy] || '';
                if (!groups.has(g)) groups.set(g, []);
                groups.get(g).push(a);
            });
            const queues = shuffleArray([...groups.values()]).map((q) => q.sort((x, y) => (y.dateMs || 0) - (x.dateMs || 0)));
            const out = [];
            while (out.length < n && queues.some((q) => q.length)) {
                for (const q of queues) {
                    if (q.length && out.length < n) out.push(q.shift());
                }
            }
            return out;
        }

        function pickRound() {
            const pool = filteredPool();
            const shown = new Set(loadShown());
            const onScreen = new Set(currentRound.map(articleStableKey));
            let candidates = pool.filter((a) => !shown.has(articleStableKey(a)) && !onScreen.has(articleStableKey(a)));
            let lapped = false;
            if (candidates.length < ROUND_SIZE) {
                const poolKeys = new Set(pool.map(articleStableKey));
                saveShown(loadShown().filter((k) => !poolKeys.has(k)));
                const fresh = pool.filter((a) => !onScreen.has(articleStableKey(a)));
                candidates = candidates.concat(fresh.filter((a) => !candidates.includes(a)));
                if (candidates.length < ROUND_SIZE) candidates = pool.slice();
                lapped = true;
            }
            const round = diversePick(candidates, ROUND_SIZE);
            const keys = loadShown();
            round.forEach((a) => keys.push(articleStableKey(a)));
            saveShown([...new Set(keys)]);
            return { round, lapped };
        }

        function showRound(fromRefresh) {
            stopCurrentSpeech();
            const { round, lapped } = pickRound();
            currentRound = round;
            articles = round.slice();
            if (!articles.length) {
                renderEmpty('這個分類目前沒有文章', '換個分類，或稍後再按「換一批」。');
            } else {
                renderArticles();
            }
            updateFeedStatus();
            if (fromRefresh && lapped) showToast('這一類近一週的文章都看過一輪了，從頭再換');
        }

        function setStatus(text) {
            document.getElementById('feedStatus').textContent = text;
        }

        function updateFeedStatus() {
            if (viewMode !== 'feed') return;
            if (!feedPool.length) return;
            const sources = new Set(feedPool.map((a) => a.source)).size;
            const when = formatClock(feedFetchedAt);
            const pool = filteredPool().length;
            const lead = feedFromCache ? '網路不穩，先顯示上次抓到的文章 · ' : '';
            setStatus(`${lead}最近 7 天 · ${sources} 個媒體 · 這一類共 ${pool} 篇，每次換 ${ROUND_SIZE} 篇${when ? ' · ' + when + ' 更新' : ''}`);
        }

        function articlesInWindow(list) {
            const now = Date.now();
            const start = now - 7 * 24 * 60 * 60 * 1000;
            return (Array.isArray(list) ? list : []).filter((a) => {
                const t = Number.isFinite(a.dateMs) ? a.dateMs : Date.parse(a.date || '');
                a.dateMs = t;
                return Number.isFinite(t) && t >= start && t <= now + 6 * 3600 * 1000 && a.title && a.link;
            });
        }

        async function fetchPool() {
            if (!/^https?:$/.test(location.protocol)) return null;
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 15000);
                const res = await fetch(FEED_API_PATH, { cache: 'no-store', signal: ctrl.signal });
                clearTimeout(timer);
                if (!res.ok) return null;
                const data = await res.json();
                const list = articlesInWindow(data.articles);
                return list.length ? { articles: list, fetchedAt: data.fetchedAt || new Date().toISOString() } : null;
            } catch (e) {
                console.warn('feed api', e);
                return null;
            }
        }

        async function ensurePool() {
            const fresh = await fetchPool();
            if (fresh) {
                feedPool = fresh.articles;
                feedFetchedAt = fresh.fetchedAt;
                feedFromCache = false;
                writeJson(FEED_CACHE_KEY, fresh);
                return true;
            }
            if (feedPool.length) return true;
            const cached = readJson(FEED_CACHE_KEY, null);
            const list = articlesInWindow(cached && cached.articles);
            if (list.length) {
                feedPool = list;
                feedFetchedAt = cached.fetchedAt || '';
                feedFromCache = true;
                return true;
            }
            return false;
        }

        function showSkeleton() {
            document.getElementById('contentArea').innerHTML =
                '<div class="loading"><svg viewBox="0 0 120 90" aria-hidden="true"><use href="#fish" width="120" height="90"/></svg><p>正在撈今天的文章…</p></div>' +
                '<div class="skeleton"></div><div class="skeleton"></div>';
        }

        async function refreshArticles() {
            if (viewMode !== 'feed') return;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.classList.add('busy');
            try {
                const ok = await ensurePool();
                if (!ok) {
                    renderEmpty('暫時撈不到文章', '網路可能不穩，請稍後再按一次「換一批」。');
                    return;
                }
                renderFilters();
                showRound(true);
                document.querySelector('.toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } finally {
                btn.disabled = false;
                btn.classList.remove('busy');
            }
        }

        /* ---------- 卡片 ---------- */
        function figureHtml(a) {
            const cat = a.category || '生活';
            const seed = esc(a.title || '');
            const inner = a.image
                ? `<img src="${esc(a.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="onImgError(this)">`
                : illustrationSvg(cat, a.title);
            return `<figure class="card-figure" data-cat="${esc(cat)}" data-seed="${seed}">${inner}</figure>`;
        }

        function renderArticles() {
            const html = articles.map((a, idx) => {
                const st = CATEGORY_STYLE[a.category] || null;
                const catStyle = st ? `style="--cat-bg:${st.bg};--cat-ink:${st.ink}"` : '';
                const saved = isSaved(a);
                const when = viewMode === 'saved' && a.savedAt ? '收藏於 ' + relativeTime(a.savedAt) : relativeTime(a.date);
                const region = a.region && a.region !== '台灣' ? `<span class="region-tag">${esc(a.region)}</span>` : '';
                return `
                <article class="card${idx === chatContextIdx ? ' is-context' : ''}" lang="${a.lang === 'en' ? 'en' : 'zh-Hant'}" id="card${idx}" style="animation-delay:${idx * 40}ms" onclick="setChatContextFromCard(${idx})">
                    <div class="card-body">
                        <div class="card-kicker">
                            ${a.category ? `<span class="cat-tag" ${catStyle}>${esc(a.category)}</span>` : ''}
                            <span class="card-source">${esc(a.source || '')}</span>
                            ${region}
                            ${when ? `<span>· ${esc(when)}</span>` : ''}
                        </div>
                        <h2 class="card-title"><a href="${esc(a.link)}" target="_blank" rel="noopener" onclick="onArticleLinkClick(${idx})">${esc(a.title)}</a></h2>
                        <p class="card-excerpt">${esc(a.summary)}</p>
                        <div class="card-actions" onclick="event.stopPropagation(); setChatContextFromCard(${idx})">
                            <button type="button" class="listen-btn" id="ttsBtn${idx}" onclick="readSummary(${idx})" aria-label="聆聽這篇摘要">
                                <span class="listen-icon">${ICONS.speaker}<span class="listen-eq"><i></i><i></i><i></i></span></span>
                                <span class="listen-label">聆聽</span><span class="listen-meta">約 ${listenSeconds(a)} 秒</span>
                            </button>
                            <button type="button" class="act-btn quiz" id="quizLoadBtn${idx}" aria-expanded="false" onclick="toggleQuiz(${idx})">${ICONS.sparkle}<span>AI 出題</span></button>
                            <button type="button" class="act-btn save" id="saveBtn${idx}" aria-pressed="${saved}" onclick="toggleSave(${idx})">${ICONS.bookmark}<span>${saved ? '已收藏' : '稍後再讀'}</span></button>
                            <a class="act-btn act-link" href="${esc(a.link)}" target="_blank" rel="noopener" onclick="onArticleLinkClick(${idx})">讀原文${ICONS.external}</a>
                        </div>
                    </div>
                    ${figureHtml(a)}
                    <div class="quiz-panel hidden" id="quizPanel${idx}" onclick="event.stopPropagation()">
                        <div class="quiz-head">
                            <h3>${ICONS.sparkle}AI 閱讀小測驗</h3>
                            <button type="button" class="ghost-btn hidden" id="quizRegenBtn${idx}" onclick="loadReadingQuiz(${idx}, true)">換一組題目</button>
                        </div>
                        <p class="quiz-status" id="quizStatus${idx}" aria-live="polite"></p>
                        <div id="aiSummary${idx}" class="hidden"></div>
                        <div id="quizQuestions${idx}"></div>
                    </div>
                </article>`;
            }).join('');
            document.getElementById('contentArea').innerHTML = html;
            if (chatContextIdx >= articles.length) chatContextIdx = -1;
            updateChatContextDisplay();
        }

        function onArticleLinkClick(idx) {
            const a = articles[idx];
            if (a) addToHistory(a);
        }

        /* ---------- AI 出題 ---------- */
        function quizCacheKey(a) {
            return (a.link || '') + '\n' + (a.title || '');
        }
        function getQuizCache(a) {
            try {
                const all = JSON.parse(sessionStorage.getItem(QUIZ_CACHE_KEY) || '{}');
                return all[quizCacheKey(a)] || null;
            } catch (e) { return null; }
        }
        function setQuizCache(a, payload) {
            try {
                const all = JSON.parse(sessionStorage.getItem(QUIZ_CACHE_KEY) || '{}');
                all[quizCacheKey(a)] = payload;
                sessionStorage.setItem(QUIZ_CACHE_KEY, JSON.stringify(all));
            } catch (e) { /* quota */ }
        }
        function clearQuizCacheEntry(a) {
            try {
                const all = JSON.parse(sessionStorage.getItem(QUIZ_CACHE_KEY) || '{}');
                delete all[quizCacheKey(a)];
                sessionStorage.setItem(QUIZ_CACHE_KEY, JSON.stringify(all));
            } catch (e) { /* ignore */ }
        }
        function stableGenId(a) {
            const s = quizCacheKey(a);
            let h = 0;
            for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
            return 'g' + String(h);
        }

        function toggleQuiz(idx) {
            const panel = document.getElementById('quizPanel' + idx);
            const btn = document.getElementById('quizLoadBtn' + idx);
            if (!panel) return;
            const open = panel.classList.contains('hidden');
            panel.classList.toggle('hidden', !open);
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open && !panel.dataset.loaded) loadReadingQuiz(idx, false);
        }

        async function loadReadingQuiz(idx, regenerate) {
            const a = articles[idx];
            if (!a) return;
            const panel = document.getElementById('quizPanel' + idx);
            const loadBtn = document.getElementById('quizLoadBtn' + idx);
            const regenBtn = document.getElementById('quizRegenBtn' + idx);
            const statusEl = document.getElementById('quizStatus' + idx);
            const aiBox = document.getElementById('aiSummary' + idx);
            const qBox = document.getElementById('quizQuestions' + idx);

            if (!regenerate) {
                const cached = getQuizCache(a);
                if (cached && cached.questions && cached.questions.length >= 3) {
                    statusEl.textContent = '';
                    regenBtn.classList.remove('hidden');
                    panel.dataset.loaded = '1';
                    renderQuizUi(idx, cached);
                    return;
                }
            } else {
                clearQuizCacheEntry(a);
            }

            statusEl.classList.remove('err');
            statusEl.innerHTML = (regenerate ? 'AI 正在換一組題目' : 'AI 正在讀文章、寫精華短文和 3 題選擇題') + '<span class="dots"></span>';
            loadBtn.disabled = true;
            regenBtn.disabled = true;
            aiBox.classList.add('hidden');
            aiBox.innerHTML = '';
            qBox.innerHTML = '';

            try {
                const res = await fetch(ENJOYREAD_QUIZ_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: a.title,
                        summary: a.summary,
                        regenerate: Boolean(regenerate),
                        generationId: regenerate ? ('r' + Date.now() + Math.random().toString(36).slice(2)) : stableGenId(a),
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                if (!data.questions || data.questions.length < 3) throw new Error(data.error || '題目資料不完整，請稍後再試。');
                const payload = { summary: data.summary || a.summary, questions: data.questions, provider: data.provider };
                setQuizCache(a, payload);
                statusEl.textContent = '';
                regenBtn.classList.remove('hidden');
                panel.dataset.loaded = '1';
                renderQuizUi(idx, payload);
            } catch (e) {
                statusEl.textContent = '暫時出不了題：' + (e.message || '未知錯誤') + '。請稍後再按一次「AI 出題」。';
                statusEl.classList.add('err');
                delete panel.dataset.loaded;
            } finally {
                loadBtn.disabled = false;
                regenBtn.disabled = false;
            }
        }

        function renderQuizUi(idx, data) {
            const aiBox = document.getElementById('aiSummary' + idx);
            const qBox = document.getElementById('quizQuestions' + idx);
            const aiText = (data.summary || '').trim();
            if (aiText) {
                aiBox.innerHTML = '<div class="ai-summary-block"><h4>精華短文</h4><p>' + esc(aiText).replace(/\n/g, '<br>') + '</p></div>';
                aiBox.classList.remove('hidden');
            }
            const qs = data.questions || [];
            qBox.innerHTML = qs.map((q, qIdx) => {
                const optHtml = (q.options || []).slice(0, 4).map((opt, oIdx) => `
                    <label class="quiz-opt-label" data-o="${oIdx}">
                        <input type="radio" name="quiz_${idx}_${qIdx}" value="${oIdx}" />
                        <span>${esc(opt)}</span>
                    </label>`).join('');
                return `
                    <div class="quiz-q" id="quizQ_${idx}_${qIdx}">
                        <div class="quiz-q-title">${qIdx + 1}. ${esc(q.question || '')}</div>
                        <div class="quiz-options">${optHtml}</div>
                        <div class="quiz-explanation" id="quizExpl_${idx}_${qIdx}">${esc(q.explanation || '')}</div>
                    </div>`;
            }).join('') +
                `<div class="quiz-footer"><button type="button" class="quiz-submit" id="quizSubmit${idx}" onclick="submitReadingQuiz(${idx})">交卷對答案</button><span class="quiz-score" id="quizScoreRow${idx}"></span></div>`;
        }

        function submitReadingQuiz(idx) {
            const a = articles[idx];
            if (!a) return;
            const cached = getQuizCache(a);
            const qs = cached && cached.questions ? cached.questions : [];
            if (!qs.length) return;
            let correct = 0;
            qs.forEach((q, qIdx) => {
                const sel = document.querySelector(`input[name="quiz_${idx}_${qIdx}"]:checked`);
                const picked = sel ? Number(sel.value) : -1;
                if (picked === q.correctIndex) correct += 1;
                const wrap = document.getElementById('quizQ_' + idx + '_' + qIdx);
                if (!wrap) return;
                wrap.querySelectorAll('.quiz-opt-label').forEach((lb) => {
                    const o = Number(lb.getAttribute('data-o'));
                    lb.classList.remove('reveal-correct', 'reveal-wrong');
                    if (o === q.correctIndex) lb.classList.add('reveal-correct');
                    if (picked === o && o !== q.correctIndex) lb.classList.add('reveal-wrong');
                });
                const expl = document.getElementById('quizExpl_' + idx + '_' + qIdx);
                if (expl) expl.classList.add('show');
            });
            const msg = correct === qs.length ? '全對，太厲害了！' : correct >= qs.length - 1 ? '很不錯！' : '看看解析再讀一次吧';
            document.getElementById('quizScoreRow' + idx).textContent = `答對 ${correct} / ${qs.length} 題 · ${msg}`;
            document.getElementById('quizSubmit' + idx).disabled = true;
        }

        /* ---------- 小助手 ---------- */
        function buildArticleContextForChat(idx) {
            const a = articles[idx];
            if (!a) return { title: '', content: '' };
            const lines = ['【來源】' + (a.source || ''), '【標題】' + a.title, '【列表摘要】' + a.summary];
            const cached = getQuizCache(a);
            if (cached && cached.summary) lines.push('【AI 精華短文】\n' + cached.summary);
            return { title: a.title, content: lines.join('\n\n') };
        }

        function setChatContextFromCard(idx) {
            if (typeof idx !== 'number' || idx < 0 || !articles[idx]) return;
            if (chatContextIdx === idx) return;
            const old = document.getElementById('card' + chatContextIdx);
            if (old) old.classList.remove('is-context');
            chatContextIdx = idx;
            const card = document.getElementById('card' + idx);
            if (card) card.classList.add('is-context');
            updateChatContextDisplay();
        }

        function updateChatContextDisplay() {
            const el = document.getElementById('chatContextTitle');
            const a = articles[chatContextIdx];
            if (!a) {
                el.textContent = '點一下任一篇文章，小助手就會一起讀';
                return;
            }
            el.textContent = a.title.length > 46 ? a.title.slice(0, 46) + '…' : a.title;
        }

        function seedChatWelcome() {
            const box = document.getElementById('chatMessages');
            if (box.dataset.seeded === '1') return;
            appendChatRow('assistant', '嗨！我是摸魚小助手。點一篇文章後問我生字、英文單字、文章重點都可以。\nHi! Ask me about any word or idea in the article.');
            box.dataset.seeded = '1';
            chatTurns = [];
        }

        function appendChatRow(role, text) {
            const box = document.getElementById('chatMessages');
            const row = document.createElement('div');
            row.className = 'msg ' + (role === 'user' ? 'msg--user' : 'msg--bot');
            const av = document.createElement('div');
            av.className = 'msg-av';
            av.setAttribute('aria-hidden', 'true');
            if (role === 'user') {
                av.textContent = '我';
            } else {
                av.innerHTML = '<svg viewBox="0 0 120 90"><use href="#fish" width="120" height="90"/></svg>';
            }
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;
            row.appendChild(av);
            row.appendChild(bubble);
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function clearChat() {
            chatTurns = [];
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';
            delete box.dataset.seeded;
            seedChatWelcome();
        }

        async function submitChat(ev) {
            if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
            const input = document.getElementById('chatInput');
            const text = (input.value || '').trim();
            if (!text) return;
            const ctx = buildArticleContextForChat(chatContextIdx);
            appendChatRow('user', text);
            chatTurns.push({ role: 'user', content: text });
            input.value = '';
            const btn = document.getElementById('chatSendBtn');
            btn.disabled = true;
            try {
                const res = await fetch(ENJOYREAD_CHAT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ articleTitle: ctx.title, articleContent: ctx.content, messages: chatTurns }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const errText = data.error || ('HTTP ' + res.status);
                    appendChatRow('assistant', '抱歉，目前無法回覆：' + errText);
                    chatTurns.push({ role: 'assistant', content: errText });
                    return;
                }
                const answer = String(data.answer != null ? data.answer : (data.error || '')).trim() || '沒有取得回覆。';
                appendChatRow('assistant', answer);
                chatTurns.push({ role: 'assistant', content: answer });
            } catch (e) {
                const msg = e && e.message ? e.message : '未知錯誤';
                appendChatRow('assistant', '連線失敗：' + msg + '。請確認網路後再試一次。');
                chatTurns.push({ role: 'assistant', content: msg });
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        function toggleChatDock() {
            const open = document.getElementById('chatDock').classList.toggle('open');
            document.getElementById('chatBackdrop').classList.toggle('show', open);
        }
        function closeChatDock() {
            document.getElementById('chatDock').classList.remove('open');
            document.getElementById('chatBackdrop').classList.remove('show');
        }

        /* ---------- 聆聽 ---------- */
        const EN_VOICES = {
            shimmer: 'en-US-JennyNeural',
            onyx: 'en-US-AriaNeural',
            alloy: 'en-US-GuyNeural',
            nova: 'en-US-ChristopherNeural',
            child: 'en-US-AnaNeural',
        };

        function getVoicePreference() {
            return document.getElementById('mandarinVoice').value || 'shimmer';
        }

        function speechTextFor(a) {
            const sep = a.lang === 'en' ? '. ' : '。';
            return (a.title || '') + sep + (a.summary || '');
        }

        function setListenState(btn, state) {
            if (!btn) return;
            btn.classList.toggle('loading', state === 'loading');
            btn.classList.toggle('playing', state === 'playing');
            const label = btn.querySelector('.listen-label');
            const meta = btn.querySelector('.listen-meta');
            if (state === 'loading') {
                label.textContent = '準備中';
                meta.classList.add('hidden');
            } else if (state === 'playing') {
                label.textContent = '播放中';
                meta.textContent = '點一下停止';
                meta.classList.remove('hidden');
            } else {
                label.textContent = '聆聽';
                const idx = Number(btn.id.replace('ttsBtn', ''));
                meta.textContent = articles[idx] ? '約 ' + listenSeconds(articles[idx]) + ' 秒' : '';
                meta.classList.remove('hidden');
            }
        }

        async function readSummary(idx) {
            const btn = document.getElementById('ttsBtn' + idx);
            const a = articles[idx];
            if (!btn || !a) return;
            if (currentPlayingIdx === idx) {
                stopCurrentSpeech();
                return;
            }
            stopCurrentSpeech();
            currentPlayingIdx = idx;
            addToHistory(a);
            const text = speechTextFor(a);
            const pref = getVoicePreference();
            setListenState(btn, 'loading');
            try {
                const res = await fetch(EDGE_TTS_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'tts-1', input: text, voice: a.lang === 'en' ? EN_VOICES[pref] : pref, speed: 1 })
                });
                if (!res.ok) throw new Error('Edge TTS failed: ' + res.status);
                const blob = await res.blob();
                if (currentPlayingIdx !== idx) return;
                currentAudio = new Audio(URL.createObjectURL(blob));
                currentAudio.onended = () => stopCurrentSpeech();
                currentAudio.onerror = () => {
                    releaseAudio();
                    readWithBrowser(a, btn, idx);
                };
                await currentAudio.play();
                setListenState(btn, 'playing');
            } catch (e) {
                if (currentPlayingIdx === idx) readWithBrowser(a, btn, idx);
            }
        }

        function releaseAudio() {
            if (!currentAudio) return;
            currentAudio.onended = null;
            currentAudio.onerror = null;
            currentAudio.pause();
            if (currentAudio.src && currentAudio.src.startsWith('blob:')) {
                try { URL.revokeObjectURL(currentAudio.src); } catch (e) { /* ignore */ }
            }
            currentAudio = null;
        }

        function stopCurrentSpeech() {
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            releaseAudio();
            if (currentPlayingIdx >= 0) setListenState(document.getElementById('ttsBtn' + currentPlayingIdx), 'idle');
            currentPlayingIdx = -1;
        }

        function readWithBrowser(a, btn, idx) {
            if (!('speechSynthesis' in window)) {
                showToast('朗讀服務暫時連不上，這個瀏覽器也不支援離線朗讀');
                stopCurrentSpeech();
                return;
            }
            const u = new SpeechSynthesisUtterance(speechTextFor(a));
            u.lang = a.lang === 'en' ? 'en-US' : 'zh-CN';
            const voice = pickBrowserVoice(a.lang);
            if (voice) u.voice = voice;
            u.onend = () => { if (currentPlayingIdx === idx) stopCurrentSpeech(); };
            u.onerror = () => { if (currentPlayingIdx === idx) stopCurrentSpeech(); };
            setListenState(btn, 'playing');
            speechSynthesis.speak(u);
        }

        function pickBrowserVoice(lang) {
            const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
            if (!voices.length) return null;
            if (lang === 'en') return voices.find((v) => /^en[-_]/i.test(v.lang)) || null;
            const preference = getVoicePreference();
            const mandarin = voices.filter((v) => {
                const l = (v.lang || '').toLowerCase();
                const n = (v.name || '').toLowerCase();
                return l.includes('zh-cn') || l.includes('zh-hans') || n.includes('mandarin') || n.includes('xiaoxiao') || n.includes('yun');
            });
            const matchers = {
                shimmer: ['xiaoxiao', 'female', '女'],
                onyx: ['xiaoyi', 'xiaoxiao', 'female', '女'],
                alloy: ['yunyang', 'yunjian', 'male', '男'],
                nova: ['yunxi', 'male', '男'],
                child: ['xiaoshuang', 'child', '童'],
            }[preference] || [];
            const list = mandarin.length ? mandarin : voices;
            return list.find((v) => matchers.some((m) => (v.name + ' ' + v.lang).toLowerCase().includes(m))) || mandarin[0] || null;
        }

        /* ---------- 啟動 ---------- */
        async function init() {
            document.getElementById('mastheadDate').textContent =
                new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            document.getElementById('chatForm').addEventListener('submit', submitChat);
            document.getElementById('chatInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    submitChat(e);
                }
            });
            seedChatWelcome();
            updateSavedBadge();
            updateChatContextDisplay();

            const cached = readJson(FEED_CACHE_KEY, null);
            const cachedList = articlesInWindow(cached && cached.articles);
            if (cachedList.length) {
                feedPool = cachedList;
                feedFetchedAt = cached.fetchedAt || '';
                renderFilters();
                showRound(false);
                const fresh = await fetchPool();
                if (fresh) {
                    feedPool = fresh.articles;
                    feedFetchedAt = fresh.fetchedAt;
                    writeJson(FEED_CACHE_KEY, fresh);
                    renderFilters();
                    updateFeedStatus();
                }
                return;
            }

            showSkeleton();
            const ok = await ensurePool();
            if (!ok) {
                setStatus('');
                renderEmpty('暫時撈不到文章', /^https?:$/.test(location.protocol)
                    ? '網路可能不穩，請稍後再按「換一批」。'
                    : '請用網站開啟「摸魚」俱樂部，才能載入最近一週的文章。');
                return;
            }
            renderFilters();
            showRound(false);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => init());
        } else {
            init();
        }
    </script>
</body>
</html>
