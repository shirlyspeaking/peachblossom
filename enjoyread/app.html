<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悅讀 EnjoyRead - 最新有趣文章</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            color-scheme: light;
            --bg: oklch(0.975 0.014 8);
            --bg-soft: oklch(0.953 0.018 8);
            --surface: oklch(0.988 0.01 8 / 0.9);
            --text: oklch(0.305 0.06 8);
            --text-soft: oklch(0.49 0.04 10);
            --accent: oklch(0.61 0.17 10);
            --accent-deep: oklch(0.42 0.11 8);
            --accent-soft: oklch(0.84 0.06 12);
            --line: oklch(0.852 0.03 10 / 0.7);
            --line-strong: oklch(0.72 0.06 10 / 0.55);
            --shadow-soft: 0 24px 60px oklch(0.53 0.09 8 / 0.08);
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }
        body {
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 14%, oklch(0.99 0.012 10) 0%, transparent 28%),
                radial-gradient(circle at 86% 10%, oklch(0.92 0.045 8 / 0.55) 0%, transparent 24%),
                radial-gradient(circle at 78% 64%, oklch(0.94 0.026 30 / 0.42) 0%, transparent 22%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 54%, oklch(0.965 0.018 16) 100%);
            background-attachment: fixed;
        }
        .navbar {
            background: color-mix(in oklch, var(--surface) 92%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid color-mix(in oklch, var(--line-strong) 54%, transparent);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            box-shadow: 0 10px 30px oklch(0.48 0.08 8 / 0.06);
        }
        .logo {
            font-size: 1.15rem;
            font-weight: 600;
            font-family: "Noto Serif TC", serif;
            color: var(--accent-deep);
            text-decoration: none;
            letter-spacing: 0.04em;
        }
        .logo:hover { color: var(--accent); }
        .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nav-history-btn {
            padding: 9px 16px;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, oklch(0.99 0.008 8) 90%, var(--accent-soft) 10%) 0%,
                color-mix(in oklch, oklch(0.96 0.014 10) 78%, var(--accent-soft) 22%) 100%
            );
            border: 1px solid color-mix(in oklch, var(--line-strong) 50%, transparent);
            color: var(--accent-deep);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 180ms var(--ease), box-shadow 180ms var(--ease);
            box-shadow: 0 8px 20px oklch(0.5 0.09 10 / 0.08);
        }
        .nav-history-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px oklch(0.48 0.09 8 / 0.12);
        }
        .history-empty { text-align: center; padding: 48px 20px; color: var(--text-soft); line-height: 1.7; }
        .history-item { border-left: 3px solid color-mix(in oklch, var(--accent) 70%, var(--line) 30%); padding-left: 16px; margin-bottom: 20px; }
        .history-item time { font-size: 0.8rem; color: var(--text-soft); display: block; margin-bottom: 6px; }
        .history-item h3 { font-size: 1.05rem; margin-bottom: 6px; }
        .history-item h3 a { color: var(--accent-deep); text-decoration: none; }
        .history-item h3 a:hover { text-decoration: underline; color: var(--accent); }
        .clear-history-btn { margin-top: 16px; padding: 8px 14px; font-size: 0.85rem; color: var(--text-soft); background: color-mix(in oklch, var(--surface) 88%, transparent); border: 1px solid color-mix(in oklch, var(--line) 80%, transparent); border-radius: 999px; cursor: pointer; }
        .clear-history-btn:hover { background: color-mix(in oklch, var(--accent-soft) 35%, var(--surface) 65%); }
        .hidden { display: none !important; }
        .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        .page-title {
            font-family: "ZCOOL XiaoWei", "Noto Serif TC", serif;
            font-size: clamp(1.65rem, 4vw, 2rem);
            font-weight: 400;
            color: var(--accent-deep);
            margin-bottom: 8px;
            letter-spacing: 0.06em;
        }
        .page-desc { color: var(--text-soft); margin-bottom: 32px; line-height: 1.75; }
        .article-card {
            background: color-mix(in oklch, var(--surface) 94%, transparent);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid color-mix(in oklch, var(--line) 88%, transparent);
            transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
        }
        .article-card:hover { box-shadow: 0 18px 40px oklch(0.48 0.08 8 / 0.12); transform: translateY(-2px); }
        .article-source { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.02em; }
        .article-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; color: var(--accent-deep); }
        .article-summary { font-size: 0.95rem; color: var(--text-soft); line-height: 1.7; margin-bottom: 16px; }
        .article-meta { font-size: 0.8rem; color: var(--text-soft); margin-bottom: 16px; opacity: 0.9; }
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, var(--accent) 88%, var(--accent-deep) 12%) 0%,
                var(--accent-deep) 100%
            );
            color: oklch(0.99 0.01 8);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
            box-shadow: 0 10px 22px oklch(0.45 0.1 8 / 0.18);
        }
        .tts-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px oklch(0.42 0.1 8 / 0.22); }
        .tts-btn.playing { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
        .loading { text-align: center; padding: 48px; color: var(--text-soft); }
        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid color-mix(in oklch, var(--line) 70%, transparent);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { background: color-mix(in oklch, oklch(0.96 0.05 20) 90%, transparent); color: oklch(0.46 0.16 24); padding: 16px; border-radius: 12px; margin-bottom: 24px; border: 1px solid color-mix(in oklch, oklch(0.85 0.08 20) 60%, transparent); }
        .refresh-btn { margin-top: 16px; padding: 8px 16px; background: var(--accent-deep); color: oklch(0.99 0.01 8); border: none; border-radius: 999px; cursor: pointer; font-weight: 600; }
        .refresh-articles-btn {
            padding: 10px 20px;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, var(--accent) 88%, var(--accent-deep) 12%) 0%,
                var(--accent-deep) 100%
            );
            color: oklch(0.99 0.01 8);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.15s var(--ease), opacity 0.15s;
            box-shadow: 0 10px 22px oklch(0.45 0.1 8 / 0.18);
        }
        .refresh-articles-btn:hover { transform: translateY(-1px); opacity: 0.96; }
        .refresh-articles-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">📖 悅讀 EnjoyRead</a>
        <div class="nav-actions">
            <button type="button" class="nav-history-btn" id="btnHistory" onclick="openHistoryView()">📚 悅讀歷史</button>
            <button type="button" class="nav-history-btn hidden" id="btnBackFeed" onclick="closeHistoryView()">← 返回文章列表</button>
        </div>
    </nav>

    <div class="container">
        <div id="feedHeader">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 8px;">
                <h1 class="page-title" style="margin-bottom: 0;">最新 · 最有趣的文章</h1>
                <button class="btn refresh-articles-btn" id="refreshBtn" onclick="refreshArticles()">🔄 更新</button>
            </div>
            <p class="page-desc">從網上主要閱讀平台精選文章，每篇附有約 150 字摘要，點擊「語音朗讀」即可聆聽。</p>
        </div>

        <div id="historyHeader" class="hidden">
            <h1 class="page-title" style="margin-bottom: 0;">悅讀歷史</h1>
            <p class="page-desc">您曾開啟連結或聆聽語音摘要的文章會記錄在此（僅儲存在本機瀏覽器）。</p>
        </div>

        <div id="contentArea">
            <div class="loading" id="loadingState">
                <div class="loading-spinner"></div>
                <p>正在搜集最新文章...</p>
            </div>
        </div>
    </div>

    <script>
        const SUMMARY_LENGTH = 150; // 約 150 字
        const READ_HISTORY_KEY = 'enjoyread-read-history';
        const MAX_HISTORY = 50;

        function getReadHistory() {
            try {
                const raw = localStorage.getItem(READ_HISTORY_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function addToHistory(item) {
            if (!item || !item.title) return;
            let list = getReadHistory();
            const key = (item.link || '') + '|' + item.title;
            list = list.filter((x) => (x.link || '') + '|' + x.title !== key);
            list.unshift({
                title: item.title,
                source: item.source || '',
                link: item.link || '#',
                summary: item.summary || '',
                readAt: new Date().toISOString()
            });
            list = list.slice(0, MAX_HISTORY);
            try {
                localStorage.setItem(READ_HISTORY_KEY, JSON.stringify(list));
            } catch (e) { /* quota */ }
        }

        function clearReadHistory() {
            if (!confirm('確定要清空所有閱讀歷史嗎？')) return;
            localStorage.removeItem(READ_HISTORY_KEY);
            renderHistoryList();
        }

        let viewMode = 'feed';

        function openHistoryView() {
            viewMode = 'history';
            document.getElementById('feedHeader').classList.add('hidden');
            document.getElementById('historyHeader').classList.remove('hidden');
            document.getElementById('btnHistory').classList.add('hidden');
            document.getElementById('btnBackFeed').classList.remove('hidden');
            renderHistoryList();
        }

        function closeHistoryView() {
            viewMode = 'feed';
            document.getElementById('feedHeader').classList.remove('hidden');
            document.getElementById('historyHeader').classList.add('hidden');
            document.getElementById('btnHistory').classList.remove('hidden');
            document.getElementById('btnBackFeed').classList.add('hidden');
            renderArticles(articles);
        }

        function renderHistoryList() {
            const list = getReadHistory();
            const el = document.getElementById('contentArea');
            if (list.length === 0) {
                el.innerHTML = '<div class="history-empty">尚無閱讀紀錄。<br>點擊文章標題開啟原文，或使用「語音朗讀摘要」後，會自動記錄在此。</div>';
                return;
            }
            el.innerHTML = list.map((h) => {
                const titleLink = h.link && h.link !== '#'
                    ? `<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a>`
                    : esc(h.title);
                const t = h.readAt ? new Date(h.readAt).toLocaleString('zh-TW') : '';
                return `
                    <div class="article-card history-item">
                        <time>${esc(t)}</time>
                        <div class="article-source">${esc(h.source || '')}</div>
                        <h3 class="article-title">${titleLink}</h3>
                        <p class="article-summary">${esc(h.summary || '')}</p>
                    </div>
                `;
            }).join('') + '<p style="text-align:center"><button type="button" class="clear-history-btn" onclick="clearReadHistory()">清空歷史</button></p>';
        }

        const RSS_SOURCES = [
            { name: '泛科學', url: 'https://pansci.asia/feed/', desc: '科學、醫療、生活科技' },
            { name: '科技新報', url: 'https://technews.tw/feed', desc: '科技產業動態' },
            { name: '環境資訊中心', url: 'https://e-info.org.tw/feed', desc: '環境與生態' },
            { name: '三聯生活周刊', url: 'http://app.lifeweek.com.cn/rss.php?catid=1', desc: '文化、生活、深度報導' },
            { name: '運動去', url: 'https://feeds.feedburner.com/go-sport', desc: '運動健身、體育資訊' },
            { name: '運動視界', url: 'https://www.sportsv.net/feed', desc: '運動賽事、體育評論' },
            { name: '台視娛樂', url: 'https://www.ttv.com.tw/rss/RSSHandler.ashx?d=news&t=F', desc: '娛樂新聞' },
            { name: '風傳媒', url: 'https://www.storm.mg/feed', desc: '時事、娛樂、生活' }
        ];

        const CORS_PROXIES = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url='
        ];

        const FALLBACK_ARTICLES = [
            { title: '生成式 AI 如何重塑創作與學習', source: '科技新報', summary: 'ChatGPT、Midjourney 等工具正改變我們創作與學習的方式。學生可用 AI 輔助寫作與研究，但如何分辨 AI 產出與原創內容成為新課題。教育界思考如何將 AI 融入教學，同時培養批判思考能力。', link: 'https://technews.tw/', date: '' },
            { title: '巴黎奧運之後：運動員的下一站', source: '運動視界', summary: '奧運落幕後，選手們如何規劃職業生涯？有人轉戰職業聯賽，有人投入教練或體育行政。運動員的轉型之路充滿挑戰，也需要社會支持系統的協助，讓他們的專業得以延續。', link: 'https://www.sportsv.net/', date: '' },
            { title: '慢生活：在快節奏時代找回自己的步調', source: '三聯生活周刊', summary: '現代人總在趕路，慢下來成了一種奢侈。三聯生活周刊探討慢食、慢旅行、慢閱讀的意義。放慢腳步不是偷懶，而是更清醒地感受當下，在效率至上的時代找回生活的質感。', link: 'https://www.lifeweek.com.cn/', date: '' },
            { title: '電動車時代來臨：你準備好了嗎？', source: '泛科學', summary: '各國紛紛訂出燃油車退場時程，電動車成為未來趨勢。充電基礎設施、電池技術、續航力與價格，是消費者最關心的議題。了解電動車的優缺點，有助於做出適合自己的選擇。', link: 'https://pansci.asia/', date: '' },
            { title: '串流大戰：你訂閱了幾個平台？', source: '風傳媒', summary: 'Netflix、Disney+、愛奇藝、KKTV……串流平台百花齊放，訂閱費加總可能比有線電視還貴。如何聰明選擇、避免訂閱疲勞？分享帳號的爭議也引發討論，串流生態正在重新洗牌。', link: 'https://www.storm.mg/', date: '' },
            { title: '青少年心理健康：我們能做些什麼', source: '環境資訊中心', summary: '學業壓力、人際關係、社群媒體，都可能影響青少年的心理健康。傾聽、陪伴、減少污名化是關鍵。學校與家庭如何建立支持系統？及早發現、適時求助，每個人都能成為他人的光。', link: 'https://e-info.org.tw/', date: '' },
            { title: '路跑熱潮：從休閒到競技的跑步文化', source: '運動去', summary: '台灣路跑賽事一年超過數百場，從休閒跑者到菁英選手各有舞台。跑步不只強身，更形成社群與文化。如何避免運動傷害、選擇適合的賽事？跑出健康也跑出樂趣。', link: 'https://go-sport.tw/', date: '' },
            { title: '韓流、日流與華語娛樂的共舞', source: '台視娛樂', summary: 'K-pop、日劇、華語影視在全球市場交會。跨國合作、IP 改編、串流平台推波助瀾，娛樂產業的疆界越來越模糊。觀眾的選擇更多元，創作者也迎來新的機會與挑戰。', link: 'https://www.ttv.com.tw/', date: '' }
        ];

        function shuffleFallback() {
            const arr = [...FALLBACK_ARTICLES];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, 15);
        }

        function stripHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return div.textContent || div.innerText || '';
        }

        function createSummary(text, maxLen) {
            const clean = stripHtml(text).replace(/\s+/g, ' ').trim();
            if (clean.length <= maxLen) return clean;
            let cut = clean.slice(0, maxLen);
            const lastPunct = cut.search(/[。！？]$/);
            if (lastPunct === -1) {
                const lastComma = cut.lastIndexOf('，');
                if (lastComma > maxLen * 0.5) cut = cut.slice(0, lastComma + 1);
                else cut = cut + '…';
            }
            return cut;
        }

        /** 從 RSS item / Atom entry 取出單篇文章網址（避免選到 rel=self 或只連到網站首頁） */
        function getItemPermalink(el) {
            const links = el.querySelectorAll('link');
            for (let j = 0; j < links.length; j++) {
                const node = links[j];
                let href = (node.getAttribute('href') || '').trim();
                if (!href) href = (node.textContent || '').trim();
                if (!href || !/^https?:\/\//i.test(href)) continue;
                const rel = (node.getAttribute('rel') || '').toLowerCase();
                const type = (node.getAttribute('type') || '').toLowerCase();
                if (rel === 'self' || rel === 'enclosure' || rel === 'replies') continue;
                if (type === 'application/atom+xml' || type === 'application/rss+xml') continue;
                if (rel === 'alternate' || rel === 'edit' || rel === '') {
                    if (!type || type.includes('html') || type === '') return href;
                }
            }
            const rssLink = el.querySelector('link');
            if (rssLink) {
                const href = (rssLink.getAttribute('href') || '').trim();
                if (href && /^https?:\/\//i.test(href)) return href;
                const txt = (rssLink.textContent || '').trim();
                if (/^https?:\/\//i.test(txt)) return txt;
            }
            const guid = el.querySelector('guid');
            if (guid) {
                const g = (guid.textContent || '').trim();
                if (/^https?:\/\//i.test(g)) return g;
            }
            return '#';
        }

        const ITEMS_PER_FEED = 12;

        function parseRssXml(xmlText) {
            const items = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'text/xml');
                let entries = doc.querySelectorAll('item');
                if (entries.length === 0) entries = doc.querySelectorAll('entry');
                entries.forEach((el, i) => {
                    if (i >= ITEMS_PER_FEED) return;
                    const title = el.querySelector('title')?.textContent?.trim() || '';
                    const link = getItemPermalink(el);
                    const desc = el.querySelector('description')?.textContent?.trim()
                        || el.querySelector('content')?.textContent?.trim()
                        || el.querySelector('summary')?.textContent?.trim() || '';
                    const pubDate = el.querySelector('pubDate')?.textContent?.trim()
                        || el.querySelector('updated')?.textContent?.trim() || '';
                    if (title && (desc || title)) {
                        items.push({
                            title,
                            link,
                            summary: createSummary(desc || title, SUMMARY_LENGTH),
                            date: pubDate
                        });
                    }
                });
            } catch (e) { console.warn('RSS parse error', e); }
            return items;
        }

        async function fetchRss(source) {
            const sep = source.url.includes('?') ? '&' : '?';
            const bustedUrl = source.url + sep + '_nocache=' + Date.now() + '_' + Math.random().toString(36).slice(2);
            for (const proxy of CORS_PROXIES) {
                const proxyUrl = proxy + encodeURIComponent(bustedUrl) + (proxy.includes('allorigins') ? '&_=' + Date.now() : '');
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 12000);
                    const res = await fetch(proxyUrl, {
                        signal: ctrl.signal,
                        cache: 'no-store',
                        mode: 'cors'
                    });
                    clearTimeout(t);
                    if (!res.ok) continue;
                    const text = await res.text();
                    const items = parseRssXml(text);
                    if (items.length > 0) return items.map(it => ({ ...it, source: source.name }));
                } catch (e) { continue; }
            }
            return [];
        }

        async function loadArticles() {
            const results = await Promise.all(RSS_SOURCES.map((src) => fetchRss(src)));
            let all = results.flat();
            const seen = new Set();
            all = all.filter((item) => {
                const key = (item.title || '') + '|' + (item.link || '');
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
            if (all.length === 0) return shuffleFallback();
            all.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            return all.slice(0, 30);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function renderArticles(articles) {
            const html = articles.map((a, idx) => {
                const titleHtml = a.link && a.link !== '#' 
                    ? `<a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" onclick="onArticleLinkClick(${idx})">${esc(a.title)}</a>` 
                    : esc(a.title);
                return `
                <div class="article-card" data-idx="${idx}">
                    <div class="article-source">${esc(a.source)}</div>
                    <h2 class="article-title">${titleHtml}</h2>
                    <p class="article-summary">${esc(a.summary)}</p>
                    <div class="article-meta">${a.date ? new Date(a.date).toLocaleDateString('zh-TW') : ''}</div>
                    <button class="tts-btn" onclick="readSummary(${idx})" id="ttsBtn${idx}" data-default-text="🔊 語音朗讀摘要" data-stop-text="⏸ 停止朗讀">
                        🔊 語音朗讀摘要
                    </button>
                </div>
            `;
            }).join('');
            document.getElementById('contentArea').innerHTML = html;
        }

        function onArticleLinkClick(idx) {
            const a = articles[idx];
            if (a) addToHistory(a);
        }

        let articles = [];
        let currentPlayingIdx = -1;

        function readSummary(idx) {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音朗讀');
                return;
            }
            const btn = document.getElementById('ttsBtn' + idx);
            if (currentPlayingIdx === idx) {
                speechSynthesis.cancel();
                currentPlayingIdx = -1;
                btn.classList.remove('playing');
                btn.textContent = btn.dataset.defaultText || '🔊 語音朗讀摘要';
                return;
            }
            speechSynthesis.cancel();
            currentPlayingIdx = idx;
            const summary = articles[idx]?.summary;
            if (!summary) return;

            addToHistory(articles[idx]);

            document.querySelectorAll('.tts-btn').forEach(b => {
                b.classList.remove('playing');
                b.textContent = b.dataset.defaultText || '🔊 語音朗讀摘要';
            });
            btn.classList.add('playing');
            btn.textContent = btn.dataset.stopText || '⏸ 停止朗讀';

            const u = new SpeechSynthesisUtterance(summary);
            u.lang = 'zh-TW';
            u.rate = 1;
            u.onend = () => { currentPlayingIdx = -1; btn.classList.remove('playing'); btn.textContent = btn.dataset.defaultText || '🔊 語音朗讀摘要'; };
            u.onerror = () => { currentPlayingIdx = -1; btn.classList.remove('playing'); btn.textContent = btn.dataset.defaultText || '🔊 語音朗讀摘要'; };
            speechSynthesis.speak(u);
        }

        function showLoadingMessage(msg) {
            document.getElementById('contentArea').innerHTML =
                '<div class="loading"><div class="loading-spinner"></div><p>' + msg + '</p></div>';
        }

        async function loadAndRenderArticles(loadingMsg) {
            if (loadingMsg) showLoadingMessage(loadingMsg);
            try {
                articles = await loadArticles();
                renderArticles(articles);
            } catch (e) {
                articles = shuffleFallback();
                renderArticles(articles);
            }
        }

        async function init() {
            await loadAndRenderArticles('正在搜集最新文章...');
        }

        async function refreshArticles() {
            if (viewMode === 'history') return;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 更新中...';
            if (typeof speechSynthesis !== 'undefined') {
                speechSynthesis.cancel();
                currentPlayingIdx = -1;
            }
            await loadAndRenderArticles('正在重新抓取最新文章，請稍候…');
            btn.disabled = false;
            btn.textContent = '🔄 更新';
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => init());
        } else {
            init();
        }
    </script>
</body>
</html>
