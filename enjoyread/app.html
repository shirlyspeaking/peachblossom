<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悅讀 EnjoyRead - 最新有趣文章</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); color: #1e293b; min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
        .logo { font-size: 1.25rem; font-weight: 600; color: #0284c7; text-decoration: none; }
        .logo:hover { color: #0369a1; }
        .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        .page-title { font-size: 1.75rem; color: #0c4a6e; margin-bottom: 8px; }
        .page-desc { color: #64748b; margin-bottom: 32px; line-height: 1.6; }
        .article-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(14, 165, 233, 0.1);
            transition: box-shadow 0.2s;
        }
        .article-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .article-source { font-size: 0.8rem; color: #0ea5e9; font-weight: 500; margin-bottom: 8px; }
        .article-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; color: #0f172a; }
        .article-summary { font-size: 0.95rem; color: #475569; line-height: 1.7; margin-bottom: 16px; }
        .article-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; }
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .tts-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35); }
        .tts-btn.playing { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
        .loading { text-align: center; padding: 48px; color: #64748b; }
        .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { background: #fef2f2; color: #b91c1c; padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .refresh-btn { margin-top: 16px; padding: 8px 16px; background: #0ea5e9; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">📖 悅讀 EnjoyRead</a>
    </nav>

    <div class="container">
        <h1 class="page-title">最新 · 最有趣的文章</h1>
        <p class="page-desc">從網上主要閱讀平台精選文章，每篇附有約 150 字摘要，點擊「語音朗讀」即可聆聽。</p>

        <div id="contentArea">
            <div class="loading" id="loadingState">
                <div class="loading-spinner"></div>
                <p>正在搜集最新文章...</p>
            </div>
        </div>
    </div>

    <script>
        const SUMMARY_LENGTH = 150; // 約 150 字

        const RSS_SOURCES = [
            { name: '泛科學', url: 'https://pansci.asia/feed/', desc: '科學、醫療、生活科技' },
            { name: '科技新報', url: 'https://technews.tw/feed', desc: '科技產業動態' },
            { name: '環境資訊中心', url: 'https://e-info.org.tw/feed', desc: '環境與生態' },
            { name: '三聯生活周刊', url: 'http://app.lifeweek.com.cn/rss.php?catid=1', desc: '文化、生活、深度報導' },
            { name: '運動去', url: 'https://feeds.feedburner.com/go-sport', desc: '運動健身、體育資訊' },
            { name: '運動視界', url: 'https://www.sportsv.net/feed', desc: '運動賽事、體育評論' },
            { name: '台視娛樂', url: 'https://www.ttv.com.tw/rss/RSSHandler.ashx?d=news&t=F', desc: '娛樂新聞' },
            { name: '風傳媒', url: 'https://www.storm.mg/feed', desc: '時事、娛樂、生活' }
        ];

        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        const FALLBACK_ARTICLES = [
            { title: '黑洞如何形成？從恆星死亡到時空扭曲', source: '科學人', summary: '黑洞是宇宙中最神秘的天體。當大質量恆星耗盡燃料後，核心會發生引力坍縮，若超過約 3 倍太陽質量，就會形成黑洞。黑洞邊界稱為「事件視界」，一旦跨越就無法逃脫。科學家透過觀察黑洞對周圍物質的影響，以及 2019 年公布的首張黑洞影像，逐步揭開其神秘面紗。', link: '#', date: '' },
            { title: 'AI 如何改變我們的學習方式', source: '科技新報', summary: '人工智慧正在重塑教育。AI 可根據學生進度提供個人化學習路徑，智能系統能即時回答疑問並給予針對性講解。此外，AI 協助教師批改作業、分析學習數據。未來 AI 與教育的結合將更緊密，為學生創造更好的學習體驗。', link: '#', date: '' },
            { title: '一本雜誌和他倡導的生活', source: '三聯生活周刊', summary: '三聯生活周刊以深度報導與文化評論見長，涵蓋封面故事、文化藝術、經濟社會、時尚生活等面向。每期以專題形式深入探討當代議題，為讀者提供有品質的閱讀體驗與生活思考。', link: 'https://www.lifeweek.com.cn/', date: '' },
            { title: '跑步新手入門：從零開始的訓練計畫', source: '運動去', summary: '跑步是門檻最低的運動之一。新手可從快走開始，逐步加入慢跑間歇。建議每週三次、每次 20 至 30 分鐘，配合適當的熱身與收操，避免運動傷害。持之以恆，你也能享受跑步帶來的健康與樂趣。', link: 'https://go-sport.tw/', date: '' },
            { title: 'NBA 季後賽：球星如何在高壓下發揮', source: '運動視界', summary: '季後賽的強度與張力遠超例行賽。頂尖球星如何在關鍵時刻保持專注、克服壓力？心理素質、團隊信任與戰術執行缺一不可。回顧經典戰役，看見運動員超越自我的瞬間。', link: 'https://www.sportsv.net/', date: '' },
            { title: '金曲獎背後的音樂產業變遷', source: '台視娛樂', summary: '金曲獎見證了華語音樂的發展軌跡。從實體唱片到串流時代，音樂產業經歷巨大轉型。獨立音樂崛起、跨域合作增加，頒獎典禮不僅是榮耀時刻，更是產業趨勢的縮影。', link: 'https://www.ttv.com.tw/', date: '' },
            { title: '氣候變遷下的極地生態', source: '環境資訊中心', summary: '氣候變遷嚴重威脅極地生態。北極海冰逐年減少，北極熊生存空間受壓縮；南極企鵝也面臨棲地縮小與食物減少。科學家指出，減少化石燃料、保護森林、採取永續生活方式，都是我們能做的具體行動。', link: '#', date: '' },
            { title: '鄭和下西洋：明朝的海上絲路', source: '國家地理', summary: '十五世紀初，鄭和率領龐大船隊七次遠航西洋。船隊規模空前，最大寶船據說長達百公尺。遠航目的包括宣揚國威、發展貿易、建立外交。船隊曾到達東南亞、印度、阿拉伯半島與東非。', link: '#', date: '' }
        ];

        function stripHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return div.textContent || div.innerText || '';
        }

        function createSummary(text, maxLen) {
            const clean = stripHtml(text).replace(/\s+/g, ' ').trim();
            if (clean.length <= maxLen) return clean;
            let cut = clean.slice(0, maxLen);
            const lastPunct = cut.search(/[。！？]$/);
            if (lastPunct === -1) {
                const lastComma = cut.lastIndexOf('，');
                if (lastComma > maxLen * 0.5) cut = cut.slice(0, lastComma + 1);
                else cut = cut + '…';
            }
            return cut;
        }

        function parseRssXml(xmlText) {
            const items = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'text/xml');
                let entries = doc.querySelectorAll('item');
                if (entries.length === 0) entries = doc.querySelectorAll('entry');
                entries.forEach((el, i) => {
                    if (i >= 4) return;
                    const title = el.querySelector('title')?.textContent?.trim() || '';
                    const linkEl = el.querySelector('link');
                    const link = linkEl?.getAttribute?.('href') || linkEl?.textContent?.trim() || '#';
                    const desc = el.querySelector('description')?.textContent?.trim() 
                        || el.querySelector('content')?.textContent?.trim() 
                        || el.querySelector('summary')?.textContent?.trim() || '';
                    const pubDate = el.querySelector('pubDate')?.textContent?.trim() 
                        || el.querySelector('updated')?.textContent?.trim() || '';
                    if (title && (desc || title)) {
                        items.push({
                            title,
                            link: link,
                            summary: createSummary(desc || title, SUMMARY_LENGTH),
                            date: pubDate
                        });
                    }
                });
            } catch (e) { console.warn('RSS parse error', e); }
            return items;
        }

        async function fetchRss(source) {
            const proxyUrl = CORS_PROXY + encodeURIComponent(source.url);
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 5000);
                const res = await fetch(proxyUrl, { signal: ctrl.signal });
                clearTimeout(t);
                const text = await res.text();
                const items = parseRssXml(text);
                if (items.length > 0) return items.map(it => ({ ...it, source: source.name }));
            } catch (e) { /* ignore */ }
            return [];
        }

        async function loadArticles() {
            let all = [];
            for (const src of RSS_SOURCES) {
                const items = await fetchRss(src);
                all = all.concat(items);
            }
            if (all.length === 0) all = FALLBACK_ARTICLES;
            all.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            return all.slice(0, 15);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function renderArticles(articles) {
            const html = articles.map((a, idx) => {
                const titleHtml = a.link && a.link !== '#' 
                    ? `<a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(a.title)}</a>` 
                    : esc(a.title);
                return `
                <div class="article-card" data-idx="${idx}">
                    <div class="article-source">${esc(a.source)}</div>
                    <h2 class="article-title">${titleHtml}</h2>
                    <p class="article-summary">${esc(a.summary)}</p>
                    <div class="article-meta">${a.date ? new Date(a.date).toLocaleDateString('zh-TW') : ''}</div>
                    <button class="tts-btn" onclick="readSummary(${idx})" id="ttsBtn${idx}">
                        🔊 語音朗讀摘要
                    </button>
                </div>
            `;
            }).join('');
            document.getElementById('contentArea').innerHTML = html;
        }

        let articles = [];
        let currentUtterance = null;

        function readSummary(idx) {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音朗讀');
                return;
            }
            speechSynthesis.cancel();
            const btn = document.getElementById('ttsBtn' + idx);
            const summary = articles[idx]?.summary;
            if (!summary) return;

            document.querySelectorAll('.tts-btn').forEach(b => b.classList.remove('playing'));
            btn.classList.add('playing');

            const u = new SpeechSynthesisUtterance(summary);
            u.lang = 'zh-TW';
            u.rate = 1;
            u.onend = () => btn.classList.remove('playing');
            u.onerror = () => btn.classList.remove('playing');
            speechSynthesis.speak(u);
        }

        async function init() {
            articles = FALLBACK_ARTICLES;
            renderArticles(articles);
            try {
                const loaded = await loadArticles();
                if (loaded.length > 0) {
                    articles = loaded;
                    renderArticles(articles);
                }
            } catch (e) { /* keep fallback */ }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
