<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legendary Card Creator · 傳奇卡牌工坊</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .page { max-width: 1600px; margin: 0 auto; padding: 18px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .topbar h1 { margin: 0; font-size: 1.45rem; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn.primary {
      background: #ffcb05;
      color: #0f172a;
      border-color: #ffcb05;
      font-weight: 700;
    }
    .layout {
      display: grid;
      grid-template-columns: 35% 65%;
      gap: 14px;
      align-items: start;
    }
    .panel {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 14px;
      min-height: 78vh;
      display: flex;
      flex-direction: column;
    }
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .tab {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      background: rgba(15,23,42,0.7);
      color: #cbd5e1;
      padding: 8px;
      cursor: pointer;
    }
    .tab.active { border-color: rgba(255,203,5,0.7); background: rgba(255,203,5,0.18); color: #fde68a; }
    .tab-content {
      overflow-y: auto;
      padding-right: 2px;
      display: none;
      flex: 1;
    }
    .tab-content.active { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
    .input, .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      background: rgba(2,6,23,0.8);
      color: #f8fafc;
      padding: 10px 12px;
    }
    .textarea { min-height: 95px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chip {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(2,6,23,0.55);
      color: #cbd5e1;
      padding: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .chip.active { border-color: rgba(255,203,5,0.75); color: #fde68a; background: rgba(255,203,5,0.16); }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: rgba(2,6,23,0.55);
    }
    .preview-wrap {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 14px;
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }
    .preview-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
      justify-content: center;
      flex: 1;
    }
    .preview-stage {
      flex: 1 1 280px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .c-art-panel {
      flex: 0 0 220px;
      max-width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: rgba(2,6,23,0.45);
      padding: 12px;
    }
    .c-art-panel h3 {
      margin: 0 0 10px 0;
      font-size: 0.95rem;
      color: #fde68a;
      font-weight: 700;
    }
    .c-art-panel .hint {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .art-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
    }
    .art-thumb {
      aspect-ratio: 1;
      border-radius: 10px;
      background: rgba(15,23,42,0.9);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.12);
      transition: border-color 0.15s, transform 0.15s;
    }
    .art-thumb:hover { border-color: rgba(253,224,71,0.5); transform: scale(1.02); }
    .art-thumb.active { border-color: #ffcb05; box-shadow: 0 0 0 1px rgba(255,203,5,0.4); }
    .scene { width: min(460px, 100%); perspective: 1700px; }
    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 63 / 88;
      transform-style: preserve-3d;
      transition: transform .18s ease-out;
    }
    .face {
      position: absolute; inset: 0;
      border-radius: 28px;
      backface-visibility: hidden;
      overflow: hidden;
    }
    .front-shell { padding: 6px; }
    .front-inner {
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #020617 0%, #0f172a 45%, #020617 100%);
    }
    .card-art {
      position: absolute;
      inset: 15% 6% 40%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 234, 176, 0.68);
      background: linear-gradient(130deg, rgba(255,203,5,.22), rgba(59,130,246,.4), rgba(168,85,247,.46));
    }
    .card-art.full { inset: 0; border: none; border-radius: 0; }
    .holo {
      position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .85;
      background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.62) 0%, rgba(255,255,255,.2) 16%, rgba(255,255,255,0) 40%),
        linear-gradient(115deg, rgba(255,0,153,.16), rgba(255,203,5,.15), rgba(0,220,255,.15), rgba(119,0,255,.18), rgba(255,255,255,.1));
    }
    .header {
      position: absolute; top: 4.8%; left: 5%; right: 5%;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .name { font-weight: 800; font-size: clamp(1.1rem, 2.8vw, 1.5rem); line-height: 1.1; }
    .hp { text-align: right; color: #fda4af; font-weight: 800; }
    .hp small { display: block; color: rgba(252,165,165,.85); font-size: .62rem; letter-spacing: .2em; }
    .infobox {
      position: absolute; left: 6%; right: 6%; bottom: 11%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
      padding: 12px;
    }
    .ability { font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: .87rem; line-height: 1.5; color: #e2e8f0; }
    .energy { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
    .orb {
      width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center;
      color: white; font-size: .7rem; font-weight: 700;
    }
    .footer {
      position: absolute; left: 6%; right: 6%; bottom: 4.7%;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .66rem; letter-spacing: .12em;
      color: rgba(248,250,252,.86);
    }
    .edition {
      position: absolute; left: 6.5%; bottom: 7.2%;
      border: 1px solid #fcd34d; color: #fcd34d; background: rgba(31,41,55,.75);
      border-radius: 7px; padding: 3px 6px; font-size: .6rem; letter-spacing: .15em; font-weight: 700;
    }
    .frame-texture {
      position: absolute; inset: 0; pointer-events: none; border-radius: 28px;
    }
    .frame-texture.brushed {
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
      opacity: .6;
    }
    .frame-texture.carbon {
      background-image:
        repeating-conic-gradient(rgba(255,255,255,.12) 0% 25%, transparent 0% 50%) 0 0 / 8px 8px,
        repeating-conic-gradient(rgba(0,0,0,.16) 0% 25%, transparent 0% 50%) 4px 4px / 8px 8px;
      mix-blend-mode: overlay;
      opacity: .7;
    }
    .frame-texture.diamond {
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,.2) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.15) 0 2px, transparent 2px 10px);
      mix-blend-mode: overlay;
      opacity: .55;
    }
    .frame-texture.linen {
      background-image:
        repeating-linear-gradient(0deg, rgba(210,180,140,.22) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(210,180,140,.18) 0 1px, transparent 1px 4px);
      mix-blend-mode: color-burn;
      opacity: .55;
    }
    .back { transform: rotateY(180deg); background:
      radial-gradient(circle at 20% 20%, rgba(96,165,250,.35), transparent 28%),
      radial-gradient(circle at 80% 25%, rgba(168,85,247,.38), transparent 24%),
      linear-gradient(135deg,#060d27 0%,#132257 48%,#1b0f3b 100%); }
    .back-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: .45;
      pointer-events: none;
    }
    .ring { position: absolute; left: 50%; top: 50%; border-radius: 999px; transform: translate(-50%,-50%); border: 1px solid rgba(255,255,255,.25); }
    .ring.r1 { width: 76%; height: 76%; }
    .ring.r2 { width: 78%; height: 78%; border-color: rgba(186,230,253,.32); animation: spin 16s linear infinite; }
    .core { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; transform: translate(-50%,-50%); border-radius: 999px;
      background: radial-gradient(circle, rgba(255,203,5,.95) 0%, rgba(255,203,5,.72) 38%, rgba(255,255,255,.2) 39%, rgba(255,255,255,.05) 60%, transparent 61%); border: 1px solid rgba(255,255,255,.35); }
    .back-title {
      position: absolute;
      top: 11%;
      left: 8%;
      right: 8%;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .2em;
      color: rgba(248,250,252,.95);
      text-shadow: 0 2px 12px rgba(2,6,23,.8);
    }
    .back-subtitle {
      position: absolute;
      top: 17%;
      left: 10%;
      right: 10%;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .18em;
      color: rgba(226,232,240,.78);
    }
    .back-badge {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(15,23,42,.4);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .65rem;
      letter-spacing: .12em;
      color: rgba(226,232,240,.9);
      backdrop-filter: blur(6px);
    }
    @keyframes spin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
    .reflection {
      width: 74%; height: 28px; margin: 8px auto 0;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(203,213,225,.18), rgba(15,23,42,.02)),
        radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(15,23,42,0) 72%);
      filter: blur(2px);
      transform: perspective(700px) rotateX(70deg);
    }
    .status {
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #cbd5e1;
      width: 100%;
      padding: 10px 12px;
      font-size: .85rem;
    }
    .frame-texture.none { opacity: 0; pointer-events: none; }
    /* 匯出 PNG 時暫時弱化會讓截圖引擎卡住或空白的樣式（backdrop / blend） */
    body.export-snapshot #scene { perspective: none !important; }
    body.export-snapshot .infobox {
      backdrop-filter: none !important;
      background: rgba(15, 23, 42, 0.94) !important;
    }
    body.export-snapshot .holo {
      mix-blend-mode: normal !important;
      opacity: 0.7 !important;
    }
    body.export-snapshot .frame-texture {
      mix-blend-mode: normal !important;
      opacity: 0.5 !important;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .panel, .preview-wrap { min-height: auto; }
      .preview-row { flex-direction: column; }
      .c-art-panel { flex: 1 1 auto; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <small style="color:#fcd34d;letter-spacing:.12em;">Legendary Card Creator · 傳奇卡牌工坊</small>
        <h1>收藏級電子卡牌工坊</h1>
      </div>
      <div class="btns">
        <a class="btn" href="../index.html">返回桃花源</a>
        <button class="btn" id="btnFlip">翻到背面</button>
        <button class="btn primary" id="btnExport">匯出 PNG</button>
      </div>
    </div>

    <div class="layout">
      <aside class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="front">正面</button>
          <button class="tab" data-tab="back">背面</button>
        </div>

        <section class="tab-content active" id="tab-front">
          <div class="field"><label>卡牌名稱</label><input id="name" class="input" value="星焰靈狐" /></div>
          <div class="field"><label>生命值／戰力</label><input id="hp" class="input" value="320" /></div>
          <div class="field"><label>能力名稱</label><input id="ability" class="input" value="星光爆裂" /></div>
          <div class="field"><label>能力敘述</label><textarea id="desc" class="textarea">引導棱鏡烈焰掃過戰場：抽兩張牌，再指定一個對手目標造成輻射濺射傷害。</textarea></div>
          <div class="field row">
            <div><label>繪師</label><input id="illustrator" class="input" value="張老師" /></div>
            <div><label>卡號</label><input id="setNumber" class="input" value="桃-001／異畫" /></div>
          </div>
          <div class="field">
            <label>能量符號</label>
            <div class="chip-row" id="energyWrap"></div>
          </div>
          <div class="field">
            <label>一鍵風格</label>
            <div class="row">
              <button class="chip active" id="btnVintage">復古模式</button>
              <button class="chip" id="btnModern">現代模式</button>
            </div>
          </div>
          <div class="field">
            <label>邊框材質</label>
            <div class="chip-row" style="grid-template-columns: repeat(4,1fr);">
              <button class="chip" data-texture="none">無</button>
              <button class="chip active" data-texture="brushed">拉絲</button>
              <button class="chip" data-texture="carbon">碳纖維</button>
              <button class="chip" data-texture="diamond">鑽切</button>
            </div>
          </div>
          <div class="field">
            <label>邊框色調</label>
            <input id="borderTint" class="input" type="color" value="#ffcb05" />
          </div>
          <div class="field">
            <label>稀有度星級</label>
            <div class="chip-row">
              <button class="chip" data-rarity="1">★</button>
              <button class="chip" data-rarity="2">★★</button>
              <button class="chip active" data-rarity="3">★★★</button>
            </div>
          </div>
        </section>

        <section class="tab-content" id="tab-back">
          <div class="field">
            <label>卡背標題／副標</label>
            <div class="row">
              <input id="backTitle" class="input" value="傳奇" />
              <input id="backSubtitle" class="input" value="經典軌道" />
            </div>
          </div>
          <div class="field">
            <label>卡背配色（外環／核心光）</label>
            <div class="row">
              <input id="backRingColor" class="input" type="color" value="#bae6fd" />
              <input id="backCoreColor" class="input" type="color" value="#ffcb05" />
            </div>
          </div>
          <div class="field">
            <label>卡背徽章文字</label>
            <input id="backBadgeText" class="input" value="收藏家版" />
          </div>
          <div class="field">
            <label>卡背背景圖（選填）</label>
            <input id="backUpload" type="file" class="input" accept="image/*" />
            <small id="backUploadName" style="display:block;margin-top:6px;color:#94a3b8;">尚未上傳卡背背景</small>
          </div>
          <button class="btn" id="btnReset" style="width:100%;">一鍵重置全部</button>
        </section>
      </aside>

      <section class="preview-wrap">
        <div class="preview-row">
          <div class="preview-stage">
            <div class="scene" id="scene">
              <div class="card" id="card3d">
                <div class="face front-shell" id="frontShell">
                  <div class="front-inner" id="frontInner">
                    <div class="card-art" id="cardArt"></div>
                    <div class="holo" id="holo"></div>
                    <div class="header" id="cardHeader">
                      <div class="name" id="vName">星焰靈狐</div>
                      <div class="hp"><small>戰力</small><span id="vHp">320</span></div>
                    </div>
                    <div class="infobox">
                      <div class="ability" id="vAbility">星光爆裂</div>
                      <div class="desc" id="vDesc">引導棱鏡烈焰掃過戰場：抽兩張牌，再指定一個對手目標造成輻射濺射傷害。</div>
                      <div class="energy" id="vEnergy"></div>
                    </div>
                    <div class="footer">
                      <div id="vRarity">★ ★ ★</div>
                      <div id="vIllustrator">繪師　張老師</div>
                      <div id="vSet">桃-001／異畫</div>
                    </div>
                    <div class="edition" id="edition">首版</div>
                  </div>
                  <div class="frame-texture brushed" id="frameTexture"></div>
                </div>
                <div class="face back">
                  <div class="back-bg" id="backBg"></div>
                  <div class="ring r1"></div>
                  <div class="ring r2" id="backRing"></div>
                  <div class="core" id="backCore"></div>
                  <div class="back-title" id="vBackTitle">傳奇</div>
                  <div class="back-subtitle" id="vBackSubtitle">經典軌道</div>
                  <div class="back-badge" id="vBackBadge">收藏家版</div>
                </div>
              </div>
              <div class="reflection"></div>
            </div>
          </div>
          <aside class="c-art-panel">
            <h3>卡牌C位插畫</h3>
            <p class="hint">上傳正面主視覺插畫；下方圖庫可點選切換為目前卡面插畫。</p>
            <input id="artUpload" type="file" class="input" accept="image/*" />
            <small id="uploadName" style="display:block;margin-top:6px;color:#94a3b8;">尚未上傳插畫</small>
            <div class="art-gallery" id="artGallery"></div>
          </aside>
        </div>
        <div class="status" id="status">就緒。請從左側編輯正面／背面，或在此上傳 C 位插畫。</div>
      </section>
    </div>
  </div>

  <script>
    const state = {
      era: "vintage",
      showBack: false,
      rarity: 3,
      energies: ["fire", "electric", "psychic"],
      artUrl: null,
      backArtUrl: null,
      frameTexture: "brushed",
      artGallery: [],
      activeArtId: null,
    };

    const DEFAULT_CARD_ART_BG =
      "linear-gradient(130deg, rgba(255,203,5,.22), rgba(59,130,246,.4), rgba(168,85,247,.46))";

    const refs = {
      tabs: document.querySelectorAll(".tab"),
      contents: {
        front: document.getElementById("tab-front"),
        back: document.getElementById("tab-back"),
      },
      name: document.getElementById("name"),
      hp: document.getElementById("hp"),
      ability: document.getElementById("ability"),
      desc: document.getElementById("desc"),
      illustrator: document.getElementById("illustrator"),
      setNumber: document.getElementById("setNumber"),
      vName: document.getElementById("vName"),
      vHp: document.getElementById("vHp"),
      vAbility: document.getElementById("vAbility"),
      vDesc: document.getElementById("vDesc"),
      vIllustrator: document.getElementById("vIllustrator"),
      vSet: document.getElementById("vSet"),
      vEnergy: document.getElementById("vEnergy"),
      vRarity: document.getElementById("vRarity"),
      card3d: document.getElementById("card3d"),
      scene: document.getElementById("scene"),
      cardArt: document.getElementById("cardArt"),
      frontShell: document.getElementById("frontShell"),
      cardHeader: document.getElementById("cardHeader"),
      holo: document.getElementById("holo"),
      frameTexture: document.getElementById("frameTexture"),
      edition: document.getElementById("edition"),
      borderTint: document.getElementById("borderTint"),
      textureBtns: document.querySelectorAll("[data-texture]"),
      btnVintage: document.getElementById("btnVintage"),
      btnModern: document.getElementById("btnModern"),
      btnFlip: document.getElementById("btnFlip"),
      btnExport: document.getElementById("btnExport"),
      artUpload: document.getElementById("artUpload"),
      uploadName: document.getElementById("uploadName"),
      backUpload: document.getElementById("backUpload"),
      backUploadName: document.getElementById("backUploadName"),
      energyWrap: document.getElementById("energyWrap"),
      status: document.getElementById("status"),
      rarityBtns: document.querySelectorAll("[data-rarity]"),
      backTitle: document.getElementById("backTitle"),
      backSubtitle: document.getElementById("backSubtitle"),
      backBadgeText: document.getElementById("backBadgeText"),
      backRingColor: document.getElementById("backRingColor"),
      backCoreColor: document.getElementById("backCoreColor"),
      vBackTitle: document.getElementById("vBackTitle"),
      vBackSubtitle: document.getElementById("vBackSubtitle"),
      vBackBadge: document.getElementById("vBackBadge"),
      backRing: document.getElementById("backRing"),
      backCore: document.getElementById("backCore"),
      backBg: document.getElementById("backBg"),
      artGallery: document.getElementById("artGallery"),
    };

    const ENERGY_META = {
      fire: { symbol: "F", gradient: "linear-gradient(135deg,#fb923c,#f43f5e)" },
      water: { symbol: "W", gradient: "linear-gradient(135deg,#22d3ee,#2563eb)" },
      electric: { symbol: "L", gradient: "linear-gradient(135deg,#fde047,#f97316)" },
      grass: { symbol: "G", gradient: "linear-gradient(135deg,#a3e635,#16a34a)" },
      psychic: { symbol: "P", gradient: "linear-gradient(135deg,#e879f9,#7c3aed)" },
      dark: { symbol: "D", gradient: "linear-gradient(135deg,#64748b,#0f172a)" },
    };

    function setStatus(text) { refs.status.textContent = text; }

    function renderEnergyButtons() {
      refs.energyWrap.innerHTML = "";
      Object.keys(ENERGY_META).forEach((key) => {
        const b = document.createElement("button");
        b.className = "chip" + (state.energies.includes(key) ? " active" : "");
        b.textContent = ENERGY_META[key].symbol;
        b.onclick = () => {
          const has = state.energies.includes(key);
          if (has) state.energies = state.energies.filter((v) => v !== key);
          else state.energies.push(key);
          if (!state.energies.length) state.energies = [key];
          renderEnergyButtons();
          renderCard();
        };
        refs.energyWrap.appendChild(b);
      });
    }

    function renderCardEnergy() {
      refs.vEnergy.innerHTML = "";
      state.energies.forEach((key) => {
        const orb = document.createElement("div");
        orb.className = "orb";
        orb.textContent = ENERGY_META[key].symbol;
        orb.style.background = ENERGY_META[key].gradient;
        refs.vEnergy.appendChild(orb);
      });
    }

    function renderArtGallery() {
      if (!refs.artGallery) return;
      refs.artGallery.innerHTML = "";
      state.artGallery.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "art-thumb" + (item.id === state.activeArtId ? " active" : "");
        btn.style.backgroundImage = `url("${item.url}")`;
        btn.title = "設為卡面插畫";
        btn.onclick = () => selectArtFromGallery(item);
        refs.artGallery.appendChild(btn);
      });
    }

    function selectArtFromGallery(item) {
      state.activeArtId = item.id;
      state.artUrl = item.url;
      refs.cardArt.style.background = `url("${item.url}") center / cover`;
      renderArtGallery();
      setStatus("已切換為圖庫中的插畫。");
    }

    function renderCard() {
      refs.vName.textContent = refs.name.value || "未命名";
      refs.vHp.textContent = refs.hp.value || "0";
      refs.vAbility.textContent = refs.ability.value || "能力";
      refs.vDesc.textContent = refs.desc.value || "";
      refs.vIllustrator.textContent = "繪師　" + (refs.illustrator.value || "—");
      refs.vSet.textContent = refs.setNumber.value || "—";
      refs.vRarity.textContent = Array.from({ length: state.rarity }).map(() => "★").join(" ");
      renderCardEnergy();

      const modern = state.era === "modern";
      refs.cardArt.classList.toggle("full", modern);
      refs.edition.style.display = modern ? "none" : "block";

      var tint = refs.borderTint.value;
      var r = parseInt(tint.slice(1,3),16), g = parseInt(tint.slice(3,5),16), b = parseInt(tint.slice(5,7),16);
      var bright = `rgb(${Math.min(r+80,255)},${Math.min(g+80,255)},${Math.min(b+80,255)})`;
      var dark = `rgb(${Math.max(r-60,0)},${Math.max(g-60,0)},${Math.max(b-60,0)})`;

      if (modern) {
        refs.frontShell.style.background = `linear-gradient(145deg, ${bright}90, ${tint}50, ${dark}60)`;
        refs.frontShell.style.boxShadow = `0 40px 120px -52px ${tint}88`;
      } else {
        refs.frontShell.style.background = `linear-gradient(145deg, ${bright} 0%, ${tint} 25%, ${dark} 55%, ${bright} 80%, ${dark} 100%)`;
        refs.frontShell.style.boxShadow = `0 35px 110px -50px ${tint}bb`;
      }

      refs.frameTexture.className = state.frameTexture
        ? "frame-texture " + state.frameTexture
        : "frame-texture none";

      refs.vBackTitle.textContent = refs.backTitle.value || "傳奇";
      refs.vBackSubtitle.textContent = refs.backSubtitle.value || "經典軌道";
      refs.vBackBadge.textContent = refs.backBadgeText.value || "收藏家版";
      refs.backRing.style.borderColor = refs.backRingColor.value;
      refs.backCore.style.background = `radial-gradient(circle, ${refs.backCoreColor.value} 0%, ${refs.backCoreColor.value}cc 38%, rgba(255,255,255,.2) 39%, rgba(255,255,255,.05) 60%, transparent 61%)`;
    }

    function activateTab(tab) {
      refs.tabs.forEach((node) => node.classList.toggle("active", node.dataset.tab === tab));
      Object.keys(refs.contents).forEach((key) => refs.contents[key].classList.toggle("active", key === tab));
    }

    async function applySmartHeaderColor(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = url;
        });
        const c = document.createElement("canvas");
        c.width = 48; c.height = 48;
        const x = c.getContext("2d");
        x.drawImage(img, 0, 0, 48, 48);
        const data = x.getImageData(0, 0, 48, 48).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          const rr = data[i], gg = data[i+1], bb = data[i+2];
          const sat = Math.max(rr, gg, bb) - Math.min(rr, gg, bb);
          if (sat < 14) continue;
          r += rr; g += gg; b += bb; count += 1;
        }
        if (!count) return;
        r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
        const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
        refs.cardHeader.style.background = `rgb(${r},${g},${b})`;
        refs.cardHeader.style.color = lum > 0.62 ? "#0f172a" : "#f8fafc";
        setStatus("已依插畫主色調自動調整標題欄顏色。");
      } catch (_) {
        setStatus("圖片已載入，智能配色未成功。");
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    refs.tabs.forEach((node) => node.addEventListener("click", () => activateTab(node.dataset.tab)));
    [refs.name, refs.hp, refs.ability, refs.desc, refs.illustrator, refs.setNumber, refs.backTitle, refs.backSubtitle, refs.backBadgeText, refs.backRingColor, refs.backCoreColor, refs.borderTint].forEach((node) => node.addEventListener("input", renderCard));

    refs.btnVintage.onclick = () => {
      state.era = "vintage";
      refs.btnVintage.classList.add("active");
      refs.btnModern.classList.remove("active");
      renderCard();
    };
    refs.btnModern.onclick = () => {
      state.era = "modern";
      refs.btnModern.classList.add("active");
      refs.btnVintage.classList.remove("active");
      renderCard();
    };

    refs.textureBtns.forEach((button) => {
      button.onclick = () => {
        state.frameTexture = button.dataset.texture === "none" ? "" : button.dataset.texture;
        refs.textureBtns.forEach((b) => b.classList.toggle("active", b === button));
        renderCard();
      };
    });

    refs.rarityBtns.forEach((button) => {
      button.onclick = () => {
        state.rarity = Number(button.dataset.rarity);
        refs.rarityBtns.forEach((b) => b.classList.toggle("active", b === button));
        renderCard();
      };
    });

    refs.btnFlip.onclick = () => {
      state.showBack = !state.showBack;
      refs.card3d.style.transform = state.showBack ? "rotateY(180deg)" : "rotateY(0deg)";
      refs.btnFlip.textContent = state.showBack ? "顯示正面" : "翻到背面";
    };

    refs.scene.addEventListener("mousemove", (event) => {
      if (state.showBack) return;
      const rect = refs.scene.getBoundingClientRect();
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = (event.clientY - rect.top) / rect.height;
      const rx = (0.5 - ny) * 9;
      const ry = (nx - 0.5) * 12;
      refs.card3d.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
      refs.holo.style.setProperty("--mx", `${nx * 100}%`);
      refs.holo.style.setProperty("--my", `${ny * 100}%`);
    });
    refs.scene.addEventListener("mouseleave", () => {
      refs.card3d.style.transform = state.showBack ? "rotateY(180deg)" : "rotateY(0deg)";
      refs.holo.style.setProperty("--mx", "50%");
      refs.holo.style.setProperty("--my", "50%");
    });

    refs.artUpload.onchange = async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const id = "art-" + Date.now();
      state.artGallery.push({ id: id, url: url });
      state.activeArtId = id;
      state.artUrl = url;
      refs.uploadName.textContent = file.name;
      refs.cardArt.style.background = `url("${url}") center / cover`;
      renderArtGallery();
      await applySmartHeaderColor(file);
    };

    refs.backUpload.onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (state.backArtUrl) URL.revokeObjectURL(state.backArtUrl);
      state.backArtUrl = URL.createObjectURL(file);
      refs.backUploadName.textContent = file.name;
      refs.backBg.style.backgroundImage = `url("${state.backArtUrl}")`;
      setStatus("已更新卡背背景。");
    };

    refs.btnReset.onclick = () => {
      refs.name.value = "星焰靈狐";
      refs.hp.value = "320";
      refs.ability.value = "星光爆裂";
      refs.desc.value = "引導棱鏡烈焰掃過戰場：抽兩張牌，再指定一個對手目標造成輻射濺射傷害。";
      refs.illustrator.value = "張老師";
      refs.setNumber.value = "桃-001／異畫";
      state.frameTexture = "brushed";
      refs.textureBtns.forEach((b) => b.classList.toggle("active", b.dataset.texture === "brushed"));
      refs.borderTint.value = "#ffcb05";
      state.rarity = 3;
      refs.rarityBtns.forEach((b) => b.classList.toggle("active", b.dataset.rarity === "3"));
      state.energies = ["fire", "electric", "psychic"];
      state.era = "vintage";
      refs.btnVintage.classList.add("active");
      refs.btnModern.classList.remove("active");
      refs.cardHeader.style.background = "rgb(51,65,85)";
      refs.cardHeader.style.color = "#f8fafc";
      refs.backTitle.value = "傳奇";
      refs.backSubtitle.value = "經典軌道";
      refs.backBadgeText.value = "收藏家版";
      refs.backRingColor.value = "#bae6fd";
      refs.backCoreColor.value = "#ffcb05";
      if (state.backArtUrl) URL.revokeObjectURL(state.backArtUrl);
      state.backArtUrl = null;
      refs.backBg.style.backgroundImage = "none";
      refs.backUploadName.textContent = "尚未上傳卡背背景";
      state.artGallery.forEach((item) => URL.revokeObjectURL(item.url));
      state.artGallery = [];
      state.activeArtId = null;
      state.artUrl = null;
      refs.cardArt.style.background = DEFAULT_CARD_ART_BG;
      refs.uploadName.textContent = "尚未上傳插畫";
      if (refs.artUpload) refs.artUpload.value = "";
      renderArtGallery();
      renderEnergyButtons();
      renderCard();
      setStatus("已重置為預設範例與樣式。");
    };

    function sanitizeFilenameBase(name) {
      const base = (name || "legendary-card").trim() || "legendary-card";
      return base
        .replace(/[/\\?%*:|"<>]/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "") || "legendary-card";
    }

    function withTimeout(promise, ms, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(message || "操作逾時")), ms)
        ),
      ]);
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 2500);
    }

    refs.btnExport.onclick = async () => {
      const target = refs.card3d;
      if (!target) {
        setStatus("找不到卡牌節點。");
        return;
      }
      const hasH2c = typeof window.html2canvas === "function";
      const hasHti =
        window.htmlToImage && typeof window.htmlToImage.toBlob === "function";
      if (!hasH2c && !hasHti) {
        setStatus("圖片匯出程式庫未載入（請確認網路可連 CDN）。");
        return;
      }

      const previousTransform = refs.card3d.style.transform;
      refs.btnExport.disabled = true;
      refs.btnExport.textContent = "匯出中...";
      setStatus("正在輸出 PNG...");
      document.body.classList.add("export-snapshot");

      try {
        refs.card3d.style.transform = state.showBack ? "rotateY(180deg)" : "rotateY(0deg)";
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

        let blob = null;
        if (hasHti) {
          try {
            blob = await withTimeout(
              window.htmlToImage.toBlob(target, {
                pixelRatio: 3,
                cacheBust: true,
                skipFonts: true,
              }),
              45000,
              "html-to-image 逾時"
            );
          } catch (e) {
            console.warn("html-to-image:", e);
          }
        }

        if (!blob && hasH2c) {
          const canvas = await withTimeout(
            window.html2canvas(target, {
              backgroundColor: null,
              scale: 2,
              useCORS: true,
              logging: false,
              onclone: (clonedDoc) => {
                const scene = clonedDoc.getElementById("scene");
                if (scene) scene.style.perspective = "none";
                const card = clonedDoc.getElementById("card3d");
                if (card) {
                  card.style.transform = state.showBack ? "rotateY(180deg)" : "rotateY(0deg)";
                  card.style.transformStyle = "flat";
                }
                const inf = clonedDoc.querySelector(".infobox");
                if (inf) inf.style.backdropFilter = "none";
              },
            }),
            45000,
            "html2canvas 逾時"
          );
          blob = await new Promise((resolve, reject) => {
            canvas.toBlob((b) => {
              if (!b) reject(new Error("無法建立 PNG 檔案"));
              else resolve(b);
            }, "image/png");
          });
        }

        if (!blob) throw new Error("無法產生圖檔");

        triggerDownload(blob, sanitizeFilenameBase(refs.name.value) + ".png");
        setStatus("PNG 匯出完成。");
      } catch (error) {
        const msg = error && error.message ? error.message : String(error);
        setStatus("PNG 匯出失敗：" + msg);
        console.error(error);
      } finally {
        document.body.classList.remove("export-snapshot");
        refs.card3d.style.transform = previousTransform;
        refs.btnExport.disabled = false;
        refs.btnExport.textContent = "匯出 PNG";
      }
    };

    renderEnergyButtons();
    renderArtGallery();
    renderCard();
  </script>
</body>
</html>
