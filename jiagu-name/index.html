<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>甲骨尋名 · 桃花源</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>龜</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">跳到內容</a>
  <div class="page">
    <header class="top-bar">
      <a class="back-link" href="../index.html">返回桃花源</a>
      <span class="brand-kicker">漢字小探險</span>
    </header>

    <main id="main">
      <section class="hero">
        <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
          <path fill="currentColor" opacity="0.16" d="M28 38c0-14 20-24 36-18 10 4 18 16 16 28-8 4-18 6-28 4-12-2-22-6-24-14z"/>
          <path fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" d="M33 46c2-16 18-26 34-20 11 4 18 16 16 28-2 14-16 24-30 22-14-2-24-14-20-30z"/>
          <path fill="none" stroke="currentColor" stroke-width="3.2" d="M42 44h20v16H42zM52 44v16M42 52h20"/>
          <path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" d="M36 38c-8-2-14 6-10 12M78 42c8 0 12 10 6 14M34 66c-8 8-4 16 4 14M74 66c10 6 8 16-2 14"/>
          <circle cx="70" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="3.6"/>
          <circle cx="73" cy="30" r="1.6" fill="currentColor"/>
        </svg>
        <h1>甲骨尋名</h1>
        <p>把你的名字寫下來，看它在三千年前的龜甲上，會變成什麼模樣。</p>
      </section>

      <form class="search-panel" id="nameForm">
        <div class="search-row">
          <label class="skip" for="nameInput">名字</label>
          <input
            id="nameInput"
            name="name"
            type="text"
            maxlength="8"
            autocomplete="off"
            placeholder="寫下你的名字，例如：小雨"
          />
          <button type="submit">尋找甲骨名</button>
        </div>
        <div class="chips" aria-label="試試這些名字">
          <button type="button" data-name="小雨">小雨</button>
          <button type="button" data-name="明心">明心</button>
          <button type="button" data-name="林安">林安</button>
          <button type="button" data-name="日升">日升</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>

      <aside class="intro">
        <h2>什麼是甲骨文？</h2>
        <p>三千多年前，商朝的人把字刻在龜甲或牛骨上。那些字常常像一幅小畫：太陽是圓的，山是三座峰，雨是雲底下的水滴。我們現在寫的漢字，就是從這些小畫慢慢長出來的。</p>
      </aside>

      <section class="ritual" id="ritual" aria-hidden="true">
        <svg class="ritual-bone" viewBox="0 0 180 120">
          <ellipse class="glow" cx="90" cy="88" rx="46" ry="14" fill="#c4452d" opacity="0.25"/>
          <path fill="#f4e4c6" stroke="#8b6a45" stroke-width="2" d="M28 38c8-22 48-30 86-18 22 8 46 22 40 46-8 28-52 42-92 28C26 84 18 62 28 38z"/>
          <path class="crack" fill="none" stroke="#c4452d" stroke-width="2.4" stroke-linecap="round" d="M84 22c-4 18 8 28 2 46-8 14 10 20 6 34"/>
        </svg>
        <p>龜甲正被火輕輕問着……</p>
      </section>

      <section class="shell-stage" id="shellStage" aria-live="polite">
        <div class="shell-card">
          <span class="shell-label">龜甲上的名字</span>
          <div class="shell-name" id="shellName"></div>
        </div>
      </section>

      <section class="results" id="results"></section>
    </main>

    <footer class="page-foot">
      字形是為小朋友辨認而畫的教學象形，重點在「像什麼」，不是出土拓片的逐筆複製。字源說明也用五年級讀得懂的話來寫。
    </footer>
  </div>

  <script src="glyphs.js"></script>
  <script src="characters.js"></script>
  <script src="app.js"></script>
</body>
</html>
