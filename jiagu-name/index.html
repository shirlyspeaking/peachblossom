<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桃源契文 · 桃花源</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>龜</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/37/main/result.css" />
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/2214/main/result.css" />
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/957/main/result.css" />
  <link rel="stylesheet" href="styles.css?v=kids2" />
</head>
<body>
  <a class="skip" href="#main">跳到內容</a>
  <div class="page">
    <header class="top-bar">
      <a class="back-link" href="../index.html">← 返回桃花源</a>
    </header>

    <section class="hero">
      <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="82" rx="26" ry="5" fill="currentColor" opacity="0.12"/>
        <path fill="#ffe08a" d="M24 56c2-20 20-32 38-28 15 4 25 18 21 32-6 18-30 26-44 18-12-6-17-12-15-22z"/>
        <path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M24 56c2-20 20-32 38-28 15 4 25 18 21 32-6 18-30 26-44 18-12-6-17-12-15-22z"/>
        <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M40 40 52 50 42 62M52 50 66 44M52 50 60 64"/>
        <circle cx="82" cy="46" r="9" fill="#fff" stroke="currentColor" stroke-width="4"/>
        <circle cx="84" cy="44" r="2.2" fill="currentColor"/>
        <path fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" d="M30 72c-4 6-2 10 3 10M66 74c3 6 9 6 11 1"/>
      </svg>
      <div>
        <h1>桃源契文</h1>
        <p class="hero-sub">把字變回三千年前的樣子</p>
      </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="選一個玩法">
      <button type="button" role="tab" class="tab tab-wall" data-tab="wall" aria-selected="true" aria-controls="panel-wall">
        <span class="tab-icon" aria-hidden="true">牆</span>本班名牆
      </button>
      <button type="button" role="tab" class="tab tab-lookup" data-tab="lookup" aria-selected="false" aria-controls="panel-lookup">
        <span class="tab-icon" aria-hidden="true">查</span>查一個字
      </button>
      <button type="button" role="tab" class="tab tab-game" data-tab="game" aria-selected="false" aria-controls="panel-game">
        <span class="tab-icon" aria-hidden="true">猜</span>猜字遊戲
      </button>
      <button type="button" role="tab" class="tab tab-learn" data-tab="learn" aria-selected="false" aria-controls="panel-learn">
        <span class="tab-icon" aria-hidden="true">知</span>甲骨小知識
      </button>
    </nav>

    <main id="main">
      <section class="panel panel-wall" id="panel-wall" role="tabpanel">
        <div class="toolbar">
          <div class="script-toggle" role="group" aria-label="字體">
            <button type="button" class="is-on" data-wall-script="oracle">甲骨文</button>
            <button type="button" data-wall-script="seal">小篆</button>
          </div>
          <button type="button" class="btn btn-soft" id="flipAll">全部翻開</button>
          <button type="button" class="btn btn-soft" id="resetWall">重新蓋上</button>
          <button type="button" class="btn btn-main" id="editRoster">換成本班名單</button>
        </div>
        <p class="hint" id="wallHint">點一塊翻開。一整排翻完，就知道是誰！</p>

        <div class="roster" id="roster" hidden>
          <label for="rosterInput">一行寫一個名字（名單只存在這部電腦）</label>
          <textarea id="rosterInput" rows="7" placeholder="陳小雨&#10;林安&#10;張樂"></textarea>
          <div class="roster-actions">
            <button type="button" class="btn btn-main" id="saveRoster">做成名牆</button>
            <button type="button" class="btn btn-soft" id="sampleRoster">用示範名單</button>
          </div>
        </div>

        <div class="name-wall" id="nameWall"></div>
      </section>

      <section class="panel panel-lookup" id="panel-lookup" role="tabpanel" hidden>
        <form class="lookup-form" id="lookupForm">
          <label class="skip" for="lookupInput">要查的字</label>
          <input id="lookupInput" type="text" maxlength="4" autocomplete="off" placeholder="寫一個字" />
          <button type="submit" class="btn btn-main">查一查</button>
        </form>
        <div class="chips" id="lookupChips" aria-label="試試這些字">
          <button type="button">日</button>
          <button type="button">山</button>
          <button type="button">雨</button>
          <button type="button">魚</button>
          <button type="button">馬</button>
          <button type="button">龜</button>
        </div>
        <div class="lookup-result" id="lookupResult" aria-live="polite"></div>
      </section>

      <section class="panel panel-game" id="panel-game" role="tabpanel" hidden>
        <div class="game-top">
          <p class="game-round" id="gameRound"></p>
          <p class="game-stars" id="gameStars" aria-label="得分"></p>
        </div>
        <div class="game-card" id="gameCard">
          <p class="game-ask">這幅古老的小畫，是哪個字？</p>
          <div class="game-glyph" id="gameGlyph"></div>
          <div class="game-choices" id="gameChoices"></div>
          <p class="game-feedback" id="gameFeedback" aria-live="polite"></p>
          <button type="button" class="btn btn-main" id="gameNext" hidden>下一題 →</button>
        </div>
        <div class="game-end" id="gameEnd" hidden>
          <p class="game-end-title" id="gameEndTitle"></p>
          <p class="game-end-stars" id="gameEndStars"></p>
          <button type="button" class="btn btn-main" id="gameAgain">再玩一次</button>
        </div>
      </section>

      <section class="panel panel-learn" id="panel-learn" role="tabpanel" hidden>
        <p class="hint">點一點卡片，翻過來看答案。</p>
        <div class="facts" id="facts"></div>
      </section>
    </main>

    <div class="sheet" id="sheet" hidden>
      <button type="button" class="sheet-backdrop" id="sheetBackdrop" aria-label="關閉"></button>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetChar" id="sheetCard">
        <button type="button" class="sheet-close" id="sheetClose" aria-label="關閉">✕</button>
        <div class="sheet-pair">
          <div class="sheet-old">
            <div class="sheet-glyph" id="sheetGlyph"></div>
            <p class="sheet-label" id="sheetScript">甲骨文</p>
          </div>
          <span class="sheet-arrow" aria-hidden="true">→</span>
          <div class="sheet-new">
            <p class="sheet-char" id="sheetChar"></p>
            <p class="sheet-label" id="sheetPinyin"></p>
          </div>
        </div>
        <p class="sheet-meaning" id="sheetMeaning"></p>
        <p class="sheet-story" id="sheetStory"></p>
      </div>
    </div>

    <footer class="page-foot">古文字來自鏡原甲骨文、中山王篆、《說文解字》字型；缺字改用教學簡筆圖。</footer>
  </div>

  <script src="glyphs.js?v=kids2"></script>
  <script src="characters.js?v=kids2"></script>
  <script src="app.js?v=kids2"></script>
</body>
</html>
