                [/起點|歸/, "linear-gradient(145deg, #f0e0f5 0%, #d8b8e8 45%, #e8c8f0 100%)"]
            ];
            for (var i = 0; i < rules.length; i++) {
                if (rules[i][0].test(s)) return rules[i][1];
            }
            return null;
        }

        function normalizeTiles(rawTiles) {
            var out = [];
            for (var i = 0; i < DEFAULT_TILES.length; i++) {
                var def = DEFAULT_TILES[i];
                var t = rawTiles && rawTiles[i] ? rawTiles[i] : {};
                var merged = Object.assign({}, def, t);
                if (merged.owner !== undefined && merged.owner !== null && merged.owner !== "") {
                    var o = parseInt(merged.owner, 10);
                    merged.owner = isNaN(o) ? null : o;
                } else {
                    merged.owner = null;
                }
                out.push(merged);
            }
            return out;
        }

            return t && t.type === "tile-event" && (String(t.label).indexOf("機會") >= 0 || String(t.effect || "").indexOf("機會") >= 0);

            return t && t.type === "tile-event" && (String(t.label).indexOf("命運") >= 0 || String(t.effect || "").indexOf("命運") >= 0);
        }

        function readBoardPresetsRoot() {
            try {
                var raw = localStorage.getItem(BOARD_PRESETS_KEY);
                if (!raw) return { byUser: {} };
                var o = JSON.parse(raw);
                if (!o || typeof o !== "object" || !o.byUser) return { byUser: {} };
                return o;
            } catch (e) {
                return { byUser: {} };
            }
        }

        function writeBoardPresetsRoot(root) {
            try {
                localStorage.setItem(BOARD_PRESETS_KEY, JSON.stringify(root));
            } catch (e) {
                showToast("無法寫入收藏（可能超過容量）");
            }
        }

            if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
            return "p_" + Date.now() + "_" + Math.floor(Math.random() * 1e9);

            var merged = normalizeState({

                    currentPlayerIndex: 0,

            state.tiles = merged.tiles;

            state.fate = merged.fate;
            state.rulesText = merged.rulesText;
            state.game = merged.game;
            syncRulesTextarea();
            persistAfterBoardEdit();
            renderBoard();

        function fillPresetSelect() {
            var sel = document.getElementById("preset-select");
            if (!sel) return;
            sel.innerHTML = '<option value="">— 請選擇 —</option>';
            if (!myUserId) return;
            var root = readBoardPresetsRoot();
            var list = (root.byUser[myUserId] || []).slice();
            list.sort(function (a, b) {
                return (b.savedAt || 0) - (a.savedAt || 0);
            });
            list.forEach(function (p) {

        const DEFAULT_RULES_TEXT =
            "輪流擲骰，沿著外圈前進。\n" +
            "經過起點可拿到獎勵金幣。\n" +
            "停在機會或命運格，就抽一張牌照著做。\n" +

        /* ---------- State ---------- */
        let state = loadState();

        function defaultState() {
            return {
                tiles: DEFAULT_TILES.map(function (t) {
                    return Object.assign({}, t, { owner: null });
                }),
                chance: DEFAULT_CHANCE.map(c => ({ ...c })),
                fate: DEFAULT_FATE.map(f => ({ ...f })),
                rulesText: DEFAULT_RULES_TEXT,
                game: defaultGame()
            };
        }

        function normalizeState(raw) {
            if (!raw || typeof raw !== "object") return defaultState();
            if (!raw.rulesText || typeof raw.rulesText !== "string") {
                raw.rulesText = DEFAULT_RULES_TEXT;
            }
            raw.tiles = normalizeTiles(raw.tiles || []);
            if (!raw.game || typeof raw.game !== "object") {
                raw.game = defaultGame();
            } else {
                const g = raw.game;
                let n = parseInt(g.playerCount, 10);
                if (isNaN(n) || n < 2 || n > 6) n = 4;
                g.playerCount = n;
                if (!Array.isArray(g.players) || g.players.length !== n) {
                    g.players = buildDefaultPlayers(n);
                } else {
                    g.players = g.players.map(function (p, i) {
                        return {
                            id: i,
                            money: typeof p.money === "number" && p.money >= 0 ? Math.floor(p.money) : DEFAULT_START_MONEY,
                            position: typeof p.position === "number" ? ((p.position % NUM_TILES) + NUM_TILES) % NUM_TILES : 0
                        };
                    });
                }
                let cpi = parseInt(g.currentPlayerIndex, 10);
                if (isNaN(cpi)) cpi = 0;
                g.currentPlayerIndex = ((cpi % g.playerCount) + g.playerCount) % g.playerCount;
                if (!Array.isArray(g.turnLog)) {
                    g.turnLog = defaultGame().turnLog.slice();
                }
            }
            return raw;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return normalizeState(JSON.parse(raw));
            } catch (_) { /* ignore */ }
            return defaultState();
        }

        function saveState() {
            if (onlineMode) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        function renderBoard() {
            boardGrid.querySelectorAll(".tile").forEach(el => el.remove());
            var disAttr = canEditBoardAndCards() ? "" : " disabled";
            state.tiles.forEach((tile, i) => {
                const [row, col] = POS[i];
                const meta = TILE_META[tile.type] || { icon: "❓" };
                const el = document.createElement("div");
                el.className = `tile ${tile.type}`;
                el.style.gridRow = row;
                el.style.gridColumn = col;
                var tg = themeGradientForTileLabel(tile.label);
                if (tg) el.style.background = tg;
                else el.style.background = "";
                var own = tile.owner;
                var ownerHtml = "";
                if (own !== null && own !== undefined && own !== "") {
                    var oi = parseInt(own, 10);
                    if (!isNaN(oi)) {
                        var pc = PLAYER_COLORS[oi % PLAYER_COLORS.length];
                        ownerHtml =
                            `<div class="tile-owner-badge" style="color:${pc};border-color:${pc}">${playerAnimal(oi)} 的領地</div>`;
                    }
                }
                el.innerHTML =
                    `<div class="tile-header">` +
                        `<span class="tile-icon">${meta.icon}</span>` +
                        `<span class="tile-label">${tile.label}</span>` +
                        `<span class="tile-num">${i + 1}</span>` +
                    `</div>` +
                    `<input type="text" value="${esc(tile.label)}" placeholder="格名" data-idx="${i}" data-field="label"${disAttr}>` +
                    `<input type="text" value="${esc(tile.effect)}" placeholder="效果說明" data-idx="${i}" data-field="effect"${disAttr}>` +
                    ownerHtml +
                    `<div class="tile-pawns" data-tile-idx="${i}"></div>`;
                boardGrid.appendChild(el);
            });
            renderPawnsOnBoard();
            updateEditorLocks();
        }

        function renderPawnsOnBoard() {
            if (!state.game || !Array.isArray(state.game.players)) return;
            const tileEls = boardGrid.querySelectorAll(".tile");
            tileEls.forEach(function (t) {
                const h = t.querySelector(".tile-pawns");
                if (h) h.innerHTML = "";
            });
            state.game.players.forEach(function (p, idx) {
                const ti = ((p.position % NUM_TILES) + NUM_TILES) % NUM_TILES;
                const tileEl = tileEls[ti];
                if (!tileEl) return;
                const holder = tileEl.querySelector(".tile-pawns");
                if (!holder) return;
                const dot = document.createElement("span");
                dot.className = "tile-pawn-dot";
                dot.style.background = PLAYER_COLORS[idx % PLAYER_COLORS.length];
                dot.textContent = playerAnimal(idx);
                dot.title = playerTitle(idx, onlineMode ? memberAtPlayerIndex(idx) : null);
                holder.appendChild(dot);
            });
        }

        function pushTurnLog(line) {
            state.game.turnLog.push(line);
            if (state.game.turnLog.length > 100) {
                state.game.turnLog = state.game.turnLog.slice(-100);

        }

                wrap.className = "center-piece-wrap" + (i === g.currentPlayerIndex ? " center-piece-wrap--active" : "");

                    `</div>` +

        function pickRandomCard(type) {
            var deck = state[type];
            if (!deck || !deck.length) return null;
            return deck[Math.floor(Math.random() * deck.length)];
        }

        function advanceTurnAfterLand(pid, btn) {
            var g = state.game;
            g.currentPlayerIndex = (pid + 1) % g.playerCount;
            pushTurnLog("下一位出發：" + playerTitle(g.currentPlayerIndex, onlineMode ? memberAtPlayerIndex(g.currentPlayerIndex) : null) + "。");
            if (onlineMode) {
                pushOnlineSnapshot(function () {
                    renderPawnsOnBoard();
                    renderCenterGameUI();
                    renderBoard();
                    btn.disabled = false;
                });
            } else {
                saveState();
                renderPawnsOnBoard();
                renderCenterGameUI();
                renderBoard();
                btn.disabled = false;
            }
        }

        function getTileTollFee(tile) {
            var effect = String((tile && tile.effect) || "");
            var m = effect.match(/(\d+)\s*金幣/);
            if (m && m[1]) {
                var n = parseInt(m[1], 10);
                if (!isNaN(n) && n > 0) return n;
            }
            return DEFAULT_TOLL_FEE;
        }

        function settleOwnedLandToll(pid, tileIndex) {
            var tile = state.tiles[tileIndex];
            if (!tile) return false;
            var owner = parseInt(tile.owner, 10);
            if (isNaN(owner) || owner < 0 || owner >= state.game.players.length) return false;
            if (owner === pid) return false;

            var traveler = state.game.players[pid];
            var landlord = state.game.players[owner];
            var fee = getTileTollFee(tile);
            var paid = Math.max(0, Math.min(traveler.money, fee));
            if (paid > 0) {
                traveler.money -= paid;
                landlord.money += paid;
            }

            var ownerMem = onlineMode ? memberAtPlayerIndex(owner) : null;
            var travelerMem = onlineMode ? memberAtPlayerIndex(pid) : null;
            if (paid < fee) {
                pushTurnLog(
                    playerTitle(pid, travelerMem) +
                        " 走到「" +
                        tile.label +
                        "」，應付過路費 " +
                        fee +
                        "，但只剩 " +
                        paid +
                        "；已全數付給 " +
                        playerTitle(owner, ownerMem) +
                        "。"
                );
            } else {
                pushTurnLog(
                    playerTitle(pid, travelerMem) +
                        " 走到「" +
                        tile.label +
                        "」，支付過路費 " +
                        paid +
                        " 給 " +
                        playerTitle(owner, ownerMem) +
                        "。"
                );
            }
            return true;
        }

        function tryPurchaseOrFinish(pid, tileIndex, btn) {
            var tile = state.tiles[tileIndex];
            var p = state.game.players[pid];
            var unowned = tile.owner === null || tile.owner === undefined || tile.owner === "";
            if (settleOwnedLandToll(pid, tileIndex)) {
                advanceTurnAfterLand(pid, btn);
                return;
            }
            if (!isPurchasableLandTile(tile) || !unowned) {
                advanceTurnAfterLand(pid, btn);
                return;
            }
            var html =
                "<strong>" + playerAnimal(pid) + "</strong> 要不要花 <strong>" +
                LAND_PRICE +
                " 金幣</strong> 收下「<strong>" +
                esc(tile.label) +
                "</strong>」？<br>現在有 " +
                p.money +
                " 金幣。";
            showBuyLandDialog(html, function (yes) {
                if (yes) {
                    if (p.money < LAND_PRICE) {
                        pushTurnLog(playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 金幣不夠，沒辦法買下「" + tile.label + "」。");
                        showToast("金幣不足");
                    } else {
                        p.money -= LAND_PRICE;
                        state.tiles[tileIndex].owner = pid;
                        pushTurnLog(
                            playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 用 " + LAND_PRICE + " 金幣買下「" + tile.label + "」。"
                        );
                        if (onlineMode) scheduleOnlinePushAfterEdit();
                        else saveState();
                    }
                } else {
                    pushTurnLog(playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 先不買「" + tile.label + "」。");
                }
                advanceTurnAfterLand(pid, btn);
            });
        }

        /**
         * 關閉獎章後套用卡面可自動結算的效果（例如「立刻前往起點」）。
         * @returns {number} 結算後應處理的地格索引
         */
        function applyResolvedCardEffect(pid, cardType, pick, landedPos) {
            if (!pick) return landedPos;
            var p = state.game.players[pid];
            var content = String(pick.content || "");
            var title = String(pick.title || "").trim();
            var teleport =
                /(立刻\s*)?前往起點|回到起點|移動至起點|到達起點|移至起點|到達\s*「?\s*起點/.test(content) ||
                /(立刻\s*)?前往起點|回到起點/.test(String(pick.title || ""));
            if (!teleport) return landedPos;

            var denyBonus = /不領|無獎勵|無法領|不發放|不拿.*獎勵|不領獎|不經過/.test(content);
            var grantPass =
                !denyBonus &&
                /領取|可領|經過起點\s*\+|獲得.*經過|\+.*200|起點獎勵/.test(content);

            p.position = 0;
            if (grantPass) {
                p.money += PASS_GO_BONUS;
                pushTurnLog(
                    playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) +
                        " 依「" +
                        (title || "卡片") +
                        "」效果移至起點，並領取經過起點 " +
                        PASS_GO_BONUS +
                        " 金幣。"
                );
            } else {
                pushTurnLog(
                    playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) +
                        " 依「" +
                        (title || "卡片") +
                        "」效果立刻移至起點（不領經過起點獎勵）。"
                );
            }
            if (onlineMode) scheduleOnlinePushAfterEdit();
            else saveState();
            renderPawnsOnBoard();
            renderBoard();
            renderCenterGameUI();
            return 0;
        }

        function runLandEffects(pid, btn) {
            var p = state.game.players[pid];
            var pos = p.position;
            var tile = state.tiles[pos];

            if (isChanceTile(tile)) {
                var pick = pickRandomCard("chance");
                var line = pick
                    ? playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) +
                      " 抽到機會卡：「" +
                      String(pick.title || "").trim() +
                      "」— " +
                      String(pick.content || "").trim()
                    : playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 停在機會格，但牌堆還沒有卡片。";
                pushTurnLog(line);
                showMedalCard("chance", pick, function () {
                    var newPos = applyResolvedCardEffect(pid, "chance", pick, pos);
                    tryPurchaseOrFinish(pid, newPos, btn);
                });
                return;
            }
            if (isFateTile(tile)) {
                var pickf = pickRandomCard("fate");
                var linef = pickf
                    ? playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) +
                      " 抽到命運卡：「" +
                      String(pickf.title || "").trim() +
                      "」— " +
                      String(pickf.content || "").trim()
                    : playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 停在命運格，但牌堆還沒有卡片。";
                pushTurnLog(linef);
                showMedalCard("fate", pickf, function () {
                    var newPos = applyResolvedCardEffect(pid, "fate", pickf, pos);
                    tryPurchaseOrFinish(pid, newPos, btn);
                });
                return;
            }
            tryPurchaseOrFinish(pid, pos, btn);
        }

        document.getElementById("btn-roll").addEventListener("click", function () {
            const g = state.game;
            const diceEl = document.getElementById("dice-display");
            const btn = this;
            if (btn.disabled) return;
            if (onlineMode) {
                if (!lobbyFull()) {
                    showToast("請等待所有玩家加入房間");
                    return;
                }
                const cur = memberAtPlayerIndex(g.currentPlayerIndex);
                if (!cur || !myUserId || cur.userId !== myUserId) {
                    showToast("現在輪到 " + playerTitle(g.currentPlayerIndex, cur) + " 行動");
                    return;
                }
            }
            btn.disabled = true;
            diceEl.classList.add("dice--rolling");
            const tick = setInterval(function () {
                var n = String(1 + Math.floor(Math.random() * 6));
                if (diceFaceValueEl) diceFaceValueEl.textContent = n;
            }, 75);
            setTimeout(function () {
                clearInterval(tick);
                diceEl.classList.remove("dice--rolling");
                const roll = 1 + Math.floor(Math.random() * 6);
                if (diceFaceValueEl) diceFaceValueEl.textContent = String(roll);
                diceEl.setAttribute("aria-label", "骰子 " + roll + " 點");

                const pid = g.currentPlayerIndex;
                const p = g.players[pid];
                const oldPos = p.position;
                const sum = oldPos + roll;
                const crossedGo = sum >= NUM_TILES;
                p.position = sum % NUM_TILES;
                if (crossedGo) {
                    p.money += PASS_GO_BONUS;
                }

                const tileName = (state.tiles[p.position] && state.tiles[p.position].label) ? state.tiles[p.position].label : "？";
                let msg = playerTitle(pid, onlineMode ? memberAtPlayerIndex(pid) : null) + " 擲出 " + roll + " 點，走到「" + tileName + "」";
                if (crossedGo) {
                    msg += "；經過起點 +" + PASS_GO_BONUS;
                }
                pushTurnLog(msg);

                if (onlineMode) {
                    pushOnlineSnapshot(function () {
                        renderPawnsOnBoard();
                        renderCenterGameUI();
                        renderBoard();
                        runLandEffects(pid, btn);
                    });
                } else {
                    saveState();
                    renderPawnsOnBoard();
                    renderCenterGameUI();
                    renderBoard();
                    runLandEffects(pid, btn);
                }
            }, 720);
        });

        /* ---------- Cards ---------- */
        function renderCards() {
            cardsChance.innerHTML = "";
            cardsFate.innerHTML = "";
            state.chance.forEach((c, i) => cardsChance.appendChild(makeCardEl("chance", c, i)));
            state.fate.forEach((f, i) => cardsFate.appendChild(makeCardEl("fate", f, i)));
            updateCounts();
            updateEditorLocks();
        }

        function makeCardEl(type, card, index) {
            const el = document.createElement("article");
            el.className = `card-editor ${type}`;
            el.innerHTML =
                `<div class="card-editor-header">` +
                    `<h4>${type === "chance" ? "🟡 機會卡" : "🔵 命運卡"} ${["一","二","三","四","五","六","七","八","九","十"][index] || ("第" + (index + 1))}</h4>` +
                    `<button class="card-delete" data-type="${type}" data-idx="${index}" title="刪除此卡">✕</button>` +
                `</div>` +
                `<input type="text" value="${esc(card.title)}" placeholder="卡片標題" data-type="${type}" data-idx="${index}" data-field="title">` +
                `<textarea placeholder="卡片效果內容" data-type="${type}" data-idx="${index}" data-field="content">${esc(card.content)}</textarea>`;
            return el;
        }

        function updateCounts() {
            /* 左側欄已不顯示卡片張數 */
        }

        document.addEventListener("input", (e) => {
            const t = e.target;
            if (!t.closest(".card-editor")) return;
            const type = t.dataset.type;
            const idx = +t.dataset.idx;
            const field = t.dataset.field;
            if (type && field !== undefined) {
                state[type][idx][field] = t.value;
                debouncedSave();
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.classList.contains("card-delete")) return;
            const type = e.target.dataset.type;
            const idx = +e.target.dataset.idx;
            state[type].splice(idx, 1);
            renderCards();
            debouncedSave();
        });

        /* ---------- Add card ---------- */
        document.getElementById("add-card-chance").addEventListener("click", () => {
            state.chance.push({ title: "", content: "" });
            renderCards();
            const last = cardsChance.lastElementChild;
            if (last) {
                last.scrollIntoView({ behavior: "smooth", block: "center" });
                last.querySelector("input").focus();
            }
            debouncedSave();
        });

        document.getElementById("add-card-fate").addEventListener("click", () => {
            state.fate.push({ title: "", content: "" });
            renderCards();
            const last = cardsFate.lastElementChild;
            if (last) {
                last.scrollIntoView({ behavior: "smooth", block: "center" });
                last.querySelector("input").focus();
            }
            debouncedSave();
        });

        /* ---------- Draw Card ---------- */
        function drawCard(type) {
            var picked = pickRandomCard(type);
            if (!picked) {
                showToast("此牌堆目前沒有卡片。");
                return;
            }
            var pid = state.game.currentPlayerIndex;
            var landedPos = state.game.players[pid].position;
            showMedalCard(type, picked, function () {
                applyResolvedCardEffect(pid, type, picked, landedPos);
            });
        }

        document.getElementById("draw-chance").addEventListener("click", () => drawCard("chance"));
        document.getElementById("draw-fate").addEventListener("click", () => drawCard("fate"));

        document.getElementById("btn-reset").addEventListener("click", () => {
            if (onlineMode) {
                showToast("請先離開線上模式再重設");
                return;
            }
            if (!confirm("確定要重設為預設內容？所有修改將清除。")) return;
            state = defaultState();
            saveState();
            renderBoard();
            renderCards();
            syncRulesTextarea();
            renderCenterGameUI();
            showToast("已重設為預設內容 🔄");
        });

        /* ---------- Toast ---------- */
        let toastTimer = null;
        function showToast(msg) {
            clearTimeout(toastTimer);
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
        }

        /* ---------- Util ---------- */
        function esc(str) {
            return str.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById("btn-online-create").addEventListener("click", function () {
            refreshMyUser(function (data) {
                if (!data || !data.authenticated || !data.user) {
                    showToast("請先完成 Google 登入");
                    return;
                }
                var sel = document.getElementById("player-count");
                var n = Math.max(2, Math.min(6, parseInt(sel.value, 10)));
                fetch(roomsBaseUrl(), {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        playerCount: n,
                        state: state
                    })
                })
                    .then(function (res) {
                        return res.json();
                    })
                    .then(function (j) {
                        if (!j || !j.ok) {
                            showToast(j && j.error ? String(j.error) : "建立失敗");
                            return;
                        }
                        enterOnlineMode(j.roomCode, { version: j.version, snapshot: j.snapshot });
                    })
                    .catch(function () {
                        showToast("建立失敗");
                    });
            });
        });

        document.getElementById("btn-online-join").addEventListener("click", function () {
            var raw = document.getElementById("room-code-input").value;
            var code = String(raw || "")
                .trim()
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "");
            if (code.length < 4) {
                showToast("請輸入有效房間代碼");
                return;
            }
            refreshMyUser(function (data) {
                if (!data || !data.authenticated || !data.user) {
                    showToast("請先完成 Google 登入");
                    return;
                }
                fetch(roomsBaseUrl() + "/join", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: code })
                })
                    .then(function (res) {
                        return res.json();
                    })
                    .then(function (j) {
                        if (!j || !j.ok) {
                            var msg = "加入失敗";
                            if (j && j.error === "room_full") msg = "房間已滿";
                            else if (j && j.error === "room_not_found") msg = "找不到房間";
                            showToast(msg);
                            return;
                        }
                        enterOnlineMode(j.roomCode, { version: j.version, snapshot: j.snapshot });
                    })
                    .catch(function () {
                        showToast("加入失敗");
                    });
            });
        });

        document.getElementById("btn-online-leave").addEventListener("click", function () {
            if (!onlineMode) return;
            leaveOnlineMode();
        });

        (function fillRoomFromQuery() {
            var sp = new URLSearchParams(window.location.search);
            var r = sp.get("room");
            if (r) {
                var input = document.getElementById("room-code-input");
                if (input) {
                    input.value = String(r)
                        .trim()
                        .toUpperCase()
                        .replace(/[^A-Z0-9]/g, "");
                }
            }
        })();

        (function wireRestartAndPresets() {
            var btnRestart = document.getElementById("btn-restart-game");
            if (btnRestart) btnRestart.addEventListener("click", restartGameSession);

            var presetToggle = document.getElementById("btn-preset-toggle");
            var presetPop = document.getElementById("board-preset-popover");
            if (presetToggle && presetPop) {
                presetToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    setBoardPresetPopoverOpen(!!presetPop.hidden);
                });
            }
            document.addEventListener("mousedown", function (e) {
                if (!presetPop || presetPop.hidden) return;
                var t = e.target;
                if (presetPop.contains(t)) return;
                if (presetToggle && presetToggle.contains(t)) return;
                setBoardPresetPopoverOpen(false);
            });

            var sel = document.getElementById("preset-select");
            if (sel) sel.addEventListener("change", updateBoardPresetControls);

            var btnSave = document.getElementById("btn-preset-save");
            if (btnSave) {
                btnSave.addEventListener("click", function () {
                    if (!myUserId) {
                        showToast("請先完成 Google 登入");
                        return;
                    }
                    if (!canEditBoardAndCards()) {
                        showToast("線上房間僅房主可儲存棋盤設定");
                        return;
                    }
                    var input = document.getElementById("preset-name-input");
                    var name = input && input.value ? String(input.value).trim() : "";
                    if (!name) {
                        showToast("請輸入收藏名稱");
                        return;
                    }
                    var root = readBoardPresetsRoot();
                    if (!root.byUser[myUserId]) root.byUser[myUserId] = [];
                    var list = root.byUser[myUserId];
                    var snap = Object.assign(
                        { id: genPresetId(), name: name, savedAt: Date.now() },
                        snapshotBoardSettingsOnly()
                    );
                    list.unshift(snap);
                    if (list.length > MAX_BOARD_PRESETS_PER_USER) {
                        list.length = MAX_BOARD_PRESETS_PER_USER;
                    }
                    writeBoardPresetsRoot(root);
                    fillPresetSelect();
                    if (input) input.value = "";
                    showToast("已儲存收藏");
                    updateBoardPresetControls();
                });
            }

            var btnLoad = document.getElementById("btn-preset-load");
            if (btnLoad) {
                btnLoad.addEventListener("click", function () {
                    if (!myUserId) return;
                    if (!canEditBoardAndCards()) {
                        showToast("線上房間僅房主可載入棋盤");
                        return;
                    }
                    var s = document.getElementById("preset-select");
                    var id = s && s.value;
                    if (!id) return;
                    var root = readBoardPresetsRoot();
                    var list = root.byUser[myUserId] || [];
                    var preset = null;
                    for (var i = 0; i < list.length; i++) {
                        if (list[i].id === id) {
                            preset = list[i];
                            break;
                        }
                    }
                    if (!preset) {
                        showToast("找不到此收藏");
                        return;
                    }
                    if (
                        !confirm(
                            "套用後將取代目前棋盤、機會／命運卡與規則文字，並依目前人數重新開局。確定？"
                        )
                    ) {
                        return;
                    }
                    applyBoardPresetPayload(preset);
                    setBoardPresetPopoverOpen(false);
                    showToast("已載入「" + (preset.name || "未命名") + "」");
                });
            }

            var btnDel = document.getElementById("btn-preset-delete");
            if (btnDel) {
                btnDel.addEventListener("click", function () {
                    if (!myUserId) return;
                    if (!canEditBoardAndCards()) {
                        showToast("線上房間僅房主可刪除收藏");
                        return;
                    }
                    var s = document.getElementById("preset-select");
                    var id = s && s.value;
                    if (!id) return;
                    if (!confirm("確定刪除此筆收藏？（不影響目前棋盤）")) return;
                    var root = readBoardPresetsRoot();
                    var list = root.byUser[myUserId] || [];
                    root.byUser[myUserId] = list.filter(function (p) {
                        return p.id !== id;
                    });
                    writeBoardPresetsRoot(root);
                    fillPresetSelect();
                    updateBoardPresetControls();
                    showToast("已刪除收藏");
                });
            }
        })();

        /* ---------- Init ---------- */
        syncRulesTextarea();
        renderBoard();
        renderCards();
        renderCenterGameUI();
        updateEditorLocks();
        refreshMyUser(function () {
            fillPresetSelect();
            updateBoardPresetControls();
        });
    })();
    </script>
</body>
</html>
