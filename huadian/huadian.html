<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐風花鈿 AR 試妝 (虛擬背景版)</title>
    <!-- 1. 引入 Face Mesh (人臉) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <!-- 2. 引入 Hands (手勢) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 3. 引入 Selfie Segmentation (人像分割/背景替換) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    
    <style>
        /* --- 全局樣式 --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: #1a1a1a;
            font-family: "Kaiti", "STKaiti", "Songti TC", "Noto Serif TC", serif;
            overflow: hidden;
            color: #f0e6d2;
            cursor: none; /* 桌面手勢模式隱藏鼠標；觸控裝置見下方 media */
        }

        @media (pointer: coarse) {
            body { cursor: auto; }
        }

        /* --- 手勢光標 --- */
        #hand-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            display: none;
            transition: transform 0.1s, background 0.1s;
        }

        #hand-cursor.clicking {
            background: rgba(255, 50, 50, 0.9);
            transform: translate(-50%, -50%) scale(0.6);
            border-color: #ff5252;
        }

        /* --- 左側：鏡子區域 --- */
        #stage-container {
            flex: 3;
            position: relative;
            margin: 10px;
            border: 4px solid #5d4037; 
            border-radius: 12px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #input-video { display: none; }

        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transform: scaleX(-1); /* 鏡像翻轉 */
        }

        /* --- 右側：妝奩區域 --- */
        #menu-container {
            flex: 1;
            min-width: 250px;
            max-width: 320px;
            background: #3e2723;
            border-left: 2px solid #8d6e63;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            z-index: 20;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(255, 204, 128, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            margin: 10px 0;
            color: #ffcc80;
            letter-spacing: 3px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #d7ccc8;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding-bottom: 20px;
        }

        .huadian-btn {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #8d6e63;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(255, 204, 128, 0.25);
        }
        
        .huadian-btn.hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            border-color: #fff;
        }

        .huadian-btn.active {
            border-color: #ffd54f;
            background: rgba(255, 213, 79, 0.2);
            box-shadow: 0 0 10px rgba(255, 213, 79, 0.3);
        }

        .huadian-btn img {
            width: 60%;
            height: 60%;
            max-width: 72px;
            max-height: 72px;
            object-fit: contain;
            flex: 0 0 auto;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            margin-bottom: 5px;
            pointer-events: none;
        }

        .huadian-name { font-size: 0.8rem; color: #e0e0e0; pointer-events: none; }

        .reset-btn {
            margin-top: auto;
            margin-bottom: 10px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #ffcc80;
            color: #ffcc80;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
        }
        
        .reset-btn.hover { background: #ffcc80; color: #3e2723; }

        #btn-capture {
            margin-top: 8px;
            margin-bottom: 10px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #81c784;
            color: #a5d6a7;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
        }
        #btn-capture.hover { background: #81c784; color: #1b5e20; }

        #btn-capture-huadian {
            margin-top: 0;
            margin-bottom: 10px;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #ffb74d;
            color: #ffe0b2;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
        }
        #btn-capture-huadian.hover { background: #ffb74d; color: #4e342e; }

        /* 覆蓋層 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }

        #status-text {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 80%;
        }

        #start-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #d84315, #bf360c);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(191, 54, 12, 0.5);
            font-family: inherit;
            display: none;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #stage-container { flex: 2; width: 100%; margin: 0; border: none; border-radius: 0; }
            #menu-container { 
                flex: 1; 
                width: 100%; 
                max-width: none;
                border-left: none; 
                border-top: 2px solid #8d6e63;
                flex-direction: row; 
                flex-wrap: wrap;
                align-content: flex-start;
                overflow-x: auto;
                padding: 10px;
                gap: 15px;
            }
            .grid-container { display: flex; width: auto; gap: 10px; padding-bottom: 0; }
            .huadian-btn { width: 80px; height: 80px; flex-shrink: 0; }
            /* 橫向 flex 內百分比高度易塌縮，改固定像素以利 SVG 縮圖顯示（iOS/WebKit） */
            .huadian-btn img {
                width: 48px;
                height: 48px;
                max-width: 48px;
                max-height: 48px;
            }
            /* 保留標題與操作說明（含吐舌卸妝），僅縮排以適應橫向捲動選款 */
            h1 { font-size: 1rem; margin: 4px 0; letter-spacing: 2px; }
            p.subtitle { font-size: 0.65rem; margin-bottom: 8px; padding-bottom: 8px; line-height: 1.35; }
        }
    </style>
</head>
<body>

    <div id="hand-cursor"></div>
    
    <div id="overlay">
        <div id="status-text">正在佈置龍門妝奩...<br>(同時加載: 人臉識別、手勢識別、背景替換模型)<br>⚠️ 此模式對設備性能要求較高</div>
        <button id="start-btn">開啟鏡頭，對鏡貼花黃</button>
    </div>

    <div id="stage-container">
        <video id="input-video" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="output-canvas"></canvas>

    <div id="menu-container">
        <h1>唐風妝奩</h1>
        <p class="subtitle">👉 食指懸停選取 &nbsp; 🤏 捏合確認佩戴／拍照 &nbsp; 📐 鏡像區內食指上下移換款 &nbsp; 😛 吐舌卸妝／回歸現世（維持約半秒，略張嘴即可） &nbsp; 📱 手機可點按本欄花鈿與按鈕</p>
        <div class="grid-container" id="options-grid"></div>
        <button type="button" class="reset-btn" id="btn-reset" title="捏合此鈕可卸妝；或對鏡吐舌並微張嘴維持約半秒">卸妝 / 回歸現世</button>

        <button type="button" class="reset-btn" id="btn-capture">拍照（試妝＋虛擬背景）</button>

            { name: "珍珠點", bgType: "changan", bgMusic: "audio/04-changan.mp3",
                src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIzNSIgZmlsbD0iI2Y4YmJkMCIgc3Ryb2tlPSIjZTkxZTYzIiBzdHJva2Utd2lkdGg9IjMiLz48Y2lyY2xlIGN4PSIzOCIgY3k9IjM4IiByPSIxMiIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iMC42Ii8+PC9zdmc+",
                scale: 0.9, yOffset: -8 },
            { name: "祥雲鈿", bgType: "cloudSea", bgMusic: "audio/01-longmen.mp3",
                src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cGF0aCBkPSJNMjUgNTUgUTE1IDQ1IDI1IDM1IFE0MCAyNSA1NSAzNSBRNzAgMjUgODAgNDAgUTkwIDU1IDc1IDY1IFE2MCA3NSA0NSA2NSBRMzAgNzUgMjUgNTUgWiIgZmlsbD0iIzljMjdiMCIgb3BhY2l0eT0iMC44NSIvPjxjaXJjbGUgY3g9IjUyIiBjeT0iNTAiIHI9IjEwIiBmaWxsPSIjZTFiZWU3Ii8+PC9zdmc+",
                scale: 1.3, yOffset: -18 },
            { name: "鳳羽翎", bgType: "phoenix", bgMusic: "audio/03-tavern.mp3",
                src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cGF0aCBkPSJNNTAgNSBRNzAgMjUgNzUgNTAgUTgwIDc1IDUwIDk1IFEyMCA3NSAyNSA1MCBRMzAgMjUgNTAgNSBaIiBmaWxsPSIjZmY2ZjAwIi8+PHBhdGggZD0iTTUwIDIwIFE2MCAzNSA2MiA1MCBRNjUgNjUgNTAgODAgUTM1IDY1IDM4IDUwIFE0MCAzNSA1MCAyMCBaIiBmaWxsPSIjZmZjYzgwIi8+PC9zdmc+",
                scale: 1.2, yOffset: -15 }
        ];

        // --- 2. 變量 ---
        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('hand-cursor');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const resetBtn = document.getElementById('btn-reset');
        const captureHuadianBtn = document.getElementById('btn-capture-huadian');
        const captureBtn = document.getElementById('btn-capture');
        const bgMusic = document.getElementById('bg-music');
        /** 若 audio/list.json 有填 tracks，隨機僅從此列表抽選；否則用各花鈿預設 bgMusic 路徑合併去重後隨機 */
        let audioTrackList = [];
        
        let selectedIndex = -1;
        let loadedImages = [];
        
        // 核心模型
        let faceMesh, hands, selfieSegmentation;
        let isCameraRunning = false;
        
        // 數據緩存 (用於渲染循環合成)
        let latestFaceLandmarks = [];
        let latestHandLandmarks = null;
        let latestSegmentationMask = null;

        // 手勢交互變量
        let isPinching = false;
        let lastClickTime = 0;
        let lastHoveredElement = null;
        let cheekFistStartTime = 0;  // 吐舌卸妝姿勢維持時間
        const cheekFistHoldDuration = 450;
        let cheekUnmakeupArmed = true;  // 舌頭收回後才允許再次觸發卸妝
        /** 由人臉網格更新：吐舌／大嘴張開，供垂直選款暫停用 */
        let tongueUnmakeupPose = false;
        /** 鏡像區內食指垂直位置對應花鈿序位（防抖） */
        let posPickCandidate = -1;
        let posPickCandidateSince = 0;
        const posPickStableMs = 160;

        let tangBgImages = [];  // 已載入的 Image 物件，與 tangBgList 對應

        /** 滑鼠懸停在「花鈿・無背景」拍照鈕上時，與手勢懸停同效：預覽隱藏虛擬背景 */
        let mouseOverNoBgCaptureBtn = false;

        // --- 3. 初始化資源 ---
        /** 預載花鈿 SVG（手機 Safari 常在未 complete 時 drawImage 失敗，臉上不顯示） */
        function preloadHuadianImages() {
            loadedImages.length = huadianAssets.length;
            return Promise.all(
                huadianAssets.map(
                    (asset, index) =>
                        new Promise((resolve) => {
                            const img = new Image();
                            const finish = () => {
                                if (typeof img.decode === 'function') {
                                    img.decode().then(resolve).catch(resolve);
                                } else {
                                    resolve();
                                }
                            };
                            img.onload = finish;
                            img.onerror = finish;
                            img.src = asset.src;
                            loadedImages[index] = img;
                        })
                )
            );
        }

        function buildHuadianButtons() {
            const grid = document.getElementById('options-grid');
            huadianAssets.forEach((asset, index) => {
                const btn = document.createElement('div');
                btn.className = 'huadian-btn';
                btn.id = `btn-${index}`;
                btn.dataset.index = index;
                btn.setAttribute('role', 'button');
                btn.tabIndex = 0;
                btn.innerHTML =
                    `<img src="${asset.src}" alt="" width="56" height="56" decoding="async"><div class="huadian-name">${asset.name}</div>`;
                grid.appendChild(btn);
            });
            resetBtn.dataset.action = 'reset';
        }

        async function initHuadianUi() {
            await preloadHuadianImages();
            buildHuadianButtons();
        }

        function triggerClick(element, opts) {
            const now = Date.now();
            const debounceMs = opts && opts.quickTap ? 350 : 1000;
            if (now - lastClickTime < debounceMs) return;
            lastClickTime = now;

            element.classList.add('active');
            setTimeout(() => element.classList.remove('active'), 200);

            if (element.classList.contains('huadian-btn')) {
                const index = parseInt(element.dataset.index);
                selectHuadian(index);
            } else if (element.id === 'btn-reset') {
                selectHuadian(-1);
            } else if (element.id === 'btn-capture') {
                capturePhoto();
            } else if (element.id === 'btn-capture-huadian') {
                capturePhotoHuadianOnly();
            }
        }

        /** 手機／觸控：點按側欄花鈿格與按鈕（與手勢捏合並存） */
        function setupMenuTapDelegation() {
            const menu = document.getElementById('menu-container');
            if (!menu || menu.dataset.tapBound === '1') return;
            menu.dataset.tapBound = '1';
            menu.addEventListener('click', (ev) => {
                const huadianBtn = ev.target.closest('.huadian-btn');
                if (huadianBtn) {
                    triggerClick(huadianBtn, { quickTap: true });
                    return;
                }
                const resetLike = ev.target.closest('.reset-btn');
                if (resetLike) {
                    triggerClick(resetLike, { quickTap: true });
                }
            });
            menu.addEventListener('keydown', (ev) => {
                if (ev.key !== 'Enter' && ev.key !== ' ') return;
                const t = ev.target;
                if (!t || !t.classList.contains('huadian-btn')) return;
                ev.preventDefault();
                triggerClick(t, { quickTap: true });
            });
        }

        function downloadPngFromCanvas(exportCanvas, filenamePrefix) {
            try {
                exportCanvas.toBlob((blob) => {
                    if (!blob) {
                        alert('無法產生圖片。若畫布含跨來源圖片，瀏覽器可能禁止匯出。');
                        return;
                    }
                    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = filenamePrefix + '-' + ts + '.png';
                    a.click();
                    URL.revokeObjectURL(a.href);
                }, 'image/png');
            } catch (err) {
                alert('匯出失敗：' + (err.message || String(err)));
            }
        }

        /** 完整鏡頭畫面 + 花鈿，不含虛擬背景／人像去背；與螢幕鏡像一致 */
        function capturePhotoHuadianOnly() {
            if (!isCameraRunning || !canvasElement.width || !canvasElement.height) return;
            if (selectedIndex < 0) {
                alert('請先選擇一種花鈿樣式。');
                return;
            }
            const w = canvasElement.width;
            const h = canvasElement.height;
            const tmp = document.createElement('canvas');
            tmp.width = w;
            tmp.height = h;
            const tctx = tmp.getContext('2d');
            tctx.drawImage(videoElement, 0, 0, w, h);
            if (latestFaceLandmarks.length > 0) {
                for (let i = 0; i < latestFaceLandmarks.length; i++) {
                    drawHuadian(latestFaceLandmarks[i], selectedIndex, tctx, w, h);
                }
            } else {
                alert('目前未偵測到臉部，儲存的相片將只有鏡頭畫面、沒有花鈿。');
            }
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = w;
            exportCanvas.height = h;
            const ex = exportCanvas.getContext('2d');
            ex.translate(w, 0);
            ex.scale(-1, 1);
            ex.drawImage(tmp, 0, 0);
            downloadPngFromCanvas(exportCanvas, 'tang-huadian-nobg');
        }

        /** 將目前畫面上的合成畫面（人臉＋花鈿＋虛擬背景）匯出為 PNG；左右翻轉與螢幕鏡像一致 */
        function capturePhoto() {
            if (!isCameraRunning || !canvasElement.width || !canvasElement.height) return;
            const w = canvasElement.width;
            const h = canvasElement.height;
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = w;
            exportCanvas.height = h;
            const ex = exportCanvas.getContext('2d');
            ex.translate(w, 0);
            ex.scale(-1, 1);
            ex.drawImage(canvasElement, 0, 0);
            downloadPngFromCanvas(exportCanvas, 'tang-huadian-full');
        }

        captureHuadianBtn.addEventListener('mouseenter', () => { mouseOverNoBgCaptureBtn = true; });
        captureHuadianBtn.addEventListener('mouseleave', () => { mouseOverNoBgCaptureBtn = false; });
        // 拍照僅能透過手勢「捏合」觸發（與花鈿、卸妝相同），避免滑鼠／觸控一點就拍

        function selectHuadian(index) {
            selectedIndex = index;
            document.querySelectorAll('.huadian-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (index >= 0) {
                const activeBtn = document.getElementById(`btn-${index}`);
                if (activeBtn && activeBtn.scrollIntoView) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                }
            }
            // 每次選取花鈿時隨機背景圖；若圖檔尚未下載完成，等 onload 後由 tryPickTangBg 補抽（避免手機端永遠只有漸層）
            if (index >= 0) {
                tangBgPickPending = true;
                currentBgImageIndex = -1;
                tryPickTangBg();
            } else {
                tangBgPickPending = false;
                currentBgImageIndex = -1; // 卸妝時清除
            }
            
            // 切換背景音樂
            playBgMusic(index);
        }
        
        function getBgMusicPool() {
            const fromList = audioTrackList.filter(Boolean);
            if (fromList.length > 0) {
                return fromList.map((f) => (f.includes('/') ? f : 'audio/' + f));
            }
            return [...new Set(huadianAssets.map((a) => a.bgMusic).filter(Boolean))];
        }

        function playBgMusic(index) {
            if (!bgMusic) return;
            bgMusic.onerror = null;
            bgMusic.pause();
            bgMusic.currentTime = 0;
            bgMusic.src = '';

            if (index < 0) return;

            const pool = getBgMusicPool();
            if (pool.length === 0) return;

            const tryPlay = (attemptsLeft) => {
                if (attemptsLeft <= 0) return;
                bgMusic.onerror = null;
                bgMusic.src = pool[Math.floor(Math.random() * pool.length)];
                bgMusic.volume = 0.6;
                bgMusic.onerror = () => {
                    bgMusic.onerror = null;
                    tryPlay(attemptsLeft - 1);
                };
                bgMusic.play()
                    .then(() => { bgMusic.onerror = null; })
                    .catch(() => {
                        bgMusic.onerror = null;
                        tryPlay(attemptsLeft - 1);
                    });
            };
            tryPlay(Math.min(pool.length, 4));
        }

        /** 須在使用者點擊的同步階段呼叫，之後選花鈿時 audio.play() 較不易被瀏覽器擋下 */
        function unlockBgAudio() {
            if (!bgMusic || bgMusic.dataset.unlocked === '1') return;
            bgMusic.dataset.unlocked = '1';
            const silentWav =
                'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQQAAAAAAA==';
            bgMusic.volume = 0;
            bgMusic.src = silentWav;
            bgMusic.play().then(() => {
                bgMusic.pause();
                bgMusic.currentTime = 0;
                bgMusic.removeAttribute('src');
                bgMusic.load();
                bgMusic.volume = 0.6;
            }).catch(() => {
                bgMusic.volume = 0.6;
            });
        }

        function loadAudioTracks() {
            fetch('audio/list.json')
                .then((r) => r.json())
                .then((data) => {
                    if (data.tracks && Array.isArray(data.tracks)) {
                        audioTrackList = data.tracks.map((t) => String(t).trim()).filter(Boolean);
                    }
                })
                .catch(() => { audioTrackList = []; });
        }

        function getLoadedTangBgIndices() {
            return tangBgImages
                .map((img, i) => (img && img.complete && img.naturalWidth ? i : -1))
                .filter((i) => i >= 0);
        }

        /** 在已選花鈿且有待處理時，從已載入完成的背景圖中隨機一張 */
        function tryPickTangBg() {
            if (selectedIndex < 0 || !tangBgPickPending) return;
            const loadedIndices = getLoadedTangBgIndices();
            if (loadedIndices.length === 0) return;
            currentBgImageIndex = loadedIndices[Math.floor(Math.random() * loadedIndices.length)];
            tangBgPickPending = false;
        }

        // 載入唐風背景圖清單並預載圖片（從 images 資料夾）
        function loadTangBackgrounds() {
            fetch('images/list.json')
                .then((r) => r.json())
                .then((data) => {
                    if (data.images && Array.isArray(data.images)) {
                        tangBgList = data.images;
                        tangBgImages.length = tangBgList.length;
                        tangBgList.forEach((entry, i) => {
                            const img = new Image();
                            img.onload = () => {
                                tangBgImages[i] = img;
                                tryPickTangBg();
                            };
                            img.onerror = () => { /* 略過載入失敗的檔 */ };
                            img.src = 'images/' + entry.file;
                        });
                    }
                })
                .catch(() => { /* 無 list.json 時沿用漸層背景 */ });
        }

        // --- 4. 初始化所有模型 ---
        async function initModels() {
            try {
                // A. Face Mesh (人臉)
                faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
                faceMesh.setOptions({maxNumFaces: 3, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
                faceMesh.onResults(results => {
                    if(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                        latestFaceLandmarks = results.multiFaceLandmarks;
                        updateTongueUnmakeupGesture(latestFaceLandmarks[0]);
                    } else {
                        latestFaceLandmarks = [];
                        tongueUnmakeupPose = false;
                        cheekFistStartTime = 0;
                        cheekUnmakeupArmed = true;
                    }
                });
                await faceMesh.initialize();

                // B. Hands (手勢)
                hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
                hands.onResults(results => {
                    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        latestHandLandmarks = results.multiHandLandmarks[0];
                        processHandGestures(results.multiHandLandmarks);
                    } else {
                        latestHandLandmarks = null;
                        cursor.style.display = 'none';
                        posPickCandidate = -1;
                        if (lastHoveredElement) {
                            lastHoveredElement.classList.remove('hover');
                            lastHoveredElement = null;
                        }
                    }
                });
                await hands.initialize();

                // C. Selfie Segmentation (背景替換)
                selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
                selfieSegmentation.setOptions({modelSelection: 1}); // 1 = landscape (faster?)
                selfieSegmentation.onResults(results => {
                    latestSegmentationMask = results.segmentationMask;
                });
                await selfieSegmentation.initialize();

                statusText.innerText = "妝奩已備好，請開啟鏡頭";
                startBtn.style.display = 'inline-block';

            } catch (error) {
                console.error(error);
                statusText.innerText = "模型加載失敗，請檢查網絡連接 (需要加載約 10MB 模型文件)";
            }
        }

        // --- 5. 視頻處理循環 ---
        startBtn.onclick = async function() {
            unlockBgAudio();
            statusText.innerText = "正在啟動鏡頭...";
            startBtn.style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
                });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    overlay.style.display = 'none';
                    isCameraRunning = true;
                    processVideo(); // 數據發送循環
                    renderLoop();   // 畫面繪製循環
                };
            } catch (err) {
                console.error(err);
                statusText.innerText = "無法訪問攝像頭";
            }
        };

        // 循環發送數據給模型
        async function processVideo() {
            if (!isCameraRunning) return;
            
            // 為了不卡頓，我們可以選擇性跳幀或者並行
            // 並行發送
            try {
                const sends = [
                    faceMesh.send({image: videoElement}),
                    hands.send({image: videoElement})
                ];
                
                // 只有在選擇了花鈿時，才開啟背景分割 (節省性能)
                if (selectedIndex !== -1) {
                    sends.push(selfieSegmentation.send({image: videoElement}));
                } else {
                    latestSegmentationMask = null; // 卸妝時清除蒙版
                }

                await Promise.all(sends);

            } catch(e) { console.warn(e); }

            if (isCameraRunning) requestAnimationFrame(processVideo);
        }

        // --- 6. 核心渲染循環 (Compositing) ---
        function renderLoop() {
            if (!isCameraRunning) return;

            // 確保 Canvas 尺寸
            if (canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            const w = canvasElement.width;
            const h = canvasElement.height;

            if (tangBgPickPending && selectedIndex >= 0) tryPickTangBg();

            // 清空
            canvasCtx.clearRect(0, 0, w, h);

            const previewNoVirtualBg = selectedIndex >= 0 && (
                mouseOverNoBgCaptureBtn ||
                (lastHoveredElement && lastHoveredElement.id === 'btn-capture-huadian')
            );

            // A. 背景與人物繪製
            if (selectedIndex !== -1 && latestSegmentationMask && !previewNoVirtualBg) {
                // === 虛擬背景模式 ===
                
                // 1. 繪製蒙版
                canvasCtx.save();
                canvasCtx.drawImage(latestSegmentationMask, 0, 0, w, h);
                
                // 2. 應用蒙版：保留蒙版不透明區域(人物)
                canvasCtx.globalCompositeOperation = 'source-in';
                canvasCtx.drawImage(videoElement, 0, 0, w, h);

                // 3. 繪製背景：每次選取花鈿時已隨機選好一張，有圖則用圖，否則用漸層
                canvasCtx.globalCompositeOperation = 'destination-over';
                if (currentBgImageIndex >= 0 && tangBgImages[currentBgImageIndex] && tangBgImages[currentBgImageIndex].complete && tangBgImages[currentBgImageIndex].naturalWidth) {
                    drawBackgroundImage(canvasCtx, w, h, tangBgImages[currentBgImageIndex]);
                } else {
                    drawBackground(canvasCtx, w, h, huadianAssets[selectedIndex].bgType);
                }

                // 4. 恢復正常繪製模式 (為了之後畫花鈿)
                canvasCtx.globalCompositeOperation = 'source-over';
                canvasCtx.restore();

            } else {
                // === 完整鏡頭：卸妝，或已選花鈿但懸停「花鈿・無背景」預覽，或尚無分割蒙版 ===
                canvasCtx.drawImage(videoElement, 0, 0, w, h);
            }

            // B. 繪製花鈿（支援多張臉，各自依臉部大小縮放）
            if (latestFaceLandmarks.length > 0 && selectedIndex !== -1) {
                for (let i = 0; i < latestFaceLandmarks.length; i++) {
                    drawHuadian(latestFaceLandmarks[i], selectedIndex);
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // --- 7. 輔助繪圖函數 ---

        function drawBackgroundImage(ctx, w, h, img) {
            if (!img || !img.complete || !img.naturalWidth) return;
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const canvasRatio = w / h;
            let drawW, drawH, offsetX, offsetY;
            if (imgRatio > canvasRatio) {
                drawH = h;
                drawW = h * imgRatio;
                offsetX = (w - drawW) / 2;
                offsetY = 0;
            } else {
                drawW = w;
                drawH = w / imgRatio;
                offsetX = 0;
                offsetY = (h - drawH) / 2;
            }
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
        }

        function drawBackground(ctx, w, h, type) {
            // 背景圖由 tangBgImages 在繪製流程中處理；此處僅負責漸層備用（images 未載入時）
            let gradient;
            switch(type) {
                case 'peony': // 洛陽牡丹花海
                    // 1. 天空
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#87CEEB"); // 藍天
                    gradient.addColorStop(0.3, "#e0f7fa"); // 白雲
                    gradient.addColorStop(0.35, "#2e7d32"); // 遠處綠意
                    
                    // 2. 花海 (用帶狀漸變模擬層層花浪)
                    gradient.addColorStop(0.4, "#d81b60"); // 牡丹紅
                    gradient.addColorStop(0.55, "#f06292"); // 牡丹粉
                    gradient.addColorStop(0.7, "#880e4f"); // 深紅
                    gradient.addColorStop(0.85, "#4caf50"); // 綠葉
                    gradient.addColorStop(1, "#2e7d32"); // 近處草地
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    
                    // 3. 簡單的太陽
                    ctx.beginPath();
                    ctx.arc(w * 0.8, h * 0.15, 40, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 235, 59, 0.6)";
                    ctx.fill();
                    break;
                    
                case 'daming': // 大明宮：硃紅與金碧輝煌
                    gradient = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w);
                    gradient.addColorStop(0, "#8e0000");
                    gradient.addColorStop(1, "#3a0000");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 金色邊框感
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
                    ctx.lineWidth = 20;
                    ctx.strokeRect(10, 10, w-20, h-20);
                    break;
                case 'jiangnan': // 江南：青綠山水
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#a1c4fd"); // 天青
                    gradient.addColorStop(1, "#c2e9fb");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = "rgba(0, 100, 0, 0.1)"; // 遠山意象
                    ctx.beginPath();
                    ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.lineTo(w, h*0.6); ctx.lineTo(0, h*0.8);
                    ctx.fill();
                    break;
                case 'garden': // 御花園：粉色浪漫
                    gradient = ctx.createLinearGradient(0, 0, w, h);
                    gradient.addColorStop(0, "#fad0c4");
                    gradient.addColorStop(1, "#ffd1ff");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    break;
                case 'dunhuang': // 敦煌：沙漠與壁畫
                    gradient = ctx.createLinearGradient(0, 0, w, 0);
                    gradient.addColorStop(0, "#d35400");
                    gradient.addColorStop(1, "#e67e22");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    break;
                case 'changan': // 月下長安：夜景
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#0d1b2a"); // 深藍夜空
                    gradient.addColorStop(0.4, "#1b263b");
                    gradient.addColorStop(1, "#415a77");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 月亮
                    ctx.beginPath();
                    ctx.arc(w * 0.75, h * 0.2, 50, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 250, 205, 0.9)";
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(w * 0.78, h * 0.18, 45, 0, 2 * Math.PI);
                    ctx.fillStyle = "#0d1b2a";
                    ctx.fill();
                    // 星星
                    for (let i = 0; i < 30; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.random() * w, Math.random() * h * 0.5, Math.random() * 2, 0, 2 * Math.PI);
                        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                        ctx.fill();
                    }
                    break;
                case 'cloudSea': // 仙境雲海
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#e8daef"); // 淺紫
                    gradient.addColorStop(0.3, "#d2b4de");
                    gradient.addColorStop(0.6, "#f5eef8");
                    gradient.addColorStop(1, "#fdfefe");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 雲層
                    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        let cx = Math.random() * w;
                        let cy = h * 0.5 + Math.random() * h * 0.3;
                        ctx.ellipse(cx, cy, 120 + Math.random() * 80, 40 + Math.random() * 30, 0, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    break;
                case 'phoenix': // 鳳凰台：皇家紫金
                    gradient = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w * 0.8);
                    gradient.addColorStop(0, "#4a148c"); // 深紫
                    gradient.addColorStop(0.5, "#6a1b9a");
                    gradient.addColorStop(1, "#1a0033");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 金色光芒
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.15)";
                    ctx.lineWidth = 3;
                    for (let i = 0; i < 12; i++) {
                        ctx.beginPath();
                        ctx.moveTo(w/2, h/2);
                        let angle = (i / 12) * Math.PI * 2;
                        ctx.lineTo(w/2 + Math.cos(angle) * w, h/2 + Math.sin(angle) * h);
                        ctx.stroke();
                    }
                    // 金色邊框
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                    ctx.lineWidth = 15;
                    ctx.strokeRect(15, 15, w-30, h-30);
                    break;
                default: // 龍門石窟 (作為備用或之前的默認)
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#2c3e50");
                    gradient.addColorStop(1, "#bdc3c7");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
            }
        }

        /** ctx / cw / ch 省略時使用主畫布（供拍照到暫存 canvas 時傳入） */
        function drawHuadian(landmarks, index, ctx, cw, ch) {
            ctx = ctx || canvasCtx;
            cw = cw == null ? canvasElement.width : cw;
            ch = ch == null ? canvasElement.height : ch;
            const config = huadianAssets[index];
            const img = loadedImages[index];
            
            if (!img || !img.complete) return;
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;

            const pt151 = landmarks[151];
            const cx = pt151.x * cw;
            const cy = pt151.y * ch + config.yOffset;

            const ptLeft = landmarks[33];
            const ptRight = landmarks[263];
            const dx = (ptRight.x - ptLeft.x) * cw; 
            const dy = (ptRight.y - ptLeft.y) * ch;
            const angle = Math.atan2(dy, dx);

            const tL = landmarks[127];
            const tR = landmarks[356];
            const dist = Math.sqrt(Math.pow((tL.x - tR.x) * cw, 2) + Math.pow((tL.y - tR.y) * ch, 2));
            
            const size = dist * 0.28 * config.scale;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            if (iw > 0 && ih > 0) {
                ctx.drawImage(img, -size / 2, -size / 2, size, size);
            } else {
                /* WebKit 部分情況下 SVG 的 naturalWidth 仍為 0，改用 viewBox 對應的 100×100 來源矩形 */
                ctx.drawImage(img, 0, 0, 100, 100, -size / 2, -size / 2, size, size);
            }
            ctx.restore();
        }

        // --- 8. 手勢處理 (獨立邏輯) ---
        /** 垂直選款時：略呈握拳則不用食指 y（防誤觸） */
        function isHandFistRelaxed(landmarks) {
            const wrist = landmarks[0];
            const middleMcp = landmarks[9];
            const handLen = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y) + 0.001;
            const tips = [8, 12, 16, 20];
            let dSum = 0;
            for (const i of tips) {
                dSum += Math.hypot(landmarks[i].x - wrist.x, landmarks[i].y - wrist.y);
            }
            const avgTipToWrist = dSum / 4;
            if (avgTipToWrist / handLen > 0.98) return false;
            const thumbTip = landmarks[4];
            const thumbToWrist = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
            return thumbToWrist / handLen < 1.12;
        }

        function isHandPinchingLm(lm) {
            return Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) < 0.05;
        }

        function lmDist2(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        /**
         * 吐舌卸妝：用上／下唇內側點（13、14）垂直張開度相對臉寬判斷「明顯張嘴」。
         * 需略大於一般說話開口，以降低誤觸；閉嘴或微張為 false。
         */
        function isTongueOutForUnmakeup(faceLm) {
            const upper = faceLm[13];
            const lower = faceLm[14];
            if (!upper || !lower) return false;
            const faceW = lmDist2(faceLm[234], faceLm[454]) + 0.001;
            const vertOpen = lower.y - upper.y;
            const ratio = vertOpen / faceW;
            // 略放寬區間，避免實機上「怎麼做都卸不了妝」
            if (ratio < 0.085 || ratio > 0.5) return false;
            const mouthW = lmDist2(faceLm[61], faceLm[291]) + 0.001;
            const wRatio = mouthW / faceW;
            if (wRatio < 0.19 || wRatio > 0.65) return false;
            return true;
        }

        function updateTongueUnmakeupGesture(faceLm) {
            tongueUnmakeupPose = isTongueOutForUnmakeup(faceLm);
            if (!tongueUnmakeupPose) {
                cheekFistStartTime = 0;
                cheekUnmakeupArmed = true;
                return;
            }
            if (selectedIndex < 0) {
                cheekFistStartTime = 0;
                return;
            }
            if (!cheekUnmakeupArmed) return;
            if (cheekFistStartTime === 0) cheekFistStartTime = Date.now();
            if (Date.now() - cheekFistStartTime >= cheekFistHoldDuration) {
                selectHuadian(-1);
                posPickCandidate = -1;
                cheekFistStartTime = 0;
                cheekUnmakeupArmed = false;
                lastClickTime = Date.now();
            }
        }

        function isCursorOverStage(cursorX, cursorY) {
            const stageEl = document.getElementById('stage-container');
            if (!stageEl) return false;
            const r = stageEl.getBoundingClientRect();
            return cursorX >= r.left && cursorX <= r.right && cursorY >= r.top && cursorY <= r.bottom;
        }

        /**
         * 食指指尖 normalized y：畫面上方 → 第一款，愈靠下 → 序位愈後。
         * 需在鏡像區內、且非捏合／非握拳；同一序位穩定 posPickStableMs 後才 selectHuadian。
         */
        function tryVerticalPositionPickHuadian(landmarks) {
            const n = huadianAssets.length;
            if (n <= 0) return;
            const ny = landmarks[8].y;
            const topPad = 0.07;
            const botPad = 0.07;
            const usable = 1 - topPad - botPad;
            const t = usable > 0 ? Math.min(1, Math.max(0, (ny - topPad) / usable)) : 0;
            let idx = Math.min(n - 1, Math.floor(n * t));
            if (idx < 0) idx = 0;
            const now = Date.now();
            if (idx !== posPickCandidate) {
                posPickCandidate = idx;
                posPickCandidateSince = now;
                return;
            }
            if (now - posPickCandidateSince >= posPickStableMs && selectedIndex !== idx) {
                selectHuadian(idx);
            }
        }

        function processHandGestures(multiHands) {
            if (!multiHands || multiHands.length === 0) return;
            const landmarks = multiHands[0];
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            // 鏡像座標轉換（仍以第一隻偵測到的手為游標）
            const cursorX = (1 - indexTip.x) * window.innerWidth;
            const cursorY = indexTip.y * window.innerHeight;

            cursor.style.display = 'block';
            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
            const pinchThreshold = 0.05;
            const isPinchingNow = pinchDist < pinchThreshold;

            // 卸妝改由人臉網格偵測吐舌（updateTongueUnmakeupGesture）；此處僅讀 tongueUnmakeupPose 暫停垂直選款
            // 垂直選款：捏合、吐舌卸妝姿勢、或單手呈握拳時不用食指 y
            if (!isPinchingNow && !tongueUnmakeupPose && !isHandFistRelaxed(landmarks) && isCursorOverStage(cursorX, cursorY)) {
                tryVerticalPositionPickHuadian(landmarks);
            } else {
                posPickCandidate = -1;
            }

            // 捏合：點擊光標下的按鈕（花鈿或卸妝）
            const elements = document.elementsFromPoint(cursorX, cursorY);
            let targetBtn = null;
            for (let el of elements) {
                if (el.classList.contains('huadian-btn') || el.classList.contains('reset-btn')) {
                    targetBtn = el;
                    break;
                }
            }

            if (lastHoveredElement && lastHoveredElement !== targetBtn) {
                lastHoveredElement.classList.remove('hover');
            }
            if (targetBtn) {
                targetBtn.classList.add('hover');
                lastHoveredElement = targetBtn;
            } else {
                lastHoveredElement = null;
            }

            if (pinchDist < pinchThreshold) {
                if (!isPinching) {
                    cursor.classList.add('clicking');
                    if (targetBtn) triggerClick(targetBtn);
                }
                isPinching = true;
            } else {
                cursor.classList.remove('clicking');
                isPinching = false;
            }
        }

        async function startApp() {
            await initHuadianUi();
            setupMenuTapDelegation();
            loadTangBackgrounds();
            loadAudioTracks();
            initModels();
        }

        startApp();

    </script>
</body>
