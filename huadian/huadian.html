<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>唐風花鈿 AR 試妝 (虛擬背景版)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <!-- 1. 引入 Face Mesh (人臉) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <!-- 2. 引入 Hands (手勢) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 3. 引入 Selfie Segmentation (人像分割/背景替換) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* --- 桃花源主畫面色票（側欄／外框；鏡頭區維持深色以利對焦） --- */
        :root {
            --pb-bg: oklch(0.975 0.014 8);
            --pb-bg-soft: oklch(0.953 0.018 8);
            --surface: oklch(0.988 0.01 8 / 0.94);
            --text: oklch(0.305 0.06 8);
            --text-soft: oklch(0.49 0.04 10);
            --accent: oklch(0.61 0.17 10);
            --accent-deep: oklch(0.42 0.11 8);
            --accent-soft: oklch(0.84 0.06 12);
            --line: oklch(0.852 0.03 10 / 0.7);
            --line-strong: oklch(0.72 0.06 10 / 0.55);
        }

        /* --- 全局樣式 --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            max-width: 100vw;
            background:
                radial-gradient(circle at 12% 14%, oklch(0.99 0.012 10) 0%, transparent 28%),
                radial-gradient(circle at 86% 10%, oklch(0.92 0.045 8 / 0.55) 0%, transparent 24%),
                linear-gradient(180deg, var(--pb-bg) 0%, var(--pb-bg-soft) 54%, oklch(0.965 0.018 16) 100%);
            font-family: "Noto Sans TC", "Kaiti TC", "STKaiti", "Songti TC", "Noto Serif TC", sans-serif;
            overflow: hidden;
            overflow-x: hidden;
            color: var(--text);
            cursor: none; /* 桌面手勢模式隱藏鼠標；觸控裝置見下方 media */
        }

        @media (pointer: coarse) {
            body { cursor: auto; }
        }

        /* --- 手勢光標 --- */
        #hand-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            display: none;
            transition: transform 0.1s, background 0.1s;
        }

        #hand-cursor.clicking {
            background: rgba(255, 50, 50, 0.9);
            transform: translate(-50%, -50%) scale(0.6);
            border-color: #ff5252;
        }

        /* --- 左側：鏡子區域 --- */
        #stage-container {
            flex: 3 1 0;
            min-width: 0;
            min-height: 0;
            position: relative;
            margin: 10px;
            border: 3px solid color-mix(in oklch, var(--line-strong) 70%, var(--accent-deep) 30%);
            border-radius: 22px;
            background: #0a0a0a;
            box-shadow:
                0 24px 60px oklch(0.53 0.09 8 / 0.12),
                inset 0 0 0 1px color-mix(in oklch, oklch(0.99 0.01 8) 8%, transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #input-video { display: none; }

        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transform: scaleX(-1); /* 鏡像翻轉 */
        }

        /* --- 右側：妝奩區域 --- */
        #menu-container {
            flex: 1 1 0;
            min-width: 250px;
            max-width: 320px;
            min-height: 0;
            background: color-mix(in oklch, var(--surface) 88%, oklch(0.99 0.008 8) 12%);
            border-left: 1px solid color-mix(in oklch, var(--line-strong) 50%, transparent);
            box-shadow: -12px 0 40px oklch(0.48 0.08 8 / 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 20;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: color-mix(in oklch, var(--accent) 25%, transparent);
        }

        h1 {
            font-family: "ZCOOL XiaoWei", "Noto Serif TC", serif;
            font-size: 1.45rem;
            font-weight: 400;
            margin: 10px 0;
            color: var(--accent-deep);
            letter-spacing: 0.12em;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.78rem;
            line-height: 1.65;
            color: var(--text-soft);
            margin-bottom: 20px;
            border-bottom: 1px solid color-mix(in oklch, var(--line) 88%, transparent);
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding-bottom: 20px;
        }

        .huadian-btn {
            aspect-ratio: 1;
            background: color-mix(in oklch, var(--accent-soft) 28%, oklch(0.99 0.005 8) 72%);
            border: 1px solid color-mix(in oklch, var(--line-strong) 55%, transparent);
            border-radius: 14px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: color-mix(in oklch, var(--accent) 22%, transparent);
        }
        
        .huadian-btn.hover {
            background: color-mix(in oklch, var(--accent-soft) 55%, oklch(0.99 0.008 8) 45%);
            transform: scale(1.05);
            border-color: color-mix(in oklch, var(--accent) 45%, var(--line) 55%);
        }

        .huadian-btn.active {
            border-color: color-mix(in oklch, var(--accent) 70%, var(--accent-deep) 30%);
            background: color-mix(in oklch, var(--accent-soft) 65%, transparent);
            box-shadow: 0 8px 22px oklch(0.55 0.12 10 / 0.18);
        }

        .huadian-btn img {
            width: 60%;
            height: 60%;
            max-width: 72px;
            max-height: 72px;
            object-fit: contain;
            flex: 0 0 auto;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            margin-bottom: 5px;
            pointer-events: none;
        }

        .huadian-name { font-size: 0.8rem; color: var(--text-soft); pointer-events: none; }

        .reset-btn {
            margin-top: auto;
            margin-bottom: 10px;
            padding: 10px 30px;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, oklch(0.99 0.008 8) 88%, var(--accent-soft) 12%) 0%,
                color-mix(in oklch, oklch(0.96 0.014 10) 78%, var(--accent-soft) 22%) 100%
            );
            border: 1px solid color-mix(in oklch, var(--line-strong) 50%, transparent);
            color: var(--accent-deep);
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 999px;
            box-shadow: 0 8px 20px oklch(0.5 0.09 10 / 0.08);
        }
        
        .reset-btn.hover {
            background: color-mix(in oklch, var(--accent-soft) 40%, oklch(0.99 0.01 8) 60%);
            color: var(--accent-deep);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px oklch(0.48 0.09 8 / 0.12);
        }

        #btn-capture {
            margin-top: 8px;
            margin-bottom: 10px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid color-mix(in oklch, oklch(0.55 0.12 150) 55%, var(--line) 45%);
            color: oklch(0.38 0.1 150);
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            border-radius: 999px;
        }
        #btn-capture.hover { background: color-mix(in oklch, oklch(0.72 0.08 150) 35%, transparent); color: oklch(0.32 0.09 150); }

        #btn-capture-huadian {
            margin-top: 0;
            margin-bottom: 10px;
            padding: 10px 24px;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, var(--accent) 82%, var(--accent-deep) 18%) 0%,
                var(--accent-deep) 100%
            );
            border: none;
            color: oklch(0.99 0.01 8);
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            border-radius: 999px;
            box-shadow: 0 10px 24px oklch(0.45 0.1 8 / 0.2);
        }
        #btn-capture-huadian.hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 14px 32px oklch(0.42 0.1 8 / 0.25);
        }

        /* 覆蓋層（fixed 適配手機網址列／旋轉時視窗高度變化） */
        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: color-mix(in oklch, oklch(0.22 0.04 8) 88%, oklch(0.12 0.02 8) 12%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        }

        #status-text {
            color: oklch(0.96 0.02 8);
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 80%;
        }

        #start-btn {
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(
                135deg,
                color-mix(in oklch, oklch(0.99 0.008 8) 88%, var(--accent-soft) 12%) 0%,
                color-mix(in oklch, oklch(0.96 0.014 10) 72%, var(--accent-soft) 28%) 100%
            );
            color: var(--accent-deep);
            border: 1px solid color-mix(in oklch, var(--line-strong) 48%, transparent);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 14px 36px oklch(0.35 0.08 8 / 0.35);
            font-family: inherit;
            display: none;
        }

        /* ---------- 手機／窄螢幕：直向為主，鏡頭區吃滿剩餘高度；底部選款橫向左右捲 ---------- */
        @media (max-width: 768px) {
            html, body {
                height: 100%;
                max-height: 100dvh;
            }

            body {
                flex-direction: column;
                min-height: 100dvh;
                height: 100dvh;
                padding-left: env(safe-area-inset-left, 0px);
                padding-right: env(safe-area-inset-right, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            #stage-container {
                flex: 1 1 0;
                min-height: 0;
                width: 100%;
                margin: 0;
                padding-top: env(safe-area-inset-top, 0px);
                border: none;
                border-bottom: 1px solid color-mix(in oklch, var(--line-strong) 55%, transparent);
                border-radius: 0;
            }

            #menu-container {
                flex: 0 1 auto;
                width: 100%;
                max-width: none;
                min-width: 0;
                max-height: min(46dvh, 420px);
                border-left: none;
                border-top: 1px solid color-mix(in oklch, var(--line-strong) 50%, transparent);
                flex-direction: column;
                flex-wrap: nowrap;
                align-content: stretch;
                align-items: stretch;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 10px 12px max(10px, env(safe-area-inset-bottom, 0px));
                gap: 8px;
            }

            .grid-container {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                width: 100%;
                max-width: 100%;
                gap: 10px;
                padding: 4px 2px 8px;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: thin;
            }

            .huadian-btn {
                width: 76px;
                height: 76px;
                min-width: 76px;
                flex-shrink: 0;
            }

            .huadian-btn img {
                width: 48px;
                height: 48px;
                max-width: 48px;
                max-height: 48px;
            }

            h1 {
                font-size: clamp(0.95rem, 4vw, 1.15rem);
                margin: 2px 0 4px;
                letter-spacing: 2px;
            }

            p.subtitle {
                font-size: clamp(0.62rem, 2.8vw, 0.75rem);
                margin-bottom: 6px;
                padding-bottom: 8px;
                line-height: 1.4;
            }

            .huadian-name { font-size: 0.68rem; }

            .reset-btn,
            #btn-capture,
            #btn-capture-huadian {
                width: 100%;
                max-width: 100%;
                min-height: 44px;
                padding: 12px 14px;
                font-size: 0.9rem;
                margin-top: 0;
                margin-bottom: 6px;
                touch-action: manipulation;
            }

            #status-text {
                font-size: clamp(0.95rem, 3.5vw, 1.05rem);
                max-width: 96%;
            }

            #start-btn {
                min-height: 48px;
                padding: 14px 28px;
                font-size: 1rem;
            }
        }

        /* 極窄螢幕（小屏手機）：略縮選款鈕，仍為直向＋底部橫滑 */
        @media (max-width: 380px) {
            .huadian-btn {
                width: 70px;
                height: 70px;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>

    <div id="hand-cursor"></div>
    
    <div id="overlay">
        <div id="status-text">正在佈置龍門妝奩...<br>(同時加載: 人臉識別、手勢識別、背景替換模型)<br>⚠️ 此模式對設備性能要求較高</div>
        <button id="start-btn">開啟鏡頭，對鏡貼花黃</button>
    </div>

    <div id="stage-container">
        <video id="input-video" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <div id="menu-container">
        <h1>唐風花鈿</h1>
        <p class="subtitle">👉 食指懸停選取 &nbsp; 🤏 捏合確認佩戴／拍照 &nbsp; 📐 鏡像區內食指上下移換款 &nbsp; 🪷 雙手同時蘭花指切換隨機花鈿（拇指靠中指、食指伸出） &nbsp; 😛 吐舌卸妝／回歸現世（維持約半秒，略張嘴即可） &nbsp; 📱 手機可點按本欄花鈿與按鈕</p>
        <div class="grid-container" id="options-grid"></div>
        <button type="button" class="reset-btn" id="btn-reset" title="捏合此鈕可卸妝；或對鏡吐舌並微張嘴維持約半秒">卸妝 / 回歸現世</button>
        <button type="button" class="reset-btn" id="btn-capture-huadian">拍照（花鈿・無背景）</button>
        <button type="button" class="reset-btn" id="btn-capture">拍照（試妝＋虛擬背景）</button>
    </div>

        // --- 2. 變量 ---

        let audioTrackList = [];

        /** 已選花鈿但尚未成功抽到一張「已載入」的背景圖時為 true（手機慢網常見） */
        let tangBgPickPending = false;
        /** 滑鼠懸停在「花鈿・無背景」拍照鈕上時，與手勢懸停同效：預覽隱藏虛擬背景 */

        /**
         * 手機／觸控：選花鈿時背景圖與「人臉序位對應」用（tryPickTangBg）。
         * 畫面合成改為：優先 Selfie 蒙版 → 否則 Face Mesh 臉廓蒙版 → 最後才半透明備援。
         */
        function preferSimpleVirtualBackground() {
            if (typeof window === 'undefined') return false;
            if (window.innerWidth <= 768) return true;
            if (typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches) return true;
            return false;
        }

        /** MediaPipe Face Mesh 臉型外輪廓（有序），用於無人像分割蒙版時的臨時去背 */
        const FACE_MESH_OVAL_INDICES = [
            10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
            152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109
        ];

        let _ovalMaskCanvas = null;

        function getOvalMaskCanvas(w, h) {
            if (!_ovalMaskCanvas || _ovalMaskCanvas.width !== w || _ovalMaskCanvas.height !== h) {
                _ovalMaskCanvas = document.createElement('canvas');
                _ovalMaskCanvas.width = w;
                _ovalMaskCanvas.height = h;
            }
            return _ovalMaskCanvas;
        }

        /** 多張臉時合併臉廓蒙版（與 segmentation 相同後續 source-in 流程） */
        function renderFaceOvalMaskFromFaces(faces, w, h) {
            if (!faces || faces.length === 0) return null;
            const c = getOvalMaskCanvas(w, h);
            const mctx = c.getContext('2d');
            mctx.clearRect(0, 0, w, h);
            mctx.fillStyle = '#ffffff';
            let any = false;
            const expand = 1.16;
            for (let fi = 0; fi < faces.length; fi++) {
                const faceLm = faces[fi];
                if (!faceLm || !faceLm[168]) continue;
                let ok = true;
                for (let k = 0; k < FACE_MESH_OVAL_INDICES.length; k++) {
                    if (!faceLm[FACE_MESH_OVAL_INDICES[k]]) {
                        ok = false;
                        break;
                    }
                }
                if (!ok) continue;
                any = true;
                const cx = faceLm[168].x * w;
                const cy = faceLm[168].y * h;
                mctx.beginPath();
                for (let i = 0; i < FACE_MESH_OVAL_INDICES.length; i++) {
                    const p = faceLm[FACE_MESH_OVAL_INDICES[i]];
                    const x = p.x * w;
                    const y = p.y * h;
                    const px = cx + (x - cx) * expand;
                    const py = cy + (y - cy) * expand;
                    if (i === 0) mctx.moveTo(px, py);
                    else mctx.lineTo(px, py);
                }
                mctx.closePath();
                mctx.fill();
            }
            return any ? c : null;
        }

        /** 以蒙版（分割圖或臉廓 canvas）把人像扣出並疊在場景圖上 */
        function compositeMaskedPersonOverBackground(ctx, w, h, maskSource) {
            ctx.save();
            ctx.drawImage(maskSource, 0, 0, w, h);
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(videoElement, 0, 0, w, h);
            ctx.globalCompositeOperation = 'destination-over';
            if (
                currentBgImageIndex >= 0 &&
                tangBgImages[currentBgImageIndex] &&
                tangBgImages[currentBgImageIndex].complete &&
                tangBgImages[currentBgImageIndex].naturalWidth
            ) {
                drawBackgroundImage(ctx, w, h, tangBgImages[currentBgImageIndex]);
            } else {
                drawBackground(ctx, w, h, huadianAssets[selectedIndex].bgType);
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
        }

        /** 尚未有臉／蒙版時：場景 + 半透明鏡頭（僅備援） */
        function drawTranslucentVideoOverBackground(ctx, w, h) {
            if (
                currentBgImageIndex >= 0 &&
                tangBgImages[currentBgImageIndex] &&
                tangBgImages[currentBgImageIndex].complete &&
                tangBgImages[currentBgImageIndex].naturalWidth
            ) {
                drawBackgroundImage(ctx, w, h, tangBgImages[currentBgImageIndex]);
            } else {
                drawBackground(ctx, w, h, huadianAssets[selectedIndex].bgType);
            }
            ctx.save();
            ctx.globalAlpha = preferSimpleVirtualBackground() ? 0.78 : 0.86;
            ctx.drawImage(videoElement, 0, 0, w, h);
            ctx.restore();
        }

        function assetUrl(relativePath) {
            try {
                return new URL(relativePath, window.location.href).href;
            } catch (e) {
                return relativePath;
            }
        }

        // --- 3. 初始化資源 ---
        /** 預載花鈿 SVG（手機 Safari 常在未 complete 時 drawImage 失敗，臉上不顯示） */
        function preloadHuadianImages() {
            loadedImages.length = huadianAssets.length;
            return Promise.all(
                huadianAssets.map(
                    (asset, index) =>
                        new Promise((resolve) => {
                            const img = new Image();
                            const finish = () => {
                                if (typeof img.decode === 'function') {
                                    img.decode().then(resolve).catch(resolve);
                                } else {
                                    resolve();
                                }
                            };
                            img.onload = finish;
                            img.onerror = finish;
                            img.src = asset.src;
                            loadedImages[index] = img;
                        })
                )
            );
        }

        function buildHuadianButtons() {
            const grid = document.getElementById('options-grid');
            huadianAssets.forEach((asset, index) => {
                const btn = document.createElement('div');
                btn.className = 'huadian-btn';
                btn.id = `btn-${index}`;
                btn.dataset.index = index;
                btn.setAttribute('role', 'button');
                btn.tabIndex = 0;
                btn.innerHTML =
                    `<img src="${asset.src}" alt="" width="56" height="56" decoding="async"><div class="huadian-name">${asset.name}</div>`;
                grid.appendChild(btn);
            });
            resetBtn.dataset.action = 'reset';
        }

        async function initHuadianUi() {
            await preloadHuadianImages();

        function triggerClick(element, opts) {
            const now = Date.now();
            const debounceMs = opts && opts.quickTap ? 350 : 1000;
            if (now - lastClickTime < debounceMs) return;
            lastClickTime = now;

            element.classList.add('active');
            setTimeout(() => element.classList.remove('active'), 200);

            if (element.classList.contains('huadian-btn')) {
                const index = parseInt(element.dataset.index);
                selectHuadian(index);
            } else if (element.id === 'btn-reset') {
                selectHuadian(-1);
            } else if (element.id === 'btn-capture') {
                capturePhoto();
            } else if (element.id === 'btn-capture-huadian') {
                capturePhotoHuadianOnly();
            }
        }

        /** 手機／觸控：點按側欄花鈿格與按鈕（與手勢捏合並存） */
        function setupMenuTapDelegation() {
            const menu = document.getElementById('menu-container');
            if (!menu || menu.dataset.tapBound === '1') return;
            menu.dataset.tapBound = '1';
            menu.addEventListener('click', (ev) => {
                const huadianBtn = ev.target.closest('.huadian-btn');
                if (huadianBtn) {
                    triggerClick(huadianBtn, { quickTap: true });
                    return;
                }
                const resetLike = ev.target.closest('.reset-btn');
                if (resetLike) {
                    triggerClick(resetLike, { quickTap: true });
                }
            });
            menu.addEventListener('keydown', (ev) => {
                if (ev.key !== 'Enter' && ev.key !== ' ') return;
                const t = ev.target;
                if (!t || !t.classList.contains('huadian-btn')) return;
                ev.preventDefault();
                triggerClick(t, { quickTap: true });
            });
        }

        function downloadPngFromCanvas(exportCanvas, filenamePrefix) {
            try {
                exportCanvas.toBlob((blob) => {
                    if (!blob) {
                        alert('無法產生圖片。若畫布含跨來源圖片，瀏覽器可能禁止匯出。');
                        return;
                    }
                    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = filenamePrefix + '-' + ts + '.png';
                    a.click();
                    URL.revokeObjectURL(a.href);
                }, 'image/png');
            } catch (err) {
                alert('匯出失敗：' + (err.message || String(err)));
            }
        }

        /** 完整鏡頭畫面 + 花鈿，不含虛擬背景／人像去背；與螢幕鏡像一致 */
        function capturePhotoHuadianOnly() {
            if (!isCameraRunning || !canvasElement.width || !canvasElement.height) return;
            if (selectedIndex < 0) {
                alert('請先選擇一種花鈿樣式。');
                return;
            }
            const w = canvasElement.width;
            const h = canvasElement.height;
            const tmp = document.createElement('canvas');
            tmp.width = w;
            tmp.height = h;
            const tctx = tmp.getContext('2d');
            tctx.drawImage(videoElement, 0, 0, w, h);
            if (latestFaceLandmarks.length > 0) {
                for (let i = 0; i < latestFaceLandmarks.length; i++) {
                    drawHuadian(latestFaceLandmarks[i], selectedIndex, tctx, w, h);
                }
            } else {
                alert('目前未偵測到臉部，儲存的相片將只有鏡頭畫面、沒有花鈿。');
            }
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = w;
            exportCanvas.height = h;
            const ex = exportCanvas.getContext('2d');
            ex.translate(w, 0);
            ex.scale(-1, 1);
            ex.drawImage(tmp, 0, 0);
            downloadPngFromCanvas(exportCanvas, 'tang-huadian-nobg');
        }

        /** 將目前畫面上的合成畫面（人臉＋花鈿＋虛擬背景）匯出為 PNG；左右翻轉與螢幕鏡像一致 */
        function capturePhoto() {
            if (!isCameraRunning || !canvasElement.width || !canvasElement.height) return;
            const w = canvasElement.width;
            const h = canvasElement.height;
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = w;
            exportCanvas.height = h;
            const ex = exportCanvas.getContext('2d');
            ex.translate(w, 0);
            ex.scale(-1, 1);
            ex.drawImage(canvasElement, 0, 0);
            downloadPngFromCanvas(exportCanvas, 'tang-huadian-full');
        }

        captureHuadianBtn.addEventListener('mouseenter', () => { mouseOverNoBgCaptureBtn = true; });
        captureHuadianBtn.addEventListener('mouseleave', () => { mouseOverNoBgCaptureBtn = false; });
        // 拍照僅能透過手勢「捏合」觸發（與花鈿、卸妝相同），避免滑鼠／觸控一點就拍

        function selectHuadian(index) {
            selectedIndex = index;
            document.querySelectorAll('.huadian-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (index >= 0) {
                const activeBtn = document.getElementById(`btn-${index}`);
                if (activeBtn && activeBtn.scrollIntoView) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                }
            }
            // 每次選取花鈿時隨機背景圖；若圖檔尚未下載完成，等 onload 後由 tryPickTangBg 補抽（避免手機端永遠只有漸層）
            if (index >= 0) {
                tangBgPickPending = true;
                currentBgImageIndex = -1;
                tryPickTangBg();
            } else {
                tangBgPickPending = false;
                currentBgImageIndex = -1; // 卸妝時清除
            }
            
            // 切換背景音樂
            playBgMusic(index);
        }

        /** 隨機換一款花鈿（盡量與當前不同）；會連帶隨機背景與音樂 */
        function selectRandomNextHuadianStyle() {
            const n = huadianAssets.length;
            if (n <= 0) return;
            let next = 0;
            if (n === 1) {
                next = 0;
            } else {
                next = Math.floor(Math.random() * n);
                let guard = 0;
                while (selectedIndex >= 0 && next === selectedIndex && guard++ < 16) {
                    next = Math.floor(Math.random() * n);
                }
            }
            posPickCandidate = -1;
            lastClickTime = Date.now();
            selectHuadian(next);
        }
        
        function getBgMusicPool() {
            const fromList = audioTrackList.filter(Boolean);
            if (fromList.length > 0) {
                return fromList.map((f) => (f.includes('/') ? f : 'audio/' + f));
            }
            return [...new Set(huadianAssets.map((a) => a.bgMusic).filter(Boolean))];
        }

        function playBgMusic(index) {
            if (!bgMusic) return;
            bgMusic.onerror = null;
            bgMusic.pause();
            bgMusic.currentTime = 0;
            bgMusic.src = '';

            if (index < 0) return;

            const pool = getBgMusicPool();
            if (pool.length === 0) return;

            const tryPlay = (attemptsLeft) => {
                if (attemptsLeft <= 0) return;
                bgMusic.onerror = null;
                bgMusic.src = pool[Math.floor(Math.random() * pool.length)];
                bgMusic.volume = 0.6;
                bgMusic.onerror = () => {
                    bgMusic.onerror = null;
                    tryPlay(attemptsLeft - 1);
                };
                bgMusic.play()
                    .then(() => { bgMusic.onerror = null; })
                    .catch(() => {
                        bgMusic.onerror = null;
                        tryPlay(attemptsLeft - 1);
                    });
            };
            tryPlay(Math.min(pool.length, 4));
        }

        /** 須在使用者點擊的同步階段呼叫，之後選花鈿時 audio.play() 較不易被瀏覽器擋下 */
        function unlockBgAudio() {
            if (!bgMusic || bgMusic.dataset.unlocked === '1') return;
            bgMusic.dataset.unlocked = '1';
            const silentWav =
                'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQQAAAAAAA==';
            bgMusic.volume = 0;
            bgMusic.src = silentWav;
            bgMusic.play().then(() => {
                bgMusic.pause();
                bgMusic.currentTime = 0;
                bgMusic.removeAttribute('src');
                bgMusic.load();
                bgMusic.volume = 0.6;
            }).catch(() => {
                bgMusic.volume = 0.6;
            });
        }

        function loadAudioTracks() {
            fetch('audio/list.json')
                .then((r) => r.json())
                .then((data) => {
                    if (data.tracks && Array.isArray(data.tracks)) {
                        audioTrackList = data.tracks.map((t) => String(t).trim()).filter(Boolean);
                    }
                })
                .catch(() => { audioTrackList = []; });
        }

        function getLoadedTangBgIndices() {
            return tangBgImages
                .map((img, i) => (img && img.complete && img.naturalWidth ? i : -1))
                .filter((i) => i >= 0);
        }

        /** 在已選花鈿且有待處理時，從已載入完成的背景圖中選一張（手機依花鈿序位對應不同場景圖） */
        function tryPickTangBg() {
            if (selectedIndex < 0 || !tangBgPickPending) return;
            const loadedIndices = getLoadedTangBgIndices();
            if (loadedIndices.length === 0) return;
            if (preferSimpleVirtualBackground()) {
                const slot = selectedIndex % loadedIndices.length;
                currentBgImageIndex = loadedIndices[slot];
            } else {
                currentBgImageIndex = loadedIndices[Math.floor(Math.random() * loadedIndices.length)];
            }
            tangBgPickPending = false;
        }

        // 載入唐風背景圖清單並預載圖片（從 images 資料夾；絕對 URL 避免部分手機／子路徑下相對路徑錯誤）
        function loadTangBackgrounds() {
            fetch(assetUrl('images/list.json'))
                .then((r) => r.json())
                .then((data) => {
                    if (data.images && Array.isArray(data.images)) {
                        tangBgList = data.images;
                        tangBgImages.length = tangBgList.length;
                        tangBgList.forEach((entry, i) => {
                            const img = new Image();
                            const onReady = () => {
                                tangBgImages[i] = img;
                                tryPickTangBg();
                            };
                            img.onload = () => {
                                if (typeof img.decode === 'function') {
                                    img.decode().then(onReady).catch(onReady);
                                } else {
                                    onReady();
                                }
                            };
                            img.onerror = () => { /* 略過載入失敗的檔 */ };
                            img.src = assetUrl('images/' + entry.file);
                        });
                    }
                })
                .catch(() => { /* 無 list.json 時沿用漸層背景 */ });
        }

        // --- 4. 初始化所有模型 ---
        async function initModels() {
            try {
                // A. Face Mesh (人臉)
                faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
                faceMesh.setOptions({maxNumFaces: 3, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
                faceMesh.onResults(results => {
                    if(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                        latestFaceLandmarks = results.multiFaceLandmarks;
                        updateTongueUnmakeupGesture(latestFaceLandmarks[0]);
                    } else {
                        latestFaceLandmarks = [];
                        tongueUnmakeupPose = false;
                        cheekFistStartTime = 0;
                        cheekUnmakeupArmed = true;
                    }
                });
                await faceMesh.initialize();

                // B. Hands (手勢)
                hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
                hands.onResults(results => {
                    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        latestHandLandmarks = results.multiHandLandmarks[0];
                        processHandGestures(results.multiHandLandmarks);
                    } else {
                        latestHandLandmarks = null;
                        cursor.style.display = 'none';
                        posPickCandidate = -1;
                        if (lastHoveredElement) {
                            lastHoveredElement.classList.remove('hover');
                            lastHoveredElement = null;
                        }
                    }
                });
                await hands.initialize();

                // C. Selfie Segmentation（背景替換）
                // modelSelection: 1 偏橫向場景；手機直向鏡頭用 0 較易穩定產生蒙版，否則 latestSegmentationMask 常空、背景圖永遠畫不出來
                selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
                selfieSegmentation.setOptions({
                    modelSelection: (typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 768px)').matches) ? 0 : 1
                });
                selfieSegmentation.onResults(results => {
                    latestSegmentationMask = results.segmentationMask;
                });
                await selfieSegmentation.initialize();

                statusText.innerText = "妝奩已備好，請開啟鏡頭";
                startBtn.style.display = 'inline-block';

            } catch (error) {
                console.error(error);
                statusText.innerText = "模型加載失敗，請檢查網絡連接 (需要加載約 10MB 模型文件)";
            }
        }

        // --- 5. 視頻處理循環 ---
        startBtn.onclick = async function() {
            unlockBgAudio();
            statusText.innerText = "正在啟動鏡頭...";
            startBtn.style.display = 'none';
            try {
                const narrow = typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 768px)').matches;
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: narrow ? 720 : 1280 },
                        height: { ideal: narrow ? 1280 : 720 },
                        facingMode: 'user'
                    }
                });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    overlay.style.display = 'none';
                    isCameraRunning = true;
                    processVideo(); // 數據發送循環
                    renderLoop();   // 畫面繪製循環
                };
            } catch (err) {
                console.error(err);
                statusText.innerText = "無法訪問攝像頭";
            }
        };

        // 循環發送數據給模型
        async function processVideo() {
            if (!isCameraRunning) return;
            
            // 為了不卡頓，我們可以選擇性跳幀或者並行
            // 並行發送
            try {
                const sends = [
                    faceMesh.send({image: videoElement}),
                    hands.send({image: videoElement})
                ];
                
                // 選了花鈿才做人像分割（手機亦送，臉部去背優先使用；失敗時改用人臉網格臉廓蒙版）
                if (selectedIndex !== -1) {
                    sends.push(selfieSegmentation.send({image: videoElement}));
                } else {
                    latestSegmentationMask = null;
                }

                await Promise.all(sends);

            } catch(e) { console.warn(e); }

            if (isCameraRunning) requestAnimationFrame(processVideo);
        }

        // --- 6. 核心渲染循環 (Compositing) ---
        function renderLoop() {
            if (!isCameraRunning) return;

            // 確保 Canvas 尺寸
            if (canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            const w = canvasElement.width;
            const h = canvasElement.height;

            if (tangBgPickPending && selectedIndex >= 0) tryPickTangBg();

            // 清空
            canvasCtx.clearRect(0, 0, w, h);

            const previewNoVirtualBg = selectedIndex >= 0 && (
                mouseOverNoBgCaptureBtn ||
                (lastHoveredElement && lastHoveredElement.id === 'btn-capture-huadian')
            );

            // A. 背景與人物繪製：① Selfie 蒙版 ② 臉廓蒙版 ③ 半透明備援（僅尚未偵測到臉時）
            if (selectedIndex !== -1 && !previewNoVirtualBg && latestSegmentationMask) {
                compositeMaskedPersonOverBackground(canvasCtx, w, h, latestSegmentationMask);
            } else if (selectedIndex !== -1 && !previewNoVirtualBg && latestFaceLandmarks.length > 0) {
                const ovalMask = renderFaceOvalMaskFromFaces(latestFaceLandmarks, w, h);
                if (ovalMask) {
                    compositeMaskedPersonOverBackground(canvasCtx, w, h, ovalMask);
                } else {
                    drawTranslucentVideoOverBackground(canvasCtx, w, h);
                }
            } else if (selectedIndex !== -1 && !previewNoVirtualBg) {
                drawTranslucentVideoOverBackground(canvasCtx, w, h);
            } else {
                // === 完整鏡頭：卸妝，或懸停「花鈿・無背景」預覽 ===
                canvasCtx.drawImage(videoElement, 0, 0, w, h);
            }

            // B. 繪製花鈿（支援多張臉，各自依臉部大小縮放）
            if (latestFaceLandmarks.length > 0 && selectedIndex !== -1) {
                for (let i = 0; i < latestFaceLandmarks.length; i++) {
                    drawHuadian(latestFaceLandmarks[i], selectedIndex);
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // --- 7. 輔助繪圖函數 ---

        function drawBackgroundImage(ctx, w, h, img) {
            if (!img || !img.complete || !img.naturalWidth) return;
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const canvasRatio = w / h;
            let drawW, drawH, offsetX, offsetY;
            if (imgRatio > canvasRatio) {
                drawH = h;
                drawW = h * imgRatio;
                offsetX = (w - drawW) / 2;
                offsetY = 0;
            } else {
                drawW = w;
                drawH = w / imgRatio;
                offsetX = 0;
                offsetY = (h - drawH) / 2;
            }
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
        }

        function drawBackground(ctx, w, h, type) {
            // 背景圖由 tangBgImages 在繪製流程中處理；此處僅負責漸層備用（images 未載入時）
            let gradient;
            switch(type) {
                case 'peony': // 洛陽牡丹花海
                    // 1. 天空
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#87CEEB"); // 藍天
                    gradient.addColorStop(0.3, "#e0f7fa"); // 白雲
                    gradient.addColorStop(0.35, "#2e7d32"); // 遠處綠意
                    
                    // 2. 花海 (用帶狀漸變模擬層層花浪)
                    gradient.addColorStop(0.4, "#d81b60"); // 牡丹紅
                    gradient.addColorStop(0.55, "#f06292"); // 牡丹粉
                    gradient.addColorStop(0.7, "#880e4f"); // 深紅
                    gradient.addColorStop(0.85, "#4caf50"); // 綠葉
                    gradient.addColorStop(1, "#2e7d32"); // 近處草地
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    
                    // 3. 簡單的太陽
                    ctx.beginPath();
                    ctx.arc(w * 0.8, h * 0.15, 40, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 235, 59, 0.6)";
                    ctx.fill();
                    break;
                    
                case 'daming': // 大明宮：硃紅與金碧輝煌
                    gradient = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w);
                    gradient.addColorStop(0, "#8e0000");
                    gradient.addColorStop(1, "#3a0000");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 金色邊框感
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
                    ctx.lineWidth = 20;
                    ctx.strokeRect(10, 10, w-20, h-20);
                    break;
                case 'jiangnan': // 江南：青綠山水
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#a1c4fd"); // 天青
                    gradient.addColorStop(1, "#c2e9fb");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = "rgba(0, 100, 0, 0.1)"; // 遠山意象
                    ctx.beginPath();
                    ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.lineTo(w, h*0.6); ctx.lineTo(0, h*0.8);
                    ctx.fill();
                    break;
                case 'garden': // 御花園：粉色浪漫
                    gradient = ctx.createLinearGradient(0, 0, w, h);
                    gradient.addColorStop(0, "#fad0c4");
                    gradient.addColorStop(1, "#ffd1ff");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    break;
                case 'dunhuang': // 敦煌：沙漠與壁畫
                    gradient = ctx.createLinearGradient(0, 0, w, 0);
                    gradient.addColorStop(0, "#d35400");
                    gradient.addColorStop(1, "#e67e22");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    break;
                case 'changan': // 月下長安：夜景
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#0d1b2a"); // 深藍夜空
                    gradient.addColorStop(0.4, "#1b263b");
                    gradient.addColorStop(1, "#415a77");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 月亮
                    ctx.beginPath();
                    ctx.arc(w * 0.75, h * 0.2, 50, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 250, 205, 0.9)";
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(w * 0.78, h * 0.18, 45, 0, 2 * Math.PI);
                    ctx.fillStyle = "#0d1b2a";
                    ctx.fill();
                    // 星星
                    for (let i = 0; i < 30; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.random() * w, Math.random() * h * 0.5, Math.random() * 2, 0, 2 * Math.PI);
                        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                        ctx.fill();
                    }
                    break;
                case 'cloudSea': // 仙境雲海
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#e8daef"); // 淺紫
                    gradient.addColorStop(0.3, "#d2b4de");
                    gradient.addColorStop(0.6, "#f5eef8");
                    gradient.addColorStop(1, "#fdfefe");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 雲層
                    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        let cx = Math.random() * w;
                        let cy = h * 0.5 + Math.random() * h * 0.3;
                        ctx.ellipse(cx, cy, 120 + Math.random() * 80, 40 + Math.random() * 30, 0, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    break;
                case 'phoenix': // 鳳凰台：皇家紫金
                    gradient = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w * 0.8);
                    gradient.addColorStop(0, "#4a148c"); // 深紫
                    gradient.addColorStop(0.5, "#6a1b9a");
                    gradient.addColorStop(1, "#1a0033");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    // 金色光芒
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.15)";
                    ctx.lineWidth = 3;
                    for (let i = 0; i < 12; i++) {
                        ctx.beginPath();
                        ctx.moveTo(w/2, h/2);
                        let angle = (i / 12) * Math.PI * 2;
                        ctx.lineTo(w/2 + Math.cos(angle) * w, h/2 + Math.sin(angle) * h);
                        ctx.stroke();
                    }
                    // 金色邊框
                    ctx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                    ctx.lineWidth = 15;
                    ctx.strokeRect(15, 15, w-30, h-30);
                    break;
                default: // 龍門石窟 (作為備用或之前的默認)
                    gradient = ctx.createLinearGradient(0, 0, 0, h);
                    gradient.addColorStop(0, "#2c3e50");
                    gradient.addColorStop(1, "#bdc3c7");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
            }
        }

        /** ctx / cw / ch 省略時使用主畫布（供拍照到暫存 canvas 時傳入） */
        function drawHuadian(landmarks, index, ctx, cw, ch) {
            ctx = ctx || canvasCtx;
            cw = cw == null ? canvasElement.width : cw;
            ch = ch == null ? canvasElement.height : ch;
            const config = huadianAssets[index];
            const img = loadedImages[index];
            
            if (!img || !img.complete) return;
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;

            const pt151 = landmarks[151];
            const cx = pt151.x * cw;
            const cy = pt151.y * ch + config.yOffset;

            const ptLeft = landmarks[33];
            const ptRight = landmarks[263];
            const dx = (ptRight.x - ptLeft.x) * cw; 
            const dy = (ptRight.y - ptLeft.y) * ch;
            const angle = Math.atan2(dy, dx);

            const tL = landmarks[127];
            const tR = landmarks[356];
            const dist = Math.sqrt(Math.pow((tL.x - tR.x) * cw, 2) + Math.pow((tL.y - tR.y) * ch, 2));
            
            const size = dist * 0.28 * config.scale;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            if (iw > 0 && ih > 0) {
                ctx.drawImage(img, -size / 2, -size / 2, size, size);
            } else {
                /* WebKit 部分情況下 SVG 的 naturalWidth 仍為 0，改用 viewBox 對應的 100×100 來源矩形 */
                ctx.drawImage(img, 0, 0, 100, 100, -size / 2, -size / 2, size, size);
            }
            ctx.restore();
        }

        // --- 8. 手勢處理 (獨立邏輯) ---
        /** 垂直選款時：略呈握拳則不用食指 y（防誤觸） */
        function isHandFistRelaxed(landmarks) {
            const wrist = landmarks[0];
            const middleMcp = landmarks[9];
            const handLen = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y) + 0.001;
            const tips = [8, 12, 16, 20];
            let dSum = 0;
            for (const i of tips) {
                dSum += Math.hypot(landmarks[i].x - wrist.x, landmarks[i].y - wrist.y);
            }
            const avgTipToWrist = dSum / 4;
            if (avgTipToWrist / handLen > 0.98) return false;
            const thumbTip = landmarks[4];
            const thumbToWrist = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
            return thumbToWrist / handLen < 1.12;
        }

        function isHandPinchingLm(lm) {
            return Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) < 0.05;
        }

        function lmDist2(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        /**
         * 單手蘭花指（典式）：拇指靠近中指、食指伸出，與「食指－拇指捏合」區隔。
         * 無名指、小指相對收攏，避免與全張開掌混淆。隨機換款需兩隻手同時通過此判斷。
         */
        function isFrontOrchidFinger(landmarks) {
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexMcp = landmarks[5];
            const middleTip = landmarks[12];
            const middleMcp = landmarks[9];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const handLen = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y) + 0.001;

            if (lmDist2(indexTip, thumbTip) / handLen < 0.28) return false;

            if (lmDist2(thumbTip, middleTip) / handLen > 0.52) return false;

            if (!(indexTip.y < indexMcp.y && lmDist2(indexTip, indexMcp) / handLen > 0.42)) return false;

            const idxToWrist = lmDist2(indexTip, wrist);
            if (lmDist2(ringTip, wrist) > idxToWrist * 0.92) return false;
            if (lmDist2(pinkyTip, wrist) > idxToWrist * 0.92) return false;

            return true;
        }

        function maybeTriggerOrchidRandom(orchidPose) {
            const now = Date.now();
            if (orchidPose && !orchidGestureWasActive) {
                if (now - lastOrchidRandomTime >= orchidRandomCooldownMs) {
                    selectRandomNextHuadianStyle();
                    lastOrchidRandomTime = now;
                }
            }
            orchidGestureWasActive = orchidPose;
        }

        /**
         * 吐舌卸妝：用上／下唇內側點（13、14）垂直張開度相對臉寬判斷「明顯張嘴」。
         * 需略大於一般說話開口，以降低誤觸；閉嘴或微張為 false。
         */
        function isTongueOutForUnmakeup(faceLm) {
            const upper = faceLm[13];
            const lower = faceLm[14];
            if (!upper || !lower) return false;
            const faceW = lmDist2(faceLm[234], faceLm[454]) + 0.001;
            const vertOpen = lower.y - upper.y;
            const ratio = vertOpen / faceW;
            // 略放寬區間，避免實機上「怎麼做都卸不了妝」
            if (ratio < 0.085 || ratio > 0.5) return false;
            const mouthW = lmDist2(faceLm[61], faceLm[291]) + 0.001;
            const wRatio = mouthW / faceW;
            if (wRatio < 0.19 || wRatio > 0.65) return false;
            return true;
        }

        function updateTongueUnmakeupGesture(faceLm) {
            tongueUnmakeupPose = isTongueOutForUnmakeup(faceLm);
            if (!tongueUnmakeupPose) {
                cheekFistStartTime = 0;
                cheekUnmakeupArmed = true;
                return;
            }
            if (selectedIndex < 0) {
                cheekFistStartTime = 0;
                return;
            }
            if (!cheekUnmakeupArmed) return;
            if (cheekFistStartTime === 0) cheekFistStartTime = Date.now();
            if (Date.now() - cheekFistStartTime >= cheekFistHoldDuration) {
                selectHuadian(-1);
                posPickCandidate = -1;
                cheekFistStartTime = 0;
                cheekUnmakeupArmed = false;
                lastClickTime = Date.now();
            }
        }

        function isCursorOverStage(cursorX, cursorY) {
            const stageEl = document.getElementById('stage-container');
            if (!stageEl) return false;
            const r = stageEl.getBoundingClientRect();
            return cursorX >= r.left && cursorX <= r.right && cursorY >= r.top && cursorY <= r.bottom;
        }

        /**
         * 食指指尖 normalized y：畫面上方 → 第一款，愈靠下 → 序位愈後。
         * 需在鏡像區內、且非捏合／非握拳；同一序位穩定 posPickStableMs 後才 selectHuadian。
         */
        function tryVerticalPositionPickHuadian(landmarks) {
            const n = huadianAssets.length;
            if (n <= 0) return;
            const ny = landmarks[8].y;
            const topPad = 0.07;
            const botPad = 0.07;
            const usable = 1 - topPad - botPad;
            const t = usable > 0 ? Math.min(1, Math.max(0, (ny - topPad) / usable)) : 0;
            let idx = Math.min(n - 1, Math.floor(n * t));
            if (idx < 0) idx = 0;
            const now = Date.now();
            if (idx !== posPickCandidate) {
                posPickCandidate = idx;
                posPickCandidateSince = now;
                return;
            }
            if (now - posPickCandidateSince >= posPickStableMs && selectedIndex !== idx) {
                selectHuadian(idx);
            }
        }

        function processHandGestures(multiHands) {
            if (!multiHands || multiHands.length === 0) return;
            const landmarks = multiHands[0];
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            // 鏡像座標轉換（仍以第一隻偵測到的手為游標）
            const cursorX = (1 - indexTip.x) * window.innerWidth;
            const cursorY = indexTip.y * window.innerHeight;

            cursor.style.display = 'block';
            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
            const pinchThreshold = 0.05;
            const isPinchingNow = pinchDist < pinchThreshold;

            const dualOrchidPose =
                multiHands.length >= 2 &&
                isFrontOrchidFinger(multiHands[0]) &&
                isFrontOrchidFinger(multiHands[1]);

            // 卸妝改由人臉網格偵測吐舌（updateTongueUnmakeupGesture）；此處僅讀 tongueUnmakeupPose 暫停垂直選款
            // 垂直選款：捏合、吐舌卸妝姿勢、雙手蘭花指、或單手呈握拳時不用食指 y
            if (!isPinchingNow && !tongueUnmakeupPose && !isHandFistRelaxed(landmarks) && !dualOrchidPose && isCursorOverStage(cursorX, cursorY)) {
                tryVerticalPositionPickHuadian(landmarks);
            } else {
                posPickCandidate = -1;
            }

            // 捏合：點擊光標下的按鈕（花鈿或卸妝）
            const elements = document.elementsFromPoint(cursorX, cursorY);
            let targetBtn = null;
            for (let el of elements) {
                if (el.classList.contains('huadian-btn') || el.classList.contains('reset-btn')) {
                    targetBtn = el;
                    break;
                }
            }

            if (lastHoveredElement && lastHoveredElement !== targetBtn) {
                lastHoveredElement.classList.remove('hover');
            }
            if (targetBtn) {
                targetBtn.classList.add('hover');
                lastHoveredElement = targetBtn;
            } else {
                lastHoveredElement = null;
            }

            if (pinchDist < pinchThreshold) {
                if (!isPinching) {
                    cursor.classList.add('clicking');
                    if (targetBtn) triggerClick(targetBtn);
                }
                isPinching = true;
            } else {
                cursor.classList.remove('clicking');
                isPinching = false;
            }

            maybeTriggerOrchidRandom(dualOrchidPose);
        }

        async function startApp() {
            await initHuadianUi();
            setupMenuTapDelegation();
            loadTangBackgrounds();
            loadAudioTracks();
            initModels();
        }

        startApp();

    </script>
