name = "peachblossom-api-secure"
main = "src/index.ts"
compatibility_date = "2026-04-24"
workers_dev = true

routes = [
  { pattern = "api.peachspring.cc", zone_name = "peachspring.cc", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://peachspring.cc,https://www.peachspring.cc,http://localhost:3200"
AUTH_VERIFY_URL = "https://auth.peachspring.cc/auth/session"
UPSTREAM_BASE_URL = "https://api.openai.com"
