<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃花源 - 數位古風體驗平台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --bg: oklch(0.975 0.014 8);
            --bg-soft: oklch(0.953 0.018 8);
            --surface: oklch(0.988 0.01 8 / 0.9);
            --surface-strong: oklch(0.955 0.018 8 / 0.92);
            --line: oklch(0.852 0.03 10 / 0.7);
            --line-strong: oklch(0.72 0.06 10 / 0.55);
            --text: oklch(0.305 0.06 8);
            --text-soft: oklch(0.49 0.04 10);
            --accent: oklch(0.61 0.17 10);
            --accent-deep: oklch(0.42 0.11 8);
            --accent-soft: oklch(0.84 0.06 12);
            --shadow-soft: 0 24px 60px oklch(0.53 0.09 8 / 0.08);
            --shadow-float: 0 18px 40px oklch(0.48 0.08 8 / 0.12);
            --space-2xs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --space-3xl: 64px;
            --space-4xl: 96px;
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 14%, oklch(0.99 0.012 10) 0%, transparent 28%),
                radial-gradient(circle at 86% 10%, oklch(0.92 0.045 8 / 0.55) 0%, transparent 24%),
                radial-gradient(circle at 78% 64%, oklch(0.94 0.026 30 / 0.42) 0%, transparent 22%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 54%, oklch(0.965 0.018 16) 100%);
            color: var(--text);
            font-family: "Noto Sans TC", sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            pointer-events: none;
            z-index: 0;
            filter: blur(18px);
            opacity: 0.65;
            animation: drift 15s var(--ease-out-quint) infinite alternate;
        }

        body::before {
            top: 14vh;
            left: -32px;
            width: 180px;
            height: 88px;
            border-radius: 999px;
            background: linear-gradient(135deg, oklch(0.91 0.07 12 / 0.7), oklch(0.96 0.025 20 / 0.14));
            transform: rotate(-18deg);
        }

        body::after {
            right: -46px;
            bottom: 14vh;
            width: 220px;
            height: 110px;
            border-radius: 999px;
            background: linear-gradient(135deg, oklch(0.9 0.055 8 / 0.56), oklch(0.97 0.02 24 / 0.1));
            transform: rotate(22deg);
            animation-duration: 18s;
        }

        a {
            color: inherit;
        }

        .site-shell {
            position: relative;
            z-index: 1;
            width: min(1180px, calc(100vw - 40px));
            margin: 0 auto;
            padding: 22px 0 42px;
        }

        .auth-bar-wrap {
            position: fixed;
            top: 18px;
            right: 20px;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            max-width: min(92vw, 560px);
        }

        #peachblossom-auth-bar {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: var(--space-xs) var(--space-sm);
            min-height: 48px;
            padding: 9px 10px 9px 14px;
            border: 1px solid color-mix(in oklch, var(--line-strong) 54%, transparent);
            border-radius: 999px;
            background: color-mix(in oklch, var(--surface) 92%, transparent);
            box-shadow: 0 10px 30px oklch(0.48 0.08 8 / 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .auth-status,
        .auth-user {
            font-size: 0.93rem;
            color: var(--text-soft);
        }

        .auth-user {
            max-width: min(52vw, 280px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .auth-warn {
            color: oklch(0.46 0.16 24);
        }

        .auth-btn {
            cursor: pointer;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font: inherit;
            font-size: 0.94rem;
            font-weight: 600;
            color: var(--accent-deep);
            background: linear-gradient(
                135deg,
                color-mix(in oklch, var(--surface) 90%, var(--accent-soft) 10%) 0%,
                color-mix(in oklch, var(--surface-strong) 78%, var(--accent-soft) 22%) 100%
            );
            box-shadow: 0 10px 20px oklch(0.5 0.09 10 / 0.08);
            transition:
                transform 180ms var(--ease-out-quart),
                box-shadow 180ms var(--ease-out-quart),
                background-color 180ms var(--ease-out-quart);
        }

        .auth-btn:hover,
        .auth-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px oklch(0.48 0.09 8 / 0.12);
            outline: none;
        }

        .auth-btn:active {
            transform: translateY(1px);
        }

        .auth-btn-out {
            background: color-mix(in oklch, var(--surface) 94%, transparent);
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.8fr);
            gap: clamp(28px, 4vw, 72px);
            align-items: end;
            padding: clamp(96px, 12vw, 140px) 0 clamp(36px, 5vw, 56px);
        }

        .hero-copy {
            display: grid;
            gap: var(--space-lg);
        }

        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            width: fit-content;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .hero-kicker::before {
            content: "";
            width: 42px;
            height: 1px;
            background: color-mix(in oklch, var(--line-strong) 74%, transparent);
        }

        .hero-title-wrap {
            display: grid;
            gap: var(--space-md);
        }

        .hero-logo {
            width: 74px;
            height: 74px;
            color: var(--accent);
            filter: drop-shadow(0 18px 24px oklch(0.65 0.12 10 / 0.16));
            animation: blossomFloat 8s var(--ease-out-quint) infinite;
        }

        h1 {
            font-family: "ZCOOL XiaoWei", "Noto Serif TC", serif;
            font-size: clamp(3.8rem, 11vw, 6.9rem);
            font-weight: 400;
            line-height: 0.96;
            letter-spacing: 0.08em;
            color: var(--accent-deep);
        }

        .hero-summary {
            max-width: 32ch;
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--text-soft);
        }

        .hero-note {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm) var(--space-lg);
            font-size: 0.92rem;
            color: var(--text-soft);
        }

        .hero-note span {
            position: relative;
            padding-left: var(--space-md);
        }

        .hero-note span::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.72em;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: color-mix(in oklch, var(--accent) 78%, var(--surface) 22%);
        }

        .hero-aside {
            display: grid;
            gap: var(--space-lg);
            justify-items: end;
            text-align: right;
        }

        .aside-panel {
            width: min(100%, 320px);
            display: grid;
            gap: var(--space-md);
            padding: var(--space-xl) 0 0;
            border-top: 1px solid color-mix(in oklch, var(--line-strong) 76%, transparent);
        }

        .aside-label {
            font-size: 0.78rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .aside-poem {
            font-family: "Noto Serif TC", serif;
            font-size: 1.1rem;
            line-height: 1.85;
            color: var(--text);
        }

        .aside-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-soft);
        }

        main {
            display: grid;
            gap: clamp(40px, 6vw, 72px);
        }

        .section-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: var(--space-xl);
            padding: 0 0 var(--space-lg);
            border-bottom: 1px solid color-mix(in oklch, var(--line) 88%, transparent);
        }

        .section-title {
            display: grid;
            gap: var(--space-xs);
        }

        .section-title small {
            font-size: 0.78rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .section-title h2 {
            font-family: "Noto Serif TC", serif;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            font-weight: 500;
            color: var(--accent-deep);
        }

        .section-copy {
            max-width: 34ch;
            font-size: 0.96rem;
            line-height: 1.75;
            color: var(--text-soft);
            text-align: right;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: clamp(20px, 2.6vw, 30px);
            padding: var(--space-sm) 0 0;
        }

        .app-card {
            --app-accent: oklch(0.7 0.11 10);
            position: relative;
            display: grid;
            justify-items: center;
            align-content: start;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-xs) var(--space-xl);
            text-align: center;
            text-decoration: none;
            color: inherit;
            border-radius: 28px;
            outline: none;
            opacity: 0;
            transform: translateY(18px);
            animation: cardReveal 700ms var(--ease-out-quint) forwards;
        }

        .app-card:nth-child(1) { animation-delay: 80ms; }
        .app-card:nth-child(2) { animation-delay: 150ms; }
        .app-card:nth-child(3) { animation-delay: 220ms; }
        .app-card:nth-child(4) { animation-delay: 290ms; }
        .app-card:nth-child(6) { animation-delay: 430ms; }

        .app-card::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 44px;
            height: 1px;
            transform: translateX(-50%);
            background: color-mix(in oklch, var(--app-accent) 38%, var(--line) 62%);
            opacity: 0.56;
            transition:
                width 240ms var(--ease-out-quart),
                opacity 240ms var(--ease-out-quart);
        }

        .app-card:hover,
        .app-card:focus-visible {
            transform: translateY(-6px);
        }

        .app-card:hover::after,
        .app-card:focus-visible::after {
            width: 76px;
            opacity: 1;
        }

        .app-card:focus-visible {
            box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--app-accent) 38%, transparent);
        }

        .app-icon-shell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 24%, color-mix(in oklch, var(--app-accent) 16%, var(--surface) 84%) 0%, transparent 38%),
                radial-gradient(circle at 50% 50%, color-mix(in oklch, var(--surface-strong) 90%, var(--app-accent) 10%) 0%, transparent 72%);
            box-shadow:
                inset 0 0 0 1px color-mix(in oklch, var(--app-accent) 18%, var(--line) 82%),
                var(--shadow-soft);
            transition:
                transform 240ms var(--ease-out-quart),
                box-shadow 240ms var(--ease-out-quart),
                background 240ms var(--ease-out-quart);
            overflow: hidden;
        }

        .app-icon-shell::before,
        .app-icon-shell::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
            transition:
                opacity 240ms var(--ease-out-quart),
                transform 240ms var(--ease-out-quart);
        }

        .app-icon-shell::before {
            width: 72%;
            height: 72%;
            background: radial-gradient(circle, color-mix(in oklch, var(--app-accent) 18%, transparent) 0%, transparent 72%);
            opacity: 0.72;
            animation: haloPulse 8s ease-in-out infinite;
        }

        .app-icon-shell::after {
            width: 34px;
            height: 96px;
            top: 12px;
            left: 16px;
            background: linear-gradient(180deg, oklch(0.99 0.01 8 / 0.7), transparent);
            transform: rotate(24deg);
            opacity: 0.65;
        }

        .app-card:hover .app-icon-shell,
        .app-card:focus-visible .app-icon-shell {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                inset 0 0 0 1px color-mix(in oklch, var(--app-accent) 34%, var(--line) 66%),
                var(--shadow-float);
        }

        .app-card:hover .app-icon-shell::after,
        .app-card:focus-visible .app-icon-shell::after {
            transform: translateX(8px) rotate(24deg);
            opacity: 0.88;
        }

        .app-icon {
            position: relative;
            z-index: 1;
            font-size: 3.6rem;
            color: color-mix(in oklch, var(--app-accent) 62%, var(--accent-deep) 38%);
            transition:
                transform 240ms var(--ease-out-quart),
                color 240ms var(--ease-out-quart),
                filter 240ms var(--ease-out-quart);
            filter: drop-shadow(0 14px 20px color-mix(in oklch, var(--app-accent) 14%, transparent));
        }

        svg.app-icon {
            display: block;
            width: 1.12em;
            height: 1.12em;
        }

        .app-card:hover .app-icon,
        .app-card:focus-visible .app-icon {
            transform: scale(1.06);
            color: color-mix(in oklch, var(--app-accent) 78%, var(--accent-deep) 22%);
            filter: drop-shadow(0 16px 22px color-mix(in oklch, var(--app-accent) 22%, transparent));
        }

        .app-name {
            max-width: 15ch;
            font-family: "Noto Serif TC", serif;
            font-size: 1.08rem;
            font-weight: 500;
            line-height: 1.45;
            color: var(--accent-deep);
        }

        /* 雙語應用：中文第一行、英文譯名第二行（英文用 em，隨 .app-name 字級縮放） */
        .app-card .app-name--bilingual {
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.22em;
            line-height: 1.35;
        }

        .app-card .app-name--bilingual .app-name-zh {
            display: block;
            font-size: 1em;
            font-weight: 500;
            color: inherit;
        }

        .app-card .app-name--bilingual .app-name-en {
            display: block;
            font-family: "Noto Sans TC", sans-serif;
            font-size: 0.94em;
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1.3;
            color: var(--text-soft);
        }

        .app-card-copy {
            max-width: 22ch;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-soft);
        }

        .app-card-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--space-xs);
            margin-top: auto;
        }

        .app-card-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 88px;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid color-mix(in oklch, var(--app-accent) 20%, var(--line) 80%);
            background: color-mix(in oklch, var(--surface) 88%, var(--app-accent) 12%);
            color: var(--accent-deep);
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1;
            text-decoration: none;
            transition:
                transform 180ms var(--ease-out-quart),
                box-shadow 180ms var(--ease-out-quart),
                background-color 180ms var(--ease-out-quart);
        }

        .app-card-link:hover,
        .app-card-link:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px color-mix(in oklch, var(--app-accent) 10%, transparent);
            outline: none;
        }

        .app-card-link--secondary {
            background: color-mix(in oklch, var(--surface-strong) 92%, transparent);
        }

        .app-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 18px);
            width: min(270px, calc(100vw - 40px));
            padding: 14px 16px;
            border: 1px solid color-mix(in oklch, var(--line-strong) 64%, transparent);
            border-radius: 18px;
            background: color-mix(in oklch, oklch(0.985 0.008 8) 94%, transparent);
            color: var(--text);
            font-size: 0.92rem;
            line-height: 1.7;
            box-shadow: 0 18px 42px oklch(0.48 0.08 8 / 0.12);
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(8px);
            transition:
                opacity 200ms var(--ease-out-quart),
                transform 200ms var(--ease-out-quart);
            z-index: 8;
        }

        .app-tooltip::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 14px;
            height: 14px;
            border-right: 1px solid color-mix(in oklch, var(--line-strong) 64%, transparent);
            border-bottom: 1px solid color-mix(in oklch, var(--line-strong) 64%, transparent);
            background: color-mix(in oklch, oklch(0.985 0.008 8) 94%, transparent);
            transform: translateX(-50%) rotate(45deg);
        }

        .app-card:hover .app-tooltip,
        .app-card:focus-visible .app-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .author-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-xl);
            margin-top: var(--space-2xl);
            padding-top: var(--space-xl);
            border-top: 1px solid color-mix(in oklch, var(--line) 88%, transparent);
        }

        .author-card {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            text-decoration: none;
        }

        .author-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            color: var(--accent);
            background: radial-gradient(circle at 30% 30%, color-mix(in oklch, var(--accent-soft) 30%, var(--surface) 70%) 0%, transparent 72%);
            box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--line) 88%, transparent);
            transition: transform 220ms var(--ease-out-quart), box-shadow 220ms var(--ease-out-quart);
        }

        .author-card:hover .author-avatar,
        .author-card:focus-visible .author-avatar {
            transform: translateY(-2px);
            box-shadow:
                inset 0 0 0 1px color-mix(in oklch, var(--line-strong) 64%, transparent),
                0 14px 26px oklch(0.5 0.08 8 / 0.1);
        }

        .author-info {
            display: grid;
            gap: var(--space-2xs);
        }

        .author-info h3 {
            font-family: "Noto Serif TC", serif;
            font-size: 1.18rem;
            font-weight: 500;
            color: var(--accent-deep);
        }

        .author-info p,
        .author-link {
            font-size: 0.95rem;
            color: var(--text-soft);
        }

        footer {
            margin-top: var(--space-2xl);
            padding: var(--space-xl) 0 var(--space-sm);
            border-top: 1px solid color-mix(in oklch, var(--line) 88%, transparent);
            display: grid;
            gap: var(--space-sm);
            color: var(--text-soft);
            font-size: 0.93rem;
        }

        .footer-poem {
            font-family: "Noto Serif TC", serif;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
        }

        .footer-meta a {
            color: var(--accent-deep);
            text-decoration: none;
        }

        @keyframes blossomFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes drift {
            from {
                transform: translate3d(0, 0, 0) rotate(-12deg);
            }
            to {
                transform: translate3d(10px, 16px, 0) rotate(10deg);
            }
        }

        @keyframes haloPulse {
            0%, 100% {
                transform: scale(0.94);
                opacity: 0.52;
            }
            50% {
                transform: scale(1.03);
                opacity: 0.82;
            }
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-aside {
                justify-items: start;
                text-align: left;
            }

            .section-head {
                flex-direction: column;
                align-items: start;
            }

            .section-copy {
                text-align: left;
            }

            .author-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 720px) {
            .site-shell {
                width: min(100vw - 28px, 1180px);
                padding-top: 16px;
            }

            .auth-bar-wrap {
                top: 12px;
                left: 14px;
                right: 14px;
                justify-content: center;
            }

            #peachblossom-auth-bar {
                justify-content: center;
            }

            .hero {
