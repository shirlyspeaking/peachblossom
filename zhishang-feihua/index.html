<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 線上版網址（只改這一行雙引號裡即可）。若 Cloudflare 給的網址不同，整段換成你的 https://… -->
    <meta name="zhishang-feihua-app-url" content="https://zhishang-feihua.pages.dev">
    <title>指上飛花 · 桃花源</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: oklch(0.975 0.014 8);
            --text: oklch(0.305 0.06 8);
            --soft: oklch(0.49 0.04 10);
            --accent: oklch(0.55 0.14 350);
            --line: oklch(0.852 0.03 10 / 0.7);
        }
        body {
            min-height: 100vh;
            font-family: "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            border-radius: 24px;
            border: 1px solid var(--line);
            background: oklch(0.99 0.008 8 / 0.95);
            box-shadow: 0 20px 50px oklch(0.5 0.06 8 / 0.08);
            padding: 36px 28px 32px;
            text-align: center;
        }
        h1 {
            font-family: "Noto Serif TC", serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: oklch(0.38 0.1 350);
            margin-bottom: 10px;
        }
        p { color: var(--soft); line-height: 1.75; font-size: 0.95rem; margin-bottom: 14px; }
        .muted { font-size: 0.85rem; opacity: 0.9; }
        a.btn {
            display: inline-block;
            margin-top: 8px;
            padding: 12px 26px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            color: oklch(0.99 0.01 8);
            background: linear-gradient(135deg, oklch(0.55 0.14 350), oklch(0.45 0.12 8));
            box-shadow: 0 8px 20px oklch(0.5 0.1 350 / 0.2);
        }
        a.btn[aria-disabled="true"] {
            opacity: 0.45;
            pointer-events: none;
        }
        a.back {
            display: inline-block;
            margin-top: 22px;
            font-size: 0.9rem;
            color: var(--accent);
        }
        code {
            font-size: 0.8rem;
            background: oklch(0.94 0.02 8);
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>指上飛花</h1>
        <p>桃花源 · 中文輸入練習。請按下方按鈕進入線上版（網址已寫在原始碼第 7 行，之後若要改只改那一行即可）。</p>
        <p class="muted">本機開發可先執行 <code>npm run dev</code>（埠 3210），或在瀏覽器主控台執行 <code>localStorage.setItem(&quot;zhishang_feihua_app_url&quot;,&quot;http://localhost:3210&quot;)</code> 後重新整理本頁，按鈕會改連本機。</p>
        <p><a id="enter-app" class="btn" href="#">正在讀取網址…</a></p>
        <a class="back" href="../index.html">← 返回桃花源首頁</a>
    </div>
    <script>
        (function () {
            var meta = document.querySelector('meta[name="zhishang-feihua-app-url"]');
            var url = (meta && meta.getAttribute("content") || "").trim();
            try {
                var fromStorage = localStorage.getItem("zhishang_feihua_app_url");
                if (fromStorage) url = String(fromStorage).trim();
            } catch (e) {}
            var btn = document.getElementById("enter-app");
            if (!btn) return;
            if (url && /^https?:\/\//i.test(url)) {
                btn.href = url;
                btn.textContent = "進入指上飛花（線上版）";
                btn.setAttribute("aria-disabled", "false");
            } else {
                btn.href = "#";
                btn.textContent = "尚未設定線上網址";
                btn.setAttribute("aria-disabled", "true");
            }
        })();
    </script>
</body>
</html>
