<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 避免舊版 HTML／靜態資源被強快取，導致看不到字帖頁更新 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>桃花源 · 書法字帖</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="preload" href="fonts/YshiPenShutiTC-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css?v=83">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@2.4.5/dist/html2canvas-pro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body data-theme="jun">
    <div class="petals" id="petals" aria-hidden="true"></div>

    <header class="site-header">
        <div class="header-left">
            <a href="../index.html" class="back-link">← 返回桃花源</a>
            <div class="brand">
                <h1>書法字帖</h1>
                <span class="seal" aria-label="桃源印">桃源</span>
            </div>
        </div>
        <div class="header-right">
            <div class="theme-picker" role="radiogroup" aria-label="配色">
                <button type="button" class="theme-chip" role="radio" data-theme="jun" aria-checked="true"><span class="theme-dot theme-dot--jun"></span>鈞窯</button>
                <button type="button" class="theme-chip" role="radio" data-theme="ru" aria-checked="false"><span class="theme-dot theme-dot--ru"></span>汝窯</button>
                <button type="button" class="theme-chip" role="radio" data-theme="ding" aria-checked="false"><span class="theme-dot theme-dot--ding"></span>定窯</button>
            </div>
            <button type="button" id="btnPetals" class="petal-toggle" aria-pressed="true" title="頁面背景的落花">
                <span class="petal-toggle-track" aria-hidden="true"><span class="petal-toggle-knob"></span></span>落英
            </button>
        </div>
    </header>

    <main class="layout">
        <aside class="panel" id="panel" aria-label="字帖設定">
            <div class="panel-sheet-head">
                <span>字帖設定</span>
                <button type="button" class="btn-text" id="btnPanelClose">收起</button>
            </div>
            <section class="panel-section">
                <div class="mode-tabs" role="tablist" aria-label="字帖類型">
                    <button type="button" class="mode-tab is-active" role="tab" id="tabFree" aria-selected="true" aria-controls="panelFree">字帖</button>
                    <button type="button" class="mode-tab" role="tab" id="tabStroke" aria-selected="false" aria-controls="panelStroke" tabindex="-1">筆順字帖</button>
                </div>

                <div id="panelFree" class="mode-panel" role="tabpanel" aria-labelledby="tabFree">
                    <label for="textInput">字帖內容</label>
                    <textarea id="textInput" class="content-input" rows="5" placeholder="春眠不覺曉，處處聞啼鳥。&#10;夜來風雨聲，花落知多少。"></textarea>
                </div>
                <div id="panelStroke" class="mode-panel" role="tabpanel" aria-labelledby="tabStroke" hidden>
                    <div class="field-head">
                        <label for="autoStrokeChars">筆順字帖內容</label>
                        <span class="field-hint" id="strokeHint" role="status" hidden></span>
                    </div>
                    <textarea id="autoStrokeChars" class="content-input" rows="5" placeholder="桃花源"></textarea>
                </div>

                <div class="settings">
                    <div class="field-row">
                    <div class="field">
                        <label for="fontPreset">字體</label>
                        <select id="fontPreset">
                            <option value="'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif" selected>楷體</option>
                            <option value="'YShiPenShutiTC', 'Kaiti TC', 'STKaiti', 'KaiTi', serif">Y式筆書（毛筆）</option>
                            <option id="fontOptChenyu" value="'ChenYuluoyan', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">辰宇落雁體</option>
                            <option value="'全字庫說文解字', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">全字庫說文解字</option>
                            <option value="'Songti TC', 'SimSun', 'Noto Serif TC', serif">宋體</option>
                            <option value="'PingFang TC', 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif">黑體</option>
                            <option value="'FangSong', 'STFangsong', 'Noto Serif TC', serif">仿宋</option>
                            <option value="'Hiragino Maru Gothic ProN', 'YuGothic', 'Microsoft JhengHei', sans-serif">圓體</option>
                            <option value="'Microsoft JhengHei', 'PingFang TC', sans-serif">微軟正黑體</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="copyStyle">字帖版本</label>
                        <select id="copyStyle">
                            <option value="standard">標準墨色</option>
                            <option value="hong">鏤空描紅</option>
                            <option value="lightPinkHong" selected>淺粉色描紅</option>
                        </select>
                    </div>
                    </div>

                    <div class="field">
                        <div class="field-head">
                            <label for="fontSize">字體大小</label>
                            <output id="fontSizeValue" for="fontSize">36</output>
                        </div>
                        <input id="fontSize" type="range" min="18" max="72" step="1" value="36">
                    </div>

                    <div class="field">
                        <span class="field-label" id="bgLabel">字帖背景</span>
                        <div class="bg-grid" role="radiogroup" aria-labelledby="bgLabel">
                            <button type="button" class="bg-tile is-selected" role="radio" aria-checked="true" data-bg="none">
                                <span class="bg-thumb bg-thumb--none"></span><span class="bg-name">無</span>
                            </button>
                            <button type="button" class="bg-tile" role="radio" aria-checked="false" data-bg="plum">
                                <img class="bg-thumb" src="backgrounds/thumbs/plum.jpg?v=4" alt=""><span class="bg-name">梅花</span>
                            </button>
                            <button type="button" class="bg-tile" role="radio" aria-checked="false" data-bg="orchid">
                                <img class="bg-thumb" src="backgrounds/thumbs/orchid.jpg?v=4" alt=""><span class="bg-name">蘭花</span>
                            </button>
                            <button type="button" class="bg-tile" role="radio" aria-checked="false" data-bg="bamboo">
                                <img class="bg-thumb" src="backgrounds/thumbs/bamboo.jpg?v=4" alt=""><span class="bg-name">竹子</span>
                            </button>
                            <button type="button" class="bg-tile" role="radio" aria-checked="false" data-bg="chrysanthemum">
                                <img class="bg-thumb" src="backgrounds/thumbs/chrysanthemum.jpg?v=4" alt=""><span class="bg-name">菊花</span>
                            </button>
                            <button type="button" class="bg-tile" role="radio" aria-checked="false" data-bg="peony">
                                <img class="bg-thumb" src="backgrounds/thumbs/peony.jpg?v=4" alt=""><span class="bg-name">牡丹</span>
                            </button>
                            <button type="button" class="bg-tile bg-tile--upload" role="radio" aria-checked="false" data-bg="upload" id="btnBgImageUpload" title="上傳圖片作為字帖背景">
                                <span class="bg-thumb bg-thumb--upload" id="bgUploadThumb"><span class="bg-plus" aria-hidden="true">＋</span></span><span class="bg-name">上傳</span>
                            </button>
                        </div>
                        <input id="bgImageInput" type="file" accept="image/*" hidden>
                        <button type="button" id="btnBgImageClear" class="btn-text bg-clear" hidden>清除上傳的背景</button>
                    </div>

                    <div class="field-row">
                    <div class="field">
                        <label for="gridType">格線樣式</label>
                        <select id="gridType">
                            <option value="tian">田字格</option>
                            <option value="mi">米字格</option>
                            <option value="blank">空白格</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="pageSize">紙張方向</label>
                        <select id="pageSize">
                            <option value="a4">A4 直式</option>
                            <option value="a4l">A4 橫式</option>
                        </select>
                    </div>
                    </div>
                </div>
                <div class="panel-pdf">
                    <button id="btnPdf" type="button" class="btn-primary btn-block">下載 PDF</button>
                </div>
            </section>
        </aside>

        <section class="preview-col">
            <div class="preview-toolbar">
                <button type="button" class="btn-secondary panel-open" id="btnPanelOpen">設定</button>
                <button id="btnPdfMobile" type="button" class="btn-primary btn-pdf">下載 PDF</button>
            </div>
            <div class="preview-wrap" id="previewWrap">
                <div id="preview" class="preview" aria-live="polite"></div>
            </div>
        </section>
        <div class="panel-backdrop" id="panelBackdrop" hidden></div>
    </main>

    <div id="pdfPreviewModal" class="pdf-modal" hidden>
        <div class="pdf-modal-backdrop"></div>
        <div class="pdf-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="pdfPreviewTitle" tabindex="-1">
            <header class="pdf-modal-header">
                <h2 id="pdfPreviewTitle">PDF 預覽</h2>
                <p class="pdf-modal-sub" id="pdfPreviewSub">看過之後，再按確認下載</p>
                <button type="button" class="pdf-modal-x" id="pdfPreviewClose" aria-label="關閉預覽">×</button>
            </header>
            <div class="pdf-modal-body" id="pdfPreviewPages"></div>
            <footer class="pdf-modal-footer">
                <button type="button" class="btn-secondary pdf-modal-cancel" id="pdfPreviewCancel">先不要</button>
                <button type="button" class="btn-primary pdf-modal-download" id="pdfPreviewDownload">確認下載</button>
            </footer>
        </div>
    </div>

    <script src="app.js?v=88"></script>
</body>
</html>
