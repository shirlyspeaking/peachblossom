<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 避免舊版 HTML／靜態資源被強快取，導致看不到字帖頁更新 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>桃花源 · 書法字帖生成</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=41">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <a href="../index.html" class="back-link">← 返回桃花源</a>
            <h1>書法字帖生成平台</h1>
        </div>
        <div class="theme-picker">
            <span class="theme-label">配色</span>
            <button type="button" class="theme-dot theme-dot--pink active" data-theme="pink" title="桃花"></button>
            <button type="button" class="theme-dot theme-dot--green" data-theme="green" title="藕綠"></button>
            <button type="button" class="theme-dot theme-dot--blue" data-theme="blue" title="汝窯"></button>
            <button type="button" class="theme-dot theme-dot--silver" data-theme="silver" title="月白"></button>
            <div class="bg-upload">
                <input id="bgImageInput" type="file" accept="image/*" hidden>
                <button type="button" id="btnBgImageUpload" class="bg-upload-btn" title="上傳圖片作為字帖背景">上傳背景</button>
                <button type="button" id="btnBgImageClear" class="bg-upload-clear" hidden title="清除上傳背景">清除</button>
            </div>
        </div>
    </header>

    <main class="layout">
        <aside class="panel" aria-label="字帖選項">
            <section class="panel-section">
                <h2 class="panel-section-title">自由字帖生成</h2>
                <label for="textInput">字帖內容</label>
                <textarea id="textInput" rows="5" placeholder="請輸入要練習的文字">春眠不覺曉，處處聞啼鳥。
夜來風雨聲，花落知多少。</textarea>
                <button id="btnGenerate" type="button" class="btn-generate">生成字帖</button>
                <details class="tune-details">
                    <summary>
                        <span>字體與樣式</span>
                        <span class="tune-chevron" aria-hidden="true"></span>
                    </summary>
                    <div class="tune-details-body">
                        <p class="tune-group-label">基礎設置</p>
                        <div class="field">
                            <label for="fontPreset">字體選擇</label>
                            <select id="fontPreset">
                                <option value="'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">楷體</option>
                                <option id="fontOptChenyu" value="'ChenYuluoyan', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">辰宇落雁體</option>
                                <option value="'YShiPenShutiTC', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">Y式筆書</option>
                                <option value="'AlimamaDaoLiTi', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">阿里媽媽刀隸體</option>
                                <option value="'全字庫說文解字', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">全字庫說文解字</option>
                                <option value="'Songti TC', 'SimSun', 'Noto Serif TC', serif">宋體</option>
                                <option value="'PingFang TC', 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif">黑體</option>
                                <option value="'FangSong', 'STFangsong', 'Noto Serif TC', serif">仿宋</option>
                                <option value="'Hiragino Maru Gothic ProN', 'YuGothic', 'Microsoft JhengHei', sans-serif">圓體</option>
                                <option value="'Microsoft JhengHei', 'PingFang TC', sans-serif">微軟正黑體</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="copyStyle">字帖版本</label>
                            <select id="copyStyle" name="copyStyle">
                                <option value="standard">標準墨色</option>
                                <option value="hong">描紅（紅框鏤空）</option>
                                <option value="lightPinkHong">淺粉色描紅</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="pageBackground">字帖背景</label>
                            <select id="pageBackground" name="pageBackground">
                                <option value="none">無（紙色）</option>
                                <option value="xuan">宣紙／藏經紙</option>
                                <option value="letter">古代信箋</option>
                                <option value="scroll">仿古捲軸</option>
                                <option value="redLines">朱絲欄紋</option>
                                <option value="cloud">祥雲紋</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="fontSize">字體大小</label>
                            <input id="fontSize" type="number" min="18" max="72" step="1" value="36">
                        </div>
                        <div class="field">
                            <label for="gridType">格線樣式</label>
                            <select id="gridType">
                                <option value="tian">田字格</option>
                                <option value="mi">米字格</option>
                                <option value="blank">空白格</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="pageSize">預覽紙張</label>
                            <select id="pageSize">
                                <option value="a4">A4（直式）</option>
                                <option value="a4l">A4（橫式）</option>
                                <option value="letter">Letter</option>
                            </select>
                        </div>
                    </div>
                </details>
            </section>

            <section class="panel-section panel-section--stroke">
                <h2 class="panel-section-title">筆順字帖生成</h2>
                <label for="autoStrokeChars">筆順字帖輸入</label>
                <textarea id="autoStrokeChars" rows="2" placeholder="輸入漢字；可重複、可換行（例：我我我）"></textarea>
                <button id="btnAutoStrokeFromChars" type="button" class="btn-secondary">生成筆順字帖</button>
                <details class="tune-details">
                    <summary>
                        <span>字體與樣式</span>
                        <span class="tune-chevron" aria-hidden="true"></span>
                    </summary>
                    <div class="tune-details-body">
                        <p class="tune-group-label">基礎設置</p>
                        <div class="field">
                            <label for="fontPresetStroke">字體選擇</label>
                            <select id="fontPresetStroke">
                                <option value="'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">楷體</option>
                                <option id="fontOptChenyuStroke" value="'ChenYuluoyan', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">辰宇落雁體</option>
                                <option value="'YShiPenShutiTC', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">Y式筆書</option>
                                <option value="'AlimamaDaoLiTi', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">阿里媽媽刀隸體</option>
                                <option value="'全字庫說文解字', 'Kaiti TC', 'STKaiti', 'KaiTi', 'Noto Serif TC', serif">全字庫說文解字</option>
                                <option value="'Songti TC', 'SimSun', 'Noto Serif TC', serif">宋體</option>
                                <option value="'PingFang TC', 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif">黑體</option>
                                <option value="'FangSong', 'STFangsong', 'Noto Serif TC', serif">仿宋</option>
                                <option value="'Hiragino Maru Gothic ProN', 'YuGothic', 'Microsoft JhengHei', sans-serif">圓體</option>
                                <option value="'Microsoft JhengHei', 'PingFang TC', sans-serif">微軟正黑體</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="copyStyleStroke">字帖版本</label>
                            <select id="copyStyleStroke" name="copyStyleStroke">
                                <option value="standard">標準墨色</option>
                                <option value="hong">描紅（紅框鏤空）</option>
                                <option value="lightPinkHong">淺粉色描紅</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="pageBackgroundStroke">字帖背景</label>
                            <select id="pageBackgroundStroke" name="pageBackgroundStroke">
                                <option value="none">無（紙色）</option>
                                <option value="xuan">宣紙／藏經紙</option>
                                <option value="letter">古代信箋</option>
                                <option value="scroll">仿古捲軸</option>
                                <option value="redLines">朱絲欄紋</option>
                                <option value="cloud">祥雲紋</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="fontSizeStroke">字體大小</label>
                            <input id="fontSizeStroke" type="number" min="18" max="72" step="1" value="40">
                        </div>
                        <div class="field">
                            <label for="gridTypeStroke">格線樣式</label>
                            <select id="gridTypeStroke">
                                <option value="tian">田字格</option>
                                <option value="mi">米字格</option>
                                <option value="blank">空白格</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="pageSizeStroke">預覽紙張</label>
                            <select id="pageSizeStroke">
                                <option value="a4">A4（直式）</option>
                                <option value="a4l">A4（橫式）</option>
                                <option value="letter">Letter</option>
                            </select>
                        </div>
                    </div>
                </details>
            </section>

            <div class="panel-footer">
                <button id="btnPdf" type="button">下載 PDF</button>
            </div>
        </aside>

        <section class="preview-wrap">
            <div id="preview" class="preview" aria-live="polite"></div>
        </section>
    </main>

    <script src="app.js?v=48"></script>
</body>
</html>
